/* ===================== Copia del informe al cliente ===================== */
// El correo sale de controldegestion@grupotx.cl por el Apps Script, a través de la función terreno-correo (la clave del
// Apps Script nunca llega al navegador). Nada se envía sin la confirmación del PM, y un fallo nunca es silencioso:
// la visita queda guardada y la ficha ofrece "Reintentar envío".
const URL_CORREO = SB_URL + '/functions/v1/terreno-correo';
let enviando = false;

// \`envio\`: { id, huella, para, asunto, cuerpo } de la visita que se envía; \`pdf\`: el informe. Devuelve { ok, error, detalle }.
// Valida de nuevo identidad (registroId) y huella: el informe en memoria puede ser de otra visita (p. ej. "Ver informe" de la lista).
async function enviarCopia(envio, pdf){
  const v = TC.puedeEnviar(pdf, envio);
  if (!v.ok) return { ok: false, error: v.motivo };
  if (TC.tamanoInforme(pdf.blob.size).excede) return { ok: false, error: 'demasiado_grande' };
  const { data } = await sb.auth.getSession();
  const token = data && data.session && data.session.access_token;
  if (!token) return { ok: false, error: 'no_autorizado' };
  let r;
  try {
    r = await fetch(URL_CORREO, {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ registro_id: envio.id, para: envio.para, asunto: envio.asunto, cuerpo: envio.cuerpo, nombre: pdf.nombre, base64: pdf.base64 })
    });
  } catch(e){ return { ok: false, error: 'red' }; }
  const j = await r.json().catch(() => null);
  if (!j) return { ok: false, error: r.status === 401 ? 'no_autorizado' : 'apps_script', detalle: 'respuesta ' + r.status };
  return { ok: j.ok === true, error: j.error, detalle: j.detalle };
}

// Mensaje de espera sobre la pantalla; devuelve la función que lo cierra.
function mostrarOcupado(msg){
  const ov = document.createElement('div');
  ov.className = 'informe-ov'; ov.innerHTML = '<div class="informe-dlg" role="status" style="width:min(360px,100%)"><h2>' + esc(msg) + '</h2><p class="mute">Un momento…</p></div>';
  document.body.appendChild(ov);
  return () => ov.remove();
}

// Confirmación previa: dirección exacta, asunto, peso del adjunto, el mensaje (editable) y el informe mismo ("Ver el informe":
// el blob que se va a adjuntar, sin generarlo de nuevo). Resuelve true solo si el PM pulsa "Enviar"; en ese caso deja el
// texto final en envio.cuerpo. El foco inicial queda en "Cancelar" para que un Enter distraído no envíe.
function confirmarEnvio(envio, pdf, dudoso){   // envio.este: "esta visita" o "este ensayo"
  return new Promise(resolve => {
    const t = TC.tamanoInforme(pdf.blob.size);
    const ov = document.createElement('div');
    ov.id = 'envio-ov'; ov.className = 'informe-ov';
    ov.innerHTML = '<div class="informe-dlg" role="dialog" aria-label="Confirmar envío" style="width:min(560px,100%)">'
      + '<h2>Enviar copia al cliente</h2><p class="mute">Se enviará un correo a:</p>'
      + '<p class="envio-para"><b data-e="para">' + esc(envio.para) + '</b></p>'
      + '<dl class="envio-dl"><dt>Asunto</dt><dd data-e="asunto">' + esc(envio.asunto) + '</dd>'
      + '<dt>Adjunto</dt><dd data-e="adjunto">' + esc(pdf.nombre) + ' · ' + esc(t.texto) + '</dd>'
      + '<dt>Copia a</dt><dd>' + esc(me.email) + ' (tú)</dd></dl>'
      + (dudoso ? '<div class="aviso">Un envío anterior a ' + esc(envio.este) + ' no se pudo confirmar: puede que el cliente ya tenga la copia. Revisa tu bandeja antes de reenviar, o el cliente recibirá el correo dos veces.</div>' : '')
      + (t.excede ? '<div class="aviso">El informe pesa ' + esc(t.texto) + ' y supera los ' + TC.LIMITE_ENVIO_BYTES / 1048576 + ' MB que admite el envío. Reduce las fotos y vuelve a intentarlo.</div>' : '')
      + '<label for="envio-cuerpo" style="margin-top:10px">Mensaje</label><p class="mute" style="margin:0 0 6px;font-size:12px">Puedes agregar una línea para el cliente; el texto debe seguir nombrando al cliente y la obra.</p>'
      + '<textarea id="envio-cuerpo" class="envio-msg" rows="8" maxlength="20000">' + esc(envio.cuerpo) + '</textarea>'
      + '<div class="aviso err" data-e="err" role="alert" hidden></div>'
      + '<div class="acciones"><button type="button" class="btn ghost" data-e="ver">Ver el informe</button><button type="button" class="btn ghost" data-e="cancelar">Cancelar</button>'
      + '<button type="button" class="btn" data-e="enviar"' + (t.excede ? ' disabled' : '') + '>Enviar a ' + esc(envio.para) + '</button></div></div>';
    const cerrar = ok => { cerrarInforme(); ov.remove(); resolve(ok); };
    const err = ov.querySelector('[data-e="err"]'), area = ov.querySelector('#envio-cuerpo');
    area.addEventListener('input', () => { err.hidden = true; });
    ov.querySelector('[data-e="cancelar"]').onclick = () => cerrar(false);
    ov.querySelector('[data-e="ver"]').onclick = () => mostrarInforme(pdf, envio.kind);
    ov.querySelector('[data-e="enviar"]').onclick = () => {
      const falta = TC.validarCuerpoCorreo(area.value, { cliente: envio.cliente, obra: envio.obra });
      if (falta) { err.textContent = falta; err.hidden = false; area.focus(); return; }
      envio.cuerpo = area.value;   // el texto que el PM ve es el que sale
      cerrar(true);
    };
    document.body.appendChild(ov);
    ov.querySelector('[data-e="cancelar"]').focus();
  });
}

// Escribe datos (con el historial de envíos) en el registro y refresca la lista local. true si quedó guardado.
async function anotarEnvio(r, datos){
  const { data, error } = await sb.from('registros').update({ datos }).eq('id', r.id).select('id, updated_at');
  if (error || !data || !data.length) return false;
  // Este UPDATE también subió updated_at en el servidor: al pasarle la versión real, actualizarLocal refresca
  // tanto la lista en memoria como la copia que usa la app sin señal (N1) — si no, "Editar" después de esto
  // daría un CONFLICTO falso, o peor, una corrección sin señal pisaría en silencio este mismo historial.
  actualizarLocal(r.id, { kind: r.kind, fecha: r.fecha, cliente: r.cliente, cliente_id: r.cliente_id, obra: r.obra, estado: r.estado }, datos, r.fotos, data[0].updated_at);
  return true;
}

// El último intento quedó sin confirmar: el PM mira su bandeja (recibe copia) y dice si el correo llegó o no.
async function resolverIntento(id, resultado){
  const r = registros.find(x => x.id === id);
  if (enviando || !r || !TC.puedeEditar(r, me) || !TC.envioDudoso(r._datos)) return;
  const pregunta = resultado === 'llego'
    ? '¿Confirmas que el correo SÍ llegó a tu bandeja? Quedará registrado a tu nombre como prueba de que el cliente recibió el informe y no se puede deshacer.'
    : '¿Confirmas que el correo NO llegó a tu bandeja? Quedará registrado a tu nombre y podrás enviarlo de nuevo.';
  if (!confirm(pregunta)) return;
  const datos = TC.resolverDudoso(r._datos, resultado, me.nombre, new Date().toISOString());
  toast(await anotarEnvio(r, datos) ? (resultado === 'llego' ? 'Listo: el envío quedó como enviado.' : 'Listo: el intento quedó marcado como no salido; puedes enviar de nuevo.') : 'No se pudo guardar el cambio. Inténtalo otra vez.');
  if (vista === 'registros') render();
}

// Prepara el informe de una visita ya guardada, pide confirmación, lo envía y anota el envío en datos.envios.
// Sirve para "Guardar y enviar" y para "Reintentar envío". El informe en memoria solo se reutiliza si es de esta visita
// y de este mismo contenido (identidad + huella); si no, se genera de nuevo.
async function enviarRegistro(id){
  if (enviando) return;
  const r = registros.find(x => x.id === id);
  if (!r || !esInforme(r.kind) || !TC.puedeEditar(r, me)) return toast('No se puede enviar ' + (r ? gen(r.kind).este : 'este registro') + '.');
  if (r._fila) return toast('Disponible cuando se envíe el registro.');
  const g = gen(r.kind);
  const para = String(TC.correoCliente(r.kind, r._datos)).trim();
  if (!TC.correoValido(para)) return toast(r.kind === 'adherencia' ? 'El ensayo no tiene un correo de cliente válido: edítalo y escríbelo en «Correo del cliente».' : 'La visita no tiene un correo de cliente válido: edítala y escríbelo en «Cierre con el cliente».');
  enviando = true;
  try {
    let informe, envio;
    const fin = mostrarOcupado('Preparando el informe');
    try {
      const reg = regParaInforme(r, await fotosComoDataUrl(r.fotos, [], r.kind));
      const huella = huellaTexto(informeHtml(reg));
      informe = TC.puedeEnviar(ultimoInforme, { id: r.id, huella }).ok ? ultimoInforme : (ultimoInforme = await generarPdf(reg));
      const { asunto, cuerpo } = (r.kind === 'adherencia' ? TC.correoEnsayo : TC.correoVisita)({ fecha: r.fecha, cliente: r.cliente, obra: r.obra, datos: r._datos });
      envio = { id: r.id, huella, para, asunto, cuerpo, este: g.este, kind: r.kind, cliente: r.cliente, obra: r.obra };
      const v = TC.puedeEnviar(informe, envio);
      if (!v.ok) throw new Error(TC.textoErrorEnvio(v.motivo, undefined, r.kind));
    } catch(e){
      console.error(e);
      const det = esRed(e) ? 'necesitas señal (las fotos están en el servidor)' : (e.message || 'error');
      return toast('No se pudo preparar el informe: ' + det + ' ' + g.Art + ' quedó guardad' + g.o + '; usa «Reintentar envío».');
    } finally { fin(); }

    const dudoso = TC.envioDudoso(r._datos);
    if (!(await confirmarEnvio(envio, informe, dudoso))) return toast('No se envió la copia. ' + g.Art + ' quedó guardad' + g.o + '; puedes enviarla con «Reintentar envío».');

    // Primero se anota el intento (estado "enviando"): sin esa huella en el registro no sale ningún correo. Así, aunque
    // se corte la red o la página tras el envío, la ficha sabe que PUEDE haber salido y no invita a duplicarlo.
    const ts = new Date().toISOString();
    let datos = TC.registrarEnvio(r._datos, { ts, para, asunto: envio.asunto, por: me.nombre, estado: 'enviando' });
    if (!(await anotarEnvio(r, datos))) return toast('No se envió nada: no se pudo anotar el intento en el registro. ' + g.Art + ' quedó guardad' + g.o + '; vuelve a intentarlo.');

    const fin2 = mostrarOcupado('Enviando la copia');
    let res;
    try { res = await enviarCopia(envio, informe); } finally { fin2(); }
    const estado = res.ok ? 'enviada' : TC.envioNoSalio(res.error) ? null : 'dudoso';   // null: seguro no salió, se retira el intento
    datos = TC.resolverEnvio(datos, ts, estado);
    const anotado = await anotarEnvio(r, datos);
    if (res.ok) {
      toast(anotado ? 'Copia enviada a ' + para + '.' : 'La copia SÍ se envió a ' + para + ', pero no se pudo actualizar el estado en el registro: no la envíes de nuevo.');
    } else if (estado === 'dudoso') {
      toast('No se pudo confirmar el envío: ' + TC.textoErrorEnvio(res.error, res.detalle, r.kind) + '. ' + g.Art + ' quedó guardad' + g.o + '; el correo PUEDE haber salido: revisa tu bandeja antes de reenviar.');
    } else {
      toast('No se envió la copia: ' + TC.textoErrorEnvio(res.error, res.detalle, r.kind) + '. ' + g.Art + ' quedó guardad' + g.o + '; puedes usar «Reintentar envío».');
    }
    if (vista === 'registros') render();
  } finally { enviando = false; }
}

/* ===================== QR de asistencia ===================== */
// Crea o actualiza el registro como borrador "en curso" (con lo escrito hasta ahora) y devuelve su id.
// Exige cliente y nombre de la actividad. Desde aquí el formulario corrige ese registro (editandoId).
async function guardarBorrador(){
  const d = leerCampos();
  const kind = d.kind_sel === 'capacitacion' ? 'capacitacion' : 'charla';
  const falta = validarCampos(kind, d);
  if (falta) throw Object.assign(new Error(falta), { validacion: true });
  return persistir(kind, d, editandoId, null, { enLinea: true });   // el QR necesita que la actividad ya exista en el servidor
}

function mostrarQR(url){
  const box = $('#qr-box');
  let img = '';
  try { const q = qrcode(0, 'M'); q.addData(url); q.make(); img = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); } catch(e){ img = ''; }
  box.innerHTML = `<h3 style="margin-top:0">Escanea para registrar tu asistencia</h3>
    ${img ? `<div class="qr-img" role="img" aria-label="Código QR del enlace de asistencia">${img}</div>`
          : '<p class="aviso">No se pudo dibujar el QR (sin conexión a la librería). Comparte el enlace escrito.</p>'}
    <p class="qr-enlace">${esc(url)}</p>
    <p class="mute">¿Sin QR? Escribe este enlace en el navegador del teléfono.</p>
    <div class="acciones"><button type="button" class="btn ghost" data-a="copiarQR" data-url="${esc(url)}">Copiar enlace</button>
    <button type="button" class="btn ghost" data-a="ocultarQR">Ocultar QR</button></div>`;
  box.hidden = false;
  botonesAsistencia();
}

function botonesAsistencia(){
  const act = $('#btn-act'); if (!act) return;
  act.hidden = !(editandoId && $('#qr-box').hidden);
  const r = registros.find(x => x.id === editandoId);
  $('#part-estado').textContent = !$('#qr-box').hidden ? 'La lista se actualiza sola cada 5 segundos.'
    : TC.esBorrador(r) ? 'La asistencia por QR sigue abierta. Generar el QR de nuevo anula el enlace anterior.' : '';
}

function detenerRefresco(){ clearInterval(refrescoQR); refrescoQR = null; }

// Trae los participantes que llegaron por QR desde el último refresco. Solo agrega filas nuevas: lo que el PM
// está escribiendo no se toca. El sondeo pide solo los ids; las firmas (PNG) se descargan una vez por fila nueva.
async function refrescarParticipantes(registroId){
  if (refrescando || !$('#partics')) return 0;
  refrescando = true;
  try {
    const { data: ids, error } = await sb.from('rt_asistencias').select('id').eq('registro_id', registroId);
    if (error) throw error;
    const filasDom = () => [...document.querySelectorAll('#partics .part')];
    const nuevos = TC.llegadasNuevas(ids.map(x => x.id), filasDom().map(r => r.dataset.id), [...quitados]);
    if (!nuevos.length) return 0;
    const { data: filas, error: e2 } = await sb.from('rt_asistencias').select('*').in('id', nuevos).order('created_at');
    if (e2) throw e2;
    const cont = $('#partics'); if (!cont) return 0;   // el formulario se cerró mientras tanto
    // Las filas en blanco que vienen de fábrica estorban cuando ya llegan personas.
    filasDom().filter(r => r.dataset.origen === 'nuevo' && !r.dataset.sucia && !r.querySelector('.pi-nombre').value && !r.querySelector('.pi-rut').value).forEach(r => r.remove());
    const enPantalla = filasDom().map(r => r.dataset.id);
    const mezcla = TC.mezclarParticipantes(filasDom().map(r => ({ id: r.dataset.id, _sucia: !!r.dataset.sucia })), TC.participantesVista(filas));
    for (const p of mezcla) if (!enPantalla.includes(p.id)) cont.insertAdjacentHTML('beforeend', filaPart(p, 'tabla'));
    return nuevos.length;
  } finally { refrescando = false; }
}

// Un sondeo que falla no puede ser silencioso: el PM vigila esta lista para detectar registros indebidos.
async function sondear(registroId){
  try { await refrescarParticipantes(registroId); botonesAsistencia(); }
  catch(e){ const el = $('#part-estado'); if (el) el.textContent = 'No pudimos actualizar la lista; toca "Actualizar lista".'; const b = $('#btn-act'); if (b) b.hidden = false; }
}

function iniciarRefresco(registroId){
  detenerRefresco();
  sondear(registroId);
  refrescoQR = setInterval(() => { if (document.visibilityState === 'visible') sondear(registroId); }, 5000);
}

async function generarQR(btn){
  btn.disabled = true; const txt = btn.textContent; btn.textContent = 'Preparando…';
  let id = null;
  try {
    id = await guardarBorrador();
    let token = tokenQR && tokenQR.registroId === id ? tokenQR.token : null;   // el mismo QR mientras no se cierre el formulario
    if (!token) {
      const { data, error } = await sb.rpc('rt_asistencia_abrir', { p_registro: id });
      if (error) throw error;
      token = data; tokenQR = { registroId: id, token };
      // rt_asistencia_abrir también subió updated_at en el servidor y abrió la asistencia: refrescar la copia
      // local con las dos cosas (I1/N1).
      try { const v = await sb.from('registros').select('updated_at').eq('id', id).maybeSingle(); fijarVersion(id, v.data && v.data.updated_at, { asistencia_abierta: true }); } catch (_) {}
    }
    const r = registros.find(x => x.id === id); if (r) r.asistencia_abierta = true;
    mostrarQR(TC.enlaceAsistencia(token));
    iniciarRefresco(id);
  } catch(e){
    const det = esRed(e) ? 'necesitas señal' : (e.message || e.code || 'error');
    // Si el borrador ya se guardó, decirlo: queda sin QR y cuenta como actividad terminada hasta que se abra el QR o se borre.
    toast(e.validacion ? e.message
      : e.registroGuardado ? 'La actividad quedó guardada, pero no se pudo guardar la lista de participantes: ' + det + '. Vuelve a intentar el QR (o toca Guardar).'
      : id ? 'La actividad quedó guardada, pero no se pudo generar el QR: ' + det + '. Vuelve a intentar el QR o bórrala en Registros.'
      : 'No se pudo generar el QR: ' + det);
  } finally {
    btn.textContent = txt;
    // exigeSenal es la única fuente de verdad sobre si #btn-qr debe quedar habilitado: si la red se cayó
    // mientras la llamada estaba en vuelo, no lo reactiva por el solo hecho de que la llamada terminó.
    btn.disabled = false; btn.title = '';
    exigeSenal(btn, 'Necesitas señal para generar el código QR');
  }
}

async function cerrarBorrador(id){
  const r = registros.find(x => x.id === id);
  if (!r || !TC.puedeEditar(r, me)) return toast('Solo el autor de la actividad o un administrador puede cerrar la asistencia');
  if (r._fila) return toast('Esta actividad aún no sale del teléfono: espera a que se envíe para cerrar la asistencia.');
  if (!confirm('¿Cerrar la asistencia de esta actividad? El enlace del QR dejará de aceptar participantes.')) return;
  const { error } = await sb.rpc('rt_asistencia_cerrar', { p_registro: id });
  if (error) return toast(esRed(error) ? 'Necesitas señal para cerrar la asistencia por QR' : 'No se pudo cerrar la asistencia');
  r.asistencia_abierta = false; render(); toast('Asistencia cerrada');
  // rt_asistencia_cerrar también subió updated_at en el servidor y cerró la asistencia: refrescar la copia local
  // con las dos cosas (I1/N1).
  try { const v = await sb.from('registros').select('updated_at').eq('id', id).maybeSingle(); fijarVersion(id, v.data && v.data.updated_at, { asistencia_abierta: false }); } catch (_) {}
}

/* Abre el formulario del registro con sus datos para corregirlo (participantes y firmas incluidos). */
async function editarRegistro(id){
  const r = registros.find(x => x.id === id);
  if (!r || !TC.puedeEditar(r, me)) return toast('Solo el autor del registro o un administrador puede corregirlo');
  let filas = [], participantesOk = true;
  const esActividad = r.kind === 'charla' || r.kind === 'capacitacion';
  if (esActividad) {   // los participantes se piden al abrir (con sus firmas), no en el listado
    try {
      const { data, error } = await sb.from('rt_asistencias').select('*').eq('registro_id', id).order('created_at');
      if (error) throw error;
      filas = data || [];
    } catch (e) {
      // Sin señal esto siempre falla: antes de esta tarea eso impedía corregir la actividad por completo. Se abre
      // igual (fecha, duración, temas, lo que sea, se pueden corregir sin riesgo) pero sin tocar participantes:
      // ver `participantesDisponibles` más abajo y en persistir().
      if (!window.TXOfflineCore || TXOfflineCore.clasificarError(e) !== 'red') return toast('No se pudieron cargar los participantes');
      participantesOk = false;
    }
  }
  editandoId = id;
  baseEditando = r.updated_at || null;   // la versión que el PM tiene a la vista: viaja tal cual al corregir
  reemplazaEntrada = null;   // "Editar" normal nunca reemplaza una entrada: si hay una pendiente, se encadena (ver abajo)
  participantesDisponibles = participantesOk;
  cliSel = r.cliente_id ? { id: r.cliente_id, nombre: r.cliente } : null; cliNuevo = false;
  vista = r.kind; render(); window.scrollTo(0, 0);
  const f = $('#form');
  const c = r.cierre || {};
  const fm = r.firmante || {};
  const valores = { ...r, cliente: r.cliente, obra: r.obra, firm_nombre: fm.nombre, firm_cargo: fm.cargo, firm_movil: fm.movil, firm_correo: fm.correo, cierre_nombre: c.nombre, cierre_cargo: c.cargo, cierre_email: c.email, cierre_fono: c.fono, cierre_firma: c.firma, cierre_firma_pm: c.firmaPm };
  f.querySelectorAll('[name]').forEach(el => {
    const n = el.name, v = valores[n];
    if (el.type === 'file' || v === undefined || v === null) return;
    if (el.type === 'checkbox') el.checked = [].concat(v).includes(el.value);
    else if (el.type !== 'radio') el.value = v;
  });
  if (esActividad) {
    if (participantesOk) {
      partsViejo = !filas.length && (r.participantes || []).length > 0;
      $('#partics').innerHTML = TC.participantesVista(filas, r.participantes).map(p => filaPart(p, filas.length ? 'tabla' : 'viejo')).join('');
    } else {
      partsViejo = false;
      $('#partics').innerHTML = '<p class="mute">No se pueden ver ni editar los participantes sin señal: se conservan los que ya tiene la actividad.</p>';
      const addBtn = f.querySelector('[data-a="addPart"]'); if (addBtn) addBtn.hidden = true;
      const qrBtn = $('#btn-qr'); if (qrBtn) qrBtn.hidden = true;
    }
    $('#act-titulo').textContent = 'Corregir ' + KIND_LABEL[r.kind].toLowerCase();
    botonesAsistencia();
  } else if (r.kind === 'adherencia') {
    cargarEnsayoEnFormulario(r);
  } else {
    f.querySelector('h2').textContent = 'Corregir visita por reclamo';
    refrescarFirmasCierre();
    f.querySelector('[name="fotos"]').insertAdjacentHTML('afterend', `<div id="fotos-guardadas">${[...new Set(r.fotos)].map((p, i) => filaFotoGuardadaHtml(p, i, null)).join('')}</div>`);
    renderAvisoCupo();
    cargarFotos();
  }
  f.querySelector('[data-a="guardar"]').textContent = 'Guardar cambios';
  const cancelar = f.querySelector('.acciones [data-a="nav"]'); if (cancelar) cancelar.dataset.v = 'registros';
  infoCliente();
  // Ya hay otra corrección de este registro sin enviar (pendiente o con problema): la nueva se encadena a ella
  // (persistir() lo hace con TC.dependeDeCorreccion), así que no sale antes de tiempo ni la pisa.
  if (r._fila) toast('Hay otra corrección de este registro sin enviar: esta se enviará después de esa.');
}

// "Ver mi versión": la corrección quedó con problema (conflicto o el registro ya no está) y el PM necesita decidir
// qué hacer sin perder lo que escribió. Reabre el formulario con lo que quedó en ESA entrada de la fila (fila/datos),
// no con lo que hay en el servidor ni en `registros`: por eso no pide nada a la base. Al no saber si la versión que
// tenía sigue vigente, el formulario queda sin base conocida; para reintentar primero hay que descartar esta entrada
// (si no, la nueva corrección depende de ella y hereda el mismo problema) y guardar de nuevo, lo que pide la versión
// actual del servidor.
// Unas pocas líneas de lo que hay AHORA en el servidor para ese registro, junto al formulario: el PM no debe
// decidir a ciegas qué hacer con su versión sin enviar (I1 de la revisión). `mr` ya pasó por mapRegistro.
function resumenServidor(mr){
  if (!mr) return '';
  if (mr.kind === 'adherencia') return `<p><b>Motivo:</b> ${esc(mr.motivo_visita || '—')}</p><p><b>Conclusión:</b> ${esc(mr.conclusion || '—')}</p>`;
  if (mr.kind === 'visita') return `<p><b>Motivo:</b> ${esc(mr.motivo || '—')}</p><p><b>Causa:</b> ${esc(mr.causa || '—')}</p><p><b>Solución:</b> ${esc(mr.solucion || '—')}</p>`;
  return `<p><b>Nombre:</b> ${esc(mr.nombre || '—')}</p><p><b>Observaciones:</b> ${esc(mr.observaciones || '—')}</p>`;
}
// "corrigió Fulano el 24-11-2026 10:05" (TC.marcarEdicion deja esto en datos.editado); genérico si no hay firma.
function textoEdicion(editado){
  if (!editado) return 'otra persona';
  return (editado.por || 'otra persona') + (editado.ts ? ' el ' + TC.fechaHoraCL(editado.ts) : '');
}

// "Ver mi versión": la corrección quedó con problema (CONFLICTO o NO_EXISTE) y el PM necesita decidir qué hacer
// sin perder lo que escribió. Reabre el formulario con lo que quedó en ESA entrada de la fila (fila/datos) — no
// con lo del servidor, porque eso es justo lo que se muestra aparte para comparar — y, con señal, pide la versión
// actual del servidor para fijar una base válida (nunca null) y mostrarla junto al formulario. Sin señal no hay
// con qué comparar: se avisa y la base queda en lo que diga la copia local (tampoco null: null haría que, si se
// reenvía sin señal y alguien más corrige entretanto, se pise sin ningún aviso). Guardar desde aquí (persistir())
// REEMPLAZA esta entrada (la descarta) en vez de encadenarse a ella, así la corrección sí llega.
// Si el registro ya no existe (NO_EXISTE, se sabe por el propio error, sin necesidad de consultar nada) no tiene
// sentido seguir "corrigiendo" un id que no está: se guarda como un registro NUEVO (editandoId = null, por el
// camino del alta), con lo mismo que el PM había escrito.
async function verMiVersion(entradaId){
  let ents = [];
  try { ents = window.TXOffline ? await TXOffline.entradas() : []; } catch (_) {}
  const e = ents.find(x => x.id === entradaId);
  if (!e) return toast('Esa corrección ya no está pendiente.');
  const d = e.datos || {};
  const kind = d.kind;
  const registroIdOriginal = d.registroId || null;
  const yaNoExiste = TC.noExiste(e.error);
  const rutaDe = x => (x && typeof x === 'object') ? x.ruta : x;
  const r = { ...(d.fila || {}), ...(d.datos || {}), id: registroIdOriginal || d.id, kind,
    fotos: (d.fotosGuardadas || []).map(rutaDe).filter(Boolean) };

  let servidor = null, consultado = false;
  if (!yaNoExiste && registroIdOriginal && navigator.onLine !== false) {
    try {
      const { data, error } = await sb.from('registros').select('*').eq('id', registroIdOriginal).maybeSingle();
      if (!error) { servidor = data || null; consultado = true; }
    } catch (_) { /* se trata como sin señal abajo */ }
  }
  // "Como nuevo": el id original no existe (ya se sabía, o se acaba de confirmar al consultar). No se corrige
  // nada: se guarda con registroId = null, que persistir() trata como un alta (id nuevo, rt_crear_registro).
  const comoNuevo = yaNoExiste || (consultado && !servidor);

  editandoId = comoNuevo ? null : registroIdOriginal;
  baseEditando = comoNuevo ? null
    : consultado ? (servidor.updated_at || null)
    : registroIdOriginal ? ((registrosServ.find(x => x.id === registroIdOriginal) || {}).updated_at || null)
    : null;
  reemplazaEntrada = entradaId;
  const esActividad = kind === 'charla' || kind === 'capacitacion';
  // Esta vista no trae la lista real de participantes (ni la actual del servidor, ni la que había antes de
  // reabrir): el plan que traía la entrada vieja viaja TAL CUAL a la nueva (R3), no se recalcula desde el
  // formulario, que no tiene con qué.
  participantesDisponibles = !esActividad;
  planReemplazado = esActividad ? (d.plan || null) : null;
  cliSel = r.cliente_id ? { id: r.cliente_id, nombre: r.cliente } : null; cliNuevo = false;
  vista = kind; render(); window.scrollTo(0, 0);
  const f = $('#form');
  const c = r.cierre || {};
  const fm = r.firmante || {};
  const valores = { ...r, firm_nombre: fm.nombre, firm_cargo: fm.cargo, firm_movil: fm.movil, firm_correo: fm.correo,
    cierre_nombre: c.nombre, cierre_cargo: c.cargo, cierre_email: c.email, cierre_fono: c.fono, cierre_firma: c.firma, cierre_firma_pm: c.firmaPm };
  f.querySelectorAll('[name]').forEach(el => {
    const n = el.name, v = valores[n];
    if (el.type === 'file' || v === undefined || v === null) return;
    if (el.type === 'checkbox') el.checked = [].concat(v).includes(el.value);
    else if (el.type !== 'radio') el.value = v;
  });
  if (esActividad) {
    $('#partics').innerHTML = '<p class="mute">No se pueden ver ni editar los participantes desde aquí: se aplicarán los cambios (altas y bajas) que ya habías hecho antes de que esto quedara con problema.</p>';
    const addBtn = f.querySelector('[data-a="addPart"]'); if (addBtn) addBtn.hidden = true;
    const qrBtn = $('#btn-qr'); if (qrBtn) qrBtn.hidden = true;
    $('#act-titulo').textContent = 'Corregir ' + KIND_LABEL[kind].toLowerCase();
  } else if (kind === 'adherencia') {
    cargarEnsayoEnFormulario(r);
  } else {
    f.querySelector('h2').textContent = 'Corregir visita por reclamo';
    refrescarFirmasCierre();
    f.querySelector('[name="fotos"]').insertAdjacentHTML('afterend', `<div id="fotos-guardadas">${[...new Set(r.fotos)].map((p, i) => filaFotoGuardadaHtml(p, i, null)).join('')}</div>`);
    renderAvisoCupo();
    cargarFotos();
  }
  f.querySelector('[data-a="guardar"]').textContent = comoNuevo ? 'Guardar como registro nuevo' : 'Guardar cambios';
  const cancelar = f.querySelector('.acciones [data-a="nav"]'); if (cancelar) cancelar.dataset.v = 'registros';
  infoCliente();

  // La otra versión, a la vista, para que el PM no decida a ciegas (I1/I2 de la revisión).
  let bannerHtml, msg;
  if (comoNuevo) {
    bannerHtml = '<div class="aviso">Este registro ya no está en el servidor (puede haberlo eliminado un administrador). Al guardar, tu versión se crea como un registro nuevo.</div>';
    msg = 'El registro ya no está: al guardar se crea como uno nuevo.';
  } else if (!registroIdOriginal) {
    bannerHtml = ''; msg = 'Esta es tu versión sin enviar. Revísala y guarda de nuevo si corresponde.';
  } else if (!consultado) {
    bannerHtml = '<div class="aviso">Sin señal no se puede comparar con el servidor: se guardará igual con la última versión que se conoce de este equipo, y puede volver a marcar conflicto si alguien más lo corrigió mientras tanto.</div>';
    msg = 'Esta es tu versión sin enviar. Sin señal no se pudo traer la del servidor para compararla.';
  } else {
    const mrServ = mapRegistro(servidor);
    bannerHtml = `<div class="aviso">Esta es TU versión sin enviar. En el servidor ahora hay otra, corregida por ${esc(textoEdicion(mrServ.editado))}:${resumenServidor(mrServ)}</div>`;
    msg = 'Esta es tu versión sin enviar. Revisa la del servidor antes de guardar de nuevo.';
  }
  if (bannerHtml) f.insertAdjacentHTML('afterbegin', bannerHtml);
  toast(msg);
}

async function cambiarEstado(id, estado){
  const r = registros.find(x => x.id === id); if (!r || r.estado === estado) return;
  if (r._fila) return toast('Este registro aún no sale del teléfono: espera a que se envíe para cambiar su estado.');
  const antes = r.estado; r.estado = estado; render();
  const { data, error } = await sb.from('registros').update({ estado, updated_at: new Date().toISOString() }).eq('id', id).select('updated_at');
  if (error) { r.estado = antes; render(); toast('No se pudo actualizar el estado'); return; }
  // El disparador fija su propia updated_at (no la que se manda arriba): se lee la real para que la próxima
  // vez que se toque "Editar" no viaje una base vieja y dé un CONFLICTO falso (I1). El estado nuevo también se
  // refresca en la copia, o una corrección hecha después sin señal lo pisaría en silencio, sin CONFLICTO (N1).
  fijarVersion(id, data && data[0] && data[0].updated_at, { estado });
}

async function eliminar(id){
  const r = registros.find(x => x.id === id); if (!r) return;
  if (r._fila) return toast('Este registro aún no sale del teléfono: si tiene problema, descártalo desde su tarjeta.');
  if (!confirm('¿Eliminar este registro? No se puede deshacer.')) return;
  const { error } = await sb.from('registros').delete().eq('id', id);
  if (error) return toast(esRed(error) ? 'Necesitas señal para eliminar el registro' : 'No se pudo eliminar');
  registrosServ = registrosServ.filter(x => x.id !== id); recomponer(); render(); toast('Registro eliminado');
}

/* ===================== Panel ===================== */
function vistaPanel(){
  const regs = TC.sinBorradores(registros);   // las actividades en curso (QR abierto) no cuentan todavía
  const actividades = regs.filter(r => r.kind === 'charla' || r.kind === 'capacitacion');
  const visitas = regs.filter(r => r.kind === 'visita');
  const ensayos = regs.filter(r => r.kind === 'adherencia');
  const participantes = actividades.reduce((s,r) => s + TC.totalParticipantes(r), 0);
  const abiertas = visitas.filter(r => r.estado !== 'Cerrado').length;
  const cerradas = visitas.length - abiertas;
  const pctCerradas = visitas.length ? Math.round(cerradas / visitas.length * 100) : 0;
  const box = (id, t, cls = '') => `<div class="chart-box ${cls}"><h3>${t}</h3><div class="cv"><canvas id="${id}"></canvas></div></div>`;

  const mesAct = mesKey(new Date());
  const delMes = k => regs.filter(r => r.kind === k && String(r.fecha || '').startsWith(mesAct)).length;
  const fechaHoy = new Date().toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' });
  return `
  <div class="hero">
    <div class="eb">${esc(fechaHoy)}</div>
    <h2>Hola, ${esc((me?.nombre || '').split(' ')[0])}</h2>
    <p class="mute" style="margin:0">Registra charlas técnicas, capacitaciones, visitas por reclamo y ensayos de adherencia en obra.</p>
    <div class="acciones">
      <button class="btn" data-a="nav" data-v="charla">+ Charla técnica</button>
      <button class="btn ghost" data-a="nav" data-v="capacitacion">+ Capacitación</button>
      <button class="btn ghost" data-a="nav" data-v="visita">+ Visita por reclamo</button>
      <button class="btn ghost" data-a="nav" data-v="adherencia">+ Ensayo de adherencia</button>
    </div>
  </div>
  <div class="kpis">
    <div class="kpi"><span>Charlas técnicas</span><b>${actividades.filter(r => r.kind === 'charla').length}</b><small>${delMes('charla')} este mes</small></div>
    <div class="kpi"><span>Capacitaciones</span><b>${actividades.filter(r => r.kind === 'capacitacion').length}</b><small>${delMes('capacitacion')} este mes</small></div>
    <div class="kpi"><span>Participantes</span><b>${participantes}</b><small>capacitados en total</small></div>
    <div class="kpi"><span>Ensayos de adherencia</span><b>${ensayos.length}</b><small>${delMes('adherencia')} este mes</small></div>
    <div class="kpi ${abiertas ? 'hot' : ''}"><span>Reclamos abiertos</span><b>${abiertas}</b><small>${pctCerradas}% cerrados</small></div>
  </div>
  ${regs.length ? `<div class="graficos">
    ${box('g-mes', 'Actividad por mes', 'ancho')}
    ${box('g-estado', 'Estado de reclamos')}
    ${box('g-causas', 'Causas probables')}
    ${box('g-pm', 'Registros por PM')}
    ${box('g-clientes', 'Clientes con más registros')}
  </div>` : '<p class="mute">Aún no hay registros. Cuando los PM empiecen a cargar charlas y visitas, aquí aparecerán los gráficos.</p>'}`;
}

const contar = (arr, fn) => arr.reduce((m, x) => { const k = fn(x); if (k) m[k] = (m[k] || 0) + 1; return m; }, {});
const topN = (obj, n) => Object.entries(obj).sort((a,b) => b[1] - a[1]).slice(0, n);
const corto = s => s.length > 28 ? s.slice(0, 27) + '…' : s;

function dibujarGraficos(){
  const regs = TC.sinBorradores(registros);
  if (!regs.length) return;
  if (typeof Chart === 'undefined') {
    document.querySelectorAll('.chart-box').forEach(b => b.insertAdjacentHTML('beforeend', '<p class="mute">Gráficos no disponibles en este momento.</p>'));
    return;
  }
  Object.values(charts).forEach(c => c.destroy());
  charts = {};
  const cs = getComputedStyle(document.documentElement);
  Chart.defaults.color = cs.getPropertyValue('--mute').trim() || '#6b6b70';
  Chart.defaults.borderColor = cs.getPropertyValue('--line').trim() || '#dcdcdf';
  Chart.defaults.font.family = 'Sora, system-ui, -apple-system, Segoe UI, sans-serif';
  Chart.defaults.elements.bar.borderRadius = 6;
  Chart.defaults.plugins.legend.labels.boxWidth = 10;
  const inkC = cs.getPropertyValue('--ink').trim() || '#1d1d1f';

  const meses = [];
  const hoyD = new Date();
  for (let i = 5; i >= 0; i--) meses.push(mesKey(new Date(hoyD.getFullYear(), hoyD.getMonth() - i, 1)));
  const labels = meses.map(m => { const [y, mo] = m.split('-'); return new Date(+y, +mo - 1, 1).toLocaleDateString('es-CL', { month: 'short', year: '2-digit' }); });
  const porMes = kind => meses.map(m => regs.filter(r => r.kind === kind && String(r.fecha || '').startsWith(m)).length);
  charts.mes = new Chart($('#g-mes'), {
    type: 'bar',
    data: { labels, datasets: [
      { label: 'Charlas técnicas', data: porMes('charla'), backgroundColor: COLOR.charla },
      { label: 'Capacitaciones', data: porMes('capacitacion'), backgroundColor: inkC },
      { label: 'Visitas', data: porMes('visita'), backgroundColor: COLOR.visita },
      { label: 'Ensayos de adherencia', data: porMes('adherencia'), backgroundColor: COLOR.adherencia }
    ]},
    options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } } }
  });

  const visitas = regs.filter(r => r.kind === 'visita');
  const est = contar(visitas, r => r.estado || 'Abierto');
  charts.estado = new Chart($('#g-estado'), {
    type: 'doughnut',
    data: { labels: ESTADOS, datasets: [{ data: ESTADOS.map(e => est[e] || 0), backgroundColor: [getComputedStyle(document.documentElement).getPropertyValue('--brand').trim() || '#e4032e','#f2b04a','#4fd18a'] }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
  });

  const causasTop = topN(contar(visitas, r => r.causa || 'Sin dato'), 6);
  charts.causas = new Chart($('#g-causas'), {
    type: 'bar',
    data: { labels: causasTop.map(c => corto(c[0])), datasets: [{ label: 'Visitas', data: causasTop.map(c => c[1]), backgroundColor: inkC }] },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { precision: 0 } } } }
  });

  const pm = topN(contar(regs, r => nombreAutor(r)), 10);
  charts.pm = new Chart($('#g-pm'), {
    type: 'bar',
    data: { labels: pm.map(p => p[0]), datasets: [{ label: 'Registros', data: pm.map(p => p[1]), backgroundColor: COLOR.charla }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
  });

  const cli = topN(contar(regs, r => r.cliente), 8);
  charts.clientes = new Chart($('#g-clientes'), {
    type: 'bar',
    data: { labels: cli.map(c => corto(c[0])), datasets: [{ label: 'Registros', data: cli.map(c => c[1]), backgroundColor: COLOR.visita }] },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { precision: 0 } } } }
  });
}

/* ===================== Registros ===================== */
const puedeBorrar = r => me && (me.admin || r.autor === me.id);

// Ver informe, enviar la copia al cliente y el historial de envíos: igual para una visita y para un ensayo.
function bloqueInforme(r){
  // Mientras el registro es solo una entrada sin enviar, el PDF y la copia al cliente no tienen de dónde
  // sacar las fotos (solo existen como blobs en el teléfono) ni un registro real al que apuntar.
  if (r._fila) return `<div class="acciones" style="margin-top:10px"><button class="btn ghost" disabled title="Disponible cuando se envíe">Ver informe</button></div>`;
  const boton = TC.puedeEditar(r, me) && TC.botonEnvio(r._datos, r.kind);
  return `<div class="acciones" style="margin-top:10px"><button class="btn ghost" data-a="verInformeReg" data-id="${esc(r.id)}">Ver informe</button>${boton ? `<button class="btn ghost" data-a="enviarReg" data-id="${esc(r.id)}">${boton}</button>` : ''}</div>
      ${TC.lineaEnvio(r._datos) ? `<p class="mute" data-envio="${esc(r.id)}">${esc(TC.lineaEnvio(r._datos))}</p>` : ''}
      ${TC.historialNoSalio(r._datos).map(t => `<p class="mute" data-historial="${esc(r.id)}">${esc(t)}</p>`).join('')}
      ${(TC.puedeEditar(r, me) && TC.envioDudoso(r._datos)) ? `<div class="acciones"><button class="btn ghost" data-a="confirmarLlego" data-id="${esc(r.id)}">Sí llegó</button><button class="btn ghost" data-a="confirmarNoSalio" data-id="${esc(r.id)}">No salió</button></div>` : ''}`;
}

// Los resultados de un ensayo, tal como los ve el PM en la ficha (aquí sí van el mínimo, el máximo y las filas bajo 0,20 MPa: no son parte del informe).
function resultadosEnsayo(r){
  const filas = r.filas || [], res = TC.resumenEnsayo(filas);
  if (!filas.length) return '';
  const linea = f => `<p>N° ${esc(f.n)} · ${esc(f.sustrato || '—')} · ${esc(TC.fmtNum(f.cargaKn) || '—')} kN · <b>${esc(TC.fmtMpa(TC.mpaDeFila(f)) || '—')} MPa</b>${TC.esManual(f) ? ' (manual)' : ''}${f.falla ? ' · ' + esc(f.falla) : ''}</p>`;
  return `<p>${filas.length} extracción(es)${res.min != null ? ` · ${TC.fmtMpa(res.min)} a ${TC.fmtMpa(res.max)} MPa (promedio ${TC.fmtMpa(res.prom)})` : ''}</p>
      ${res.bajoUmbral.length ? `<div class="aviso">Bajo 0,20 MPa: N° ${res.bajoUmbral.map(esc).join(', ')}</div>` : ''}
      <details class="mas" data-sec="res:${esc(r.id)}"><summary>Ver resultados</summary>${filas.map(linea).join('')}</details>`;
}

// Lo registrado en el teléfono que aún no llega al servidor (_fila): estado y, si falló, Reintentar / Descartar.
function bandaFila(r){
  const f = r._fila; if (!f) return '';
  if (f.estado !== 'problema') return '<p class="mute" style="margin:0 0 6px">Pendiente de enviar: se envía solo al volver la señal.</p>';
  // Un conflicto real (otra persona corrigió el mismo registro mientras no había señal) o un registro que ya no
  // está no se arreglan reintentando a ciegas: volverían a fallar igual. En vez de Reintentar se ofrece revisar
  // lo escrito y decidir ("Ver mi versión" compara con lo que haya ahora en el servidor, si hay señal).
  const conflicto = TC.esConflicto(f.error), noExiste = TC.noExiste(f.error);
  const msg = conflicto ? TC.MSG_CONFLICTO : (f.error || 'error');
  const accion = (conflicto || noExiste)
    ? `<button class="btn" data-a="verMiVersion" data-eid="${esc(f.entradaId)}">Ver mi versión</button>`
    : `<button class="btn" data-a="filaReintentar" data-eid="${esc(f.entradaId)}">Reintentar</button>`;
  return `<div class="aviso" style="margin:0 0 8px">No se pudo enviar: ${esc(msg)}
    <div class="acciones" style="margin-top:6px">${accion}
    <button class="btn ghost" data-a="filaDescartar" data-eid="${esc(f.entradaId)}">Descartar</button></div></div>`;
}
const tarjeta = r => { const h = tarjetaBase(r); return r._fila ? h.replace('<div class="card">', '<div class="card">' + bandaFila(r)) : h; };
// Sin señal no se puede consultar la regla de la base (rt_registros_restringir_edicion): se decide aquí con el mismo
// criterio (autor o admin). Con señal se deja el botón oculto como hoy si no corresponde, y la base decide al guardar;
// sin señal, en vez de ocultarlo, queda deshabilitado con el motivo para que el PM entienda por qué no puede corregirlo.
function botonEditar(r){
  if (TC.puedeEditar(r, me)) return `<button class="del" data-a="editar" data-id="${esc(r.id)}">Editar</button>`;
  if (navigator.onLine === false) return `<button class="del" disabled title="Sin señal: solo puedes corregir tus propios registros">Editar</button>`;
  return '';
}
function tarjetaBase(r){
  const autor = `<span class="mute"> · ${esc(nombreAutor(r))}</span>`;
  const del = (puedeBorrar(r) && !r._fila ? `<button class="del" data-a="eliminar" data-id="${esc(r.id)}">Eliminar</button>` : '')
    + botonEditar(r);
  if (r.kind === 'adherencia') {
    return `<div class="card">${del}
      <span class="tag">Adherencia</span><b>${esc(r.cliente)}</b>${autor}
      <p class="mute">${esc(r.obra || '')} · ${fmtFecha(r.fecha)} · ${esc(r.producto || '')}</p>
      <p><b>Motivo:</b> ${esc(r.motivo_visita || '—')}</p>
      ${resultadosEnsayo(r)}
      ${r.fotos && r.fotos.length ? `<div class="fotos" data-fotos="${esc(r.id)}">${r.fotos.map(p => `<a target="_blank" rel="noopener" data-path="${esc(p)}"><img alt="Foto del ensayo"></a>`).join('')}</div>` : ''}
      ${bloqueInforme(r)}
    </div>`;
  }
  if (r.kind === 'visita') {
    return `<div class="card">${del}
      <span class="tag v">Visita</span><b>${esc(r.cliente)}</b>${autor}
      <p class="mute">${esc(r.obra || '')} · ${fmtFecha(r.fecha)} · ${esc(r.producto || '')}</p>
      <p><b>Motivo:</b> ${esc(r.motivo)}</p>
      <p><b>Causa probable:</b> ${esc(r.causa || '—')}${r.lab === 'Sí' ? ' · Requiere laboratorio' : ''}</p>
      ${r.lab === 'Sí' ? `<p style="margin:0 0 8px"><button class="enlace" data-a="crearEnsayo" data-id="${esc(r.id)}">Crear ensayo de adherencia para esta obra</button></p>` : ''}
      ${(r.verificacion || r.solucion || r.contacto || r.direccion || r.observaciones) ? `<details class="mas" data-sec="det:${esc(r.id)}"><summary>Ver detalle</summary>
        ${r.direccion ? `<p><b>Dirección:</b> ${esc(r.direccion)}</p>` : ''}
        ${r.contacto ? `<p><b>Contacto:</b> ${esc(r.contacto)}</p>` : ''}
        ${r.verificacion ? `<p><b>Verificación:</b> ${esc(r.verificacion)}</p>` : ''}
        ${r.solucion ? `<p><b>Solución ofrecida:</b> ${esc(r.solucion)}</p>` : ''}
        ${r.observaciones ? `<p><b>Observaciones:</b> ${esc(r.observaciones)}</p>` : ''}
      </details>` : ''}
      ${r.fotos && r.fotos.length ? `<div class="fotos" data-fotos="${esc(r.id)}">${r.fotos.map(p => `<a target="_blank" rel="noopener" data-path="${esc(p)}"><img alt="Foto de la visita"></a>`).join('')}</div>` : ''}
      ${bloqueInforme(r)}
      <div class="chips" style="margin-top:10px">${ESTADOS.map(e => `<button class="chip ${r.estado === e ? 'on' : ''}" data-a="estado" data-id="${esc(r.id)}" data-e="${e}">${e}</button>`).join('')}</div>
    </div>`;
  }
  const n = TC.totalParticipantes(r), enCurso = TC.esBorrador(r);
  return `<div class="card">${del}
    ${enCurso ? '<span class="tag enc">En curso</span>' : ''}<span class="tag">${esc(r.kind === 'charla' ? 'Charla técnica' : r.tipo_act || 'Capacitación')}</span><b>${esc(r.nombre || 'Sin nombre')}</b>${autor}
    <p class="mute">${esc(r.cliente)} · ${esc(r.obra || '')} · ${fmtFecha(r.fecha)}</p>
    <p>${n} participantes · ${esc(r.duracion)} min · ${esc(r.relator || '—')}</p>
    ${r.observaciones ? `<p class="mute">${esc(r.observaciones)}</p>` : ''}
    <details class="mas" data-part="${esc(r.id)}"><summary>Ver participantes</summary><div class="part-lista"></div></details>
    ${enCurso ? `<p class="mute">La asistencia por QR sigue abierta.</p>${TC.puedeEditar(r, me) ? `<div class="acciones" style="margin-top:8px"><button class="btn ghost" data-a="cerrarBorrador" data-id="${esc(r.id)}">Cerrar asistencia</button></div>` : ''}` : ''}
  </div>`;
}

function itemParticipante(p){

async function cargarParticipantes(det){
  const r = registros.find(x => x.id === det.dataset.part), cont = det.querySelector('.part-lista');
  if (!r || !cont) return;
  // Siempre se piden las filas: el conteo del listado puede venir en 0 o desconocido y no es la fuente de verdad.
  cont.innerHTML = '<p class="mute">Cargando…</p>';
  const { data, error } = await sb.from('rt_asistencias').select('*').eq('registro_id', r.id).order('created_at');
  if (error) { cont.innerHTML = '<p class="mute">No se pudieron cargar los participantes.</p>'; return; }
  const filas = data || [];
  const lista = TC.participantesVista(filas, r.participantes);
  cont.innerHTML = lista.length ? lista.map(itemParticipante).join('') : '<p class="mute">Sin participantes.</p>';
}

function vistaRegistros(){

    <div style="margin-top:12px">${lista.length ? TC.ordenarRegistros(lista).map(tarjeta).join('') : '<p class="mute">Sin registros todavía.</p>'}</div>`;
}

async function cargarFotos(){
  const links = [...document.querySelectorAll('.fotos a[data-path]')];
  const faltan = [...new Set(links.map(a => a.dataset.path).filter(p => !urlCache[p]))];
  if (faltan.length) {
    const { data } = await sb.storage.from(BUCKET).createSignedUrls(faltan, 3600);
    (data || []).forEach(x => { if (x.signedUrl) urlCache[x.path] = x.signedUrl; });
    // Fotos que ya no están en Supabase (archivadas en Drive tras 60 días)
    await Promise.all(faltan.filter(p => !urlCache[p] && window.fotoArchivada)
      .map(p => fotoArchivada(BUCKET, p).then(u => { urlCache[p] = u; }).catch(() => {})));
  }
  links.forEach(a => {
    const u = urlCache[a.dataset.path], img = a.querySelector('img');
    if (!u || !img) return marcarSinFoto(a);
    img.onerror = () => marcarSinFoto(a);
    a.href = u; img.src = u;
  });
}

// Una foto que ya no está en Supabase ni en Drive dejaba un cuadrado gris sin explicación.
function marcarSinFoto(a){
  if (a.classList.contains('sin-foto')) return;
  a.classList.add('sin-foto');
  a.removeAttribute('href'); a.removeAttribute('target');
  a.innerHTML = '<span class="sin-foto-txt">Imagen no disponible</span>';
}

async function cargarAccesos(){

const acciones = {

    if (FORMS.includes(vista) && (b.dataset.vistas || b.dataset.v).split(' ').includes(vista)) return window.scrollTo(0, 0);
    vista = b.dataset.v; cliSel = null; cliNuevo = false; editandoId = null; baseEditando = null; reemplazaEntrada = null; participantesDisponibles = true; planReemplazado = null; render(); window.scrollTo(0,0); if (vista === 'accesos') cargarAccesos(); },

/* ===================== Lo que exige señal ===================== */
// A diferencia de bloqueInforme/botonEditar (que miran si el registro SIGUE SIENDO una entrada de la fila, `_fila`),
// estos controles hacen una llamada en vivo que no tiene sentido sin red aunque el registro ya esté confirmado en
// el servidor: generar/cerrar el QR, ver el informe, enviar la copia al cliente y eliminar. Cada uno dice qué
// necesita en el `title` (nunca un "sin conexión" genérico) y conviven con esas otras dos capas: si el botón ya
// está deshabilitado por otra razón (title propio, no vacío, distinto del nuestro) no se toca.
function exigeSenal(btn, motivo){
  if (!btn || (btn.disabled && btn.title && btn.title !== motivo)) return;
  if (navigator.onLine === false) { btn.disabled = true; btn.title = motivo; }
  else if (btn.title === motivo) { btn.disabled = false; btn.title = ''; }
}
// Reaplica exigeSenal a los controles ya dibujados: se llama al final de cada render() y, más abajo, también al
// vuelo en los eventos online/offline, sin esperar al siguiente render.
function aplicarExigeSenal(){
  exigeSenal($('#btn-qr'), 'Necesitas señal para generar el código QR');
  document.querySelectorAll('[data-a="cerrarBorrador"]').forEach(b => exigeSenal(b, 'Necesitas señal para cerrar la asistencia por QR'));
  document.querySelectorAll('[data-a="verInformeReg"]').forEach(b => exigeSenal(b, 'Necesitas señal para ver el informe (las fotos están en el servidor)'));
  document.querySelectorAll('[data-a="enviarReg"]').forEach(b => exigeSenal(b, 'Necesitas señal para enviar la copia al cliente'));
  document.querySelectorAll('[data-a="eliminar"]').forEach(b => exigeSenal(b, 'Necesitas señal para eliminar el registro'));
}

/* ===================== Render ===================== */
function render(){
  cerrarInforme();   // la vista previa (blob y capa) no sobrevive a una pantalla nueva
  detenerRefresco(); tokenQR = null; quitados = new Set(); partsViejo = false; archivosElegidos = [];   // la asistencia es del formulario que se cierra
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', (b.dataset.vistas || b.dataset.v).split(' ').includes(vista)));
  const vistas = {
    panel: vistaPanel,
    charla: () => formActividad('charla'),
    capacitacion: () => formActividad('capacitacion'),
    visita: formVisita,
    adherencia: formEnsayo,
    registros: vistaRegistros,
    accesos: vistaAccesos
  };
  if (vista === 'accesos' && !me?.admin) vista = 'panel';
  $('#app').innerHTML = vistas[vista]();
  const vt = $('#view-title'); if (vt) vt.textContent = TITULOS[vista] || '';
  if (vista === 'panel') dibujarGraficos();
  if (vista === 'registros') cargarFotos();
  if (vista === 'adherencia') actualizarEnsayo();
  aplicarExigeSenal();
}
// Si la pestaña Accesos está abierta cuando cambia la señal, la vista completa (no un botón suelto) tiene que
// reflejarlo sin esperar al siguiente render(): repinta solo esa vista, sin rehacer toda la pantalla (no hace
// falta detenerRefresco ni lo demás que hace render()). Al perder la señal pasa a mostrar el aviso; al
// recuperarla, si la lista nunca llegó a cargar, lo intenta de una vez (y esa carga ya repinta por su cuenta).
function repintarAccesosSiToca(){
  if (vista !== 'accesos') return;
  if (navigator.onLine !== false && !accesos.length) return cargarAccesos();
  $('#app').innerHTML = vistaAccesos();
}
// Se agregan una sola vez (no en cada render): reevalúan los controles ya dibujados al vuelo cuando cambia la
// señal, y si la pestaña Accesos está abierta, también ella (ver repintarAccesosSiToca arriba).
window.addEventListener('online', () => { aplicarExigeSenal(); repintarAccesosSiToca(); });
window.addEventListener('offline', () => { aplicarExigeSenal(); repintarAccesosSiToca(); });

iniciar();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('terreno-sw.js',{scope:'./registro-terreno'}).catch(()=>{});
</script>
