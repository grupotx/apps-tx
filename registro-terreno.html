<style>
:root{--brand:#e4032e;--brand-ink:#fff;--brand-soft:#fde7eb;--red:var(--brand);--bg:#f2f2f0;--card:#ffffff;--sunk:#eaeae7;--ink:#121212;--mute:#5e6066;--line:#dfdfdb;--gray:#8d939a;--ok:#18864a;--ok-soft:#ddf2e5;--warn:#b86e00;--warn-soft:#fbeed6;
  --f-ui:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--brand:#ff2a4d;--brand-soft:#3a0f18;--bg:#0c0d0f;--card:#15171a;--sunk:#1d2024;--ink:#f1f1f1;--mute:#9a9da4;--line:#2a2d32;--gray:#6b7178;--ok:#4fd18a;--ok-soft:#13301f;--warn:#f2b04a;--warn-soft:#352813;color-scheme:dark}}
:root[data-theme="dark"]{--brand:#ff2a4d;--brand-soft:#3a0f18;--bg:#0c0d0f;--card:#15171a;--sunk:#1d2024;--ink:#f1f1f1;--mute:#9a9da4;--line:#2a2d32;--gray:#6b7178;--ok:#4fd18a;--ok-soft:#13301f;--warn:#f2b04a;--warn-soft:#352813;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:var(--f-ui);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:14px;padding:12px 20px;max-width:1100px;margin:0 auto}
.txmark{width:58px;flex:none;color:var(--ink);display:block}
.ttl{display:flex;flex-direction:column;margin-right:auto;min-width:0;line-height:1.15}
.ttl small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:700}
.ttl h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px;color:var(--ink);text-decoration:none;font-size:13px}
.uchip .av{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:11.5px;font-weight:700}
.uchip .un{display:grid;line-height:1.15}.uchip .un b{font-size:12.5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.uchip .un small{font-size:10.5px;color:var(--mute)}
#estado-conexion{font-size:12px;color:var(--mute)}
nav{display:flex;gap:6px;padding:0 20px 10px;overflow-x:auto;max-width:1100px;margin:0 auto;scrollbar-width:none}
nav button{flex:none;border:1px solid transparent;background:transparent;color:var(--mute);padding:8px 14px;border-radius:10px;font-weight:600;font-size:13.5px;cursor:pointer}
nav button:hover{color:var(--ink);background:var(--sunk)}
nav button.on{background:var(--brand-soft);color:var(--brand)}
@media (max-width:560px){.topin{padding:10px 14px;gap:10px}.txmark{width:44px}.ttl h1{font-size:17px}.uchip{padding:3px;border:0}.uchip .un{display:none}nav{padding:0 14px 10px}}
main{padding:20px;max-width:1100px;margin:0 auto}
@media (max-width:560px){main{padding:14px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:19px;font-weight:800;letter-spacing:-.01em}
h3{margin:20px 0 8px;font-size:15px;font-weight:700}
.mute{color:var(--mute);font-size:13px}
label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--mute);margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
.btn{background:var(--brand);color:var(--brand-ink);border:1px solid var(--brand);border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.6;cursor:wait}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;background:var(--card);color:var(--ink)}
.chip input{display:none}
.chip:has(input:checked),.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.checks{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.check{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:14px;margin:0;text-transform:none;letter-spacing:0;font-weight:500}
.check input{width:auto;margin-top:4px;accent-color:var(--brand)}
.part{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.part:last-child{border-bottom:0}
.part .pi-fila2{grid-column:1/-1;display:grid;grid-template-columns:1.4fr 1fr auto auto;gap:6px;align-items:center}
.part .x{background:transparent;border:1px solid var(--line);border-radius:10px;color:var(--mute);padding:9px 11px;cursor:pointer}
.part .pi-firma-box{display:flex;align-items:center;gap:6px}
.part .btn.firmar{padding:8px 12px;font-size:13px}
.firma-mini{height:34px;max-width:96px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;padding:2px}
.firmo-ok{font-size:12.5px;font-weight:600;color:var(--ok)}
@media (max-width:560px){.part{grid-template-columns:1fr 1fr}.part .pi-nombre{grid-column:1/-1}.part .pi-fila2{grid-template-columns:1fr 1fr auto}.part .pi-email{grid-column:1/-1}.part .pi-fono{grid-column:1/-1}.part .pi-firma-box{grid-column:1/3;grid-row:3}.part .x{grid-column:3;grid-row:3}}
.kind-sel{margin:0 0 4px}
.kind-sel .chip{font-size:14px;padding:9px 16px;margin:0;text-transform:none;letter-spacing:0;font-weight:600}
.tag.enc{color:var(--warn);background:var(--warn-soft)}
.qr-box{border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;text-align:center;background:var(--sunk)}
.qr-box .qr-img{width:min(100%,440px);aspect-ratio:1;margin:0 auto;background:#fff;border-radius:12px;padding:6px}
.qr-box .qr-img svg{display:block;width:100%;height:100%}
.qr-box .qr-enlace{font-family:var(--f-mono);font-size:14px;font-weight:700;word-break:break-all;user-select:all;margin:14px 0 4px}
.qr-box .acciones{justify-content:center}
.part-barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.cierre{border-top:1px solid var(--line);margin-top:22px;padding-top:4px}
.firmas-cierre{display:flex;flex-wrap:wrap;gap:14px 24px;margin-top:6px}
.firma-cierre{display:flex;align-items:center;gap:8px}
.firma-cierre .rotulo{font-size:13px;font-weight:600}
.enlace{background:none;border:0;padding:0;color:var(--brand);font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline}
.ens-fila{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--bg)}
.ens-cab{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.ens-n{font-family:var(--f-mono);font-weight:700;color:var(--mute);min-width:3.2em}
.ens-fila .x{background:transparent;border:1px solid var(--line);border-radius:10px;color:var(--mute);padding:9px 11px;cursor:pointer}
.ens-g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
@media (max-width:560px){.ens-g{grid-template-columns:1fr 1fr}}
.ens-fila label{margin:0 0 4px;font-size:10px}
.ens-fila .ens-falla{margin-top:8px}
.ens-fila:not([data-manual="1"]) .ens-man{display:none}
.ens-g .ens-man{margin-left:6px;color:var(--warn);font-weight:700;letter-spacing:0;text-transform:none}
.ens-apoyo{background:var(--sunk);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:12px 0;font-size:13.5px}
.ens-apoyo p{margin:4px 0 0}
.ens-apoyo .aviso{margin:6px 0 0}
.pies label{margin-top:10px}
.fg{align-items:center;margin-top:10px}
.fg-txt{flex:1 1 160px;min-width:0}
.fg-txt label{margin-top:0}
.informe-ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:12px}
.informe-dlg{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;overflow:auto}
.informe-dlg h2{margin:0 0 2px}
.envio-dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0;font-size:14px}
.envio-dl dt{color:var(--mute);font-weight:600}.envio-dl dd{margin:0;word-break:break-word}
.envio-para{font-size:18px;margin:2px 0 0;word-break:break-all}
.envio-msg{display:block;width:100%;box-sizing:border-box;white-space:pre-wrap;font:13px/1.45 inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:160px;max-height:320px;resize:vertical}
.informe-vista{flex:1;min-height:55vh;width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:8px}
.part-barra .mute{margin-left:auto}
.ac{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:4px;max-height:280px;overflow:auto;box-shadow:0 18px 40px -16px rgba(0,0,0,.45)}
.sug button{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:10px 12px;cursor:pointer;font-weight:600}
.sug button:hover{background:var(--sunk)}
.sug button:last-child{border-bottom:0}
.sug button small{color:var(--mute);display:block;font-weight:400;font-family:var(--f-mono);font-size:11.5px}
.sug button.nuevo{color:var(--brand)}
.cli-ok{font-size:12px;color:var(--ok);margin-top:6px;font-family:var(--f-mono)}
.cli-new{font-size:12px;color:var(--brand);margin-top:6px}
.hero{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;opacity:.45;-webkit-mask-image:linear-gradient(115deg,transparent 35%,#000);mask-image:linear-gradient(115deg,transparent 35%,#000);pointer-events:none}
.hero>*{position:relative}
.hero .eb{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:700}
.hero h2{font-size:24px;margin:6px 0 4px}
.hero .acciones{margin-top:14px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
.kpi b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi small{display:block;font-size:12px;color:var(--mute);font-family:var(--f-mono)}
.kpi.hot b{color:var(--brand)}
.graficos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.graficos{grid-template-columns:1fr}}
.chart-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;min-height:260px}
.chart-box h3{margin:0 0 10px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.chart-box .cv{position:relative;height:220px}
.chart-box.ancho{grid-column:1/-1}
.tag{display:inline-block;font-family:var(--f-mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--mute);margin-right:8px;vertical-align:2px}
.tag.v{color:var(--brand);background:var(--brand-soft)}
.aviso{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.fotos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fotos a{display:block;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
details.mas summary{cursor:pointer;color:var(--brand);font-size:13px;font-weight:600;margin-top:8px}
details.mas p{margin:6px 0}
.acc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:0}
.acc small{display:block;color:var(--mute);font-family:var(--f-mono);font-size:11.5px}
.sw{position:relative;width:46px;height:26px;flex:none;margin:0}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--brand)}
.sw input:checked+span:before{transform:translateX(20px)}
.gate{max-width:420px;margin:48px auto;padding:24px}
.gate .txmark{width:110px;margin-bottom:18px}
.del{background:transparent;border:0;color:var(--mute);font-size:12px;cursor:pointer;text-decoration:underline;float:right}
.del + .del{margin-right:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;transition:transform .25s;font-size:14px;max-width:90%;z-index:20}
#toast.on{transform:translateX(-50%) translateY(0)}
.ttl small::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:#1fb3b5;margin-right:7px;vertical-align:1px;box-shadow:0 0 10px #1fb3b5}
</style>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();

const mesKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 2600);
}
function setConexion(html){ const el = $('#estado-conexion'); if (el) el.innerHTML = html; }

/* ===================== Sesión y acceso ===================== */
function pantallaLogin(msg){
  $('#nav').hidden = true;
  setConexion(EN_PORTAL ? '' : '<a href="./">Portal</a>');
  $('#app').innerHTML = `<form class="card gate" id="login">
    <span class="txmark">${$('.topbar .txmark').innerHTML}</span>
    <h2>Ingresar</h2>
    ${msg ? `<div class="aviso">${esc(msg)}</div>` : ''}
    <label>Correo</label><input id="lg-email" type="email" autocomplete="username" required>
    <label>Contraseña</label><input id="lg-pass" type="password" autocomplete="current-password" required>
    <div class="acciones"><button class="btn" id="lg-btn" type="submit">Ingresar</button></div>
    <p class="mute">Usa el mismo correo y contraseña de las apps Grupo TX.</p>
  </form>`;
  $('#login').onsubmit = async e => {
    e.preventDefault();
    const b = $('#lg-btn'); b.disabled = true; b.textContent = 'Ingresando…';
    const { error } = await sb.auth.signInWithPassword({ email: $('#lg-email').value.trim(), password: $('#lg-pass').value });
    if (error) return pantallaLogin(/invalid/i.test(error.message) ? 'Correo o contraseña incorrectos.' : error.message);
    iniciar();
  };
}

async function iniciar(){
  setConexion('Conectando…');
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return pantallaLogin();
  const [acc, prof] = await Promise.all([
    sb.rpc('rt_tengo_acceso'),
    sb.from('profiles').select('nombre,email,rol,activo').eq('id', session.user.id).maybeSingle()
  ]);
  const p = prof.data || {};
  me = { id: session.user.id, email: session.user.email,
         nombre: p.nombre || session.user.user_metadata?.nombre || session.user.email.split('@')[0],
         admin: !!(p.activo && p.rol === 'admin') };
  if (acc.error || !acc.data) {
    $('#nav').hidden = true;
    setConexion(esc(me.nombre));
    $('#app').innerHTML = `<div class="card gate"><h2>Sin acceso a Registro de Terreno</h2>
      <p>Tu cuenta (${esc(me.email)}) todavía no tiene acceso a este módulo. Pídele al administrador que te habilite en la pestaña <b>Accesos</b>.</p>
      <div class="acciones">${EN_PORTAL ? '' : '<a class="btn" href="./">Volver al portal</a>'}
      <button class="btn ghost" onclick="sb.auth.signOut().then(()=>location.reload())">Cerrar sesión</button></div></div>`;
    return;
  }
  $('#nav').hidden = false;
  $('#nav-accesos').hidden = !me.admin;
  setConexion(`<a class="uchip" ${EN_PORTAL ? '' : 'href="./" title="Volver al portal"'}><span class="av">${esc(iniciales(me.nombre))}</span><span class="un"><b>${esc(me.nombre)}</b><small>${me.admin ? 'Administrador' : 'Product Manager'}</small></span></a>`);
  render();
  await cargar();
  sb.rpc('rt_productos').then(({ data }) => { if (data && data.length) catalogo = data; });
}

// El listado NO trae los participantes (con sus firmas en PNG): solo cuántos son. Los datos de cada uno se piden
// cuando se necesitan (abrir la actividad, "Ver participantes").
const mapRegistro = r => ({ ...(r.datos || {}), id: r.id, kind: r.kind, fecha: r.fecha, cliente: r.cliente, cliente_id: r.cliente_id,
  obra: r.obra, estado: r.estado, fotos: r.fotos || [], autor: r.autor, autor_nombre: r.autor_nombre, creado: r.created_at, _datos: r.datos || {},
  asistencia_abierta: !!r.asistencia_abierta, nAsistencias: TC.conteoAsistencias(r.rt_asistencias) });

async function cargar(){
  const { data, error } = await sb.from('registros').select('*, rt_asistencias(count)').order('fecha', { ascending: false }).order('created_at', { ascending: false }).limit(2000);
  if (error) { setConexion('Error de conexión'); toast('No se pudieron cargar los registros'); return; }
  registros = data.map(mapRegistro);
  ultimaCarga = Date.now();
  if (vista === 'panel' || vista === 'registros') render();
}

// `p` viene de TC.participantesVista: { rut, nombre, cargo, email, fono, firma (PNG o ''), firmo }
function firmaHtml(p){
  if (esPngFirma(p.firma)) return `<img class="firma-mini" alt="Firma" src="${esc(p.firma)}">`;
  return p.firmo ? '<span class="firmo-ok">Firmó</span>' : '';   // registro viejo: firmó sin imagen
}
// `origen`: 'tabla' (ya está en rt_asistencias), 'viejo' (de datos.participantes de un registro anterior) o 'nuevo'.
function filaPart(p = {}, origen = 'nuevo'){
  const firmada = esPngFirma(p.firma);
  return `<div class="part" data-id="${esc(p.id || crypto.randomUUID())}" data-origen="${origen}" data-firmo="${p.firmo ? 1 : ''}">
    <input class="pi-rut" placeholder="RUT" value="${esc(p.rut)}">
    <input class="pi-nombre" placeholder="Nombre" value="${esc(p.nombre)}">
    <input class="pi-cargo" placeholder="Cargo" value="${esc(p.cargo)}">
    <div class="pi-fila2">
      <input class="pi-email" type="email" inputmode="email" placeholder="Correo" value="${esc(p.email)}">
      <input class="pi-fono" type="tel" inputmode="tel" placeholder="Teléfono" value="${esc(p.fono)}">
      <span class="pi-firma-box"><input type="hidden" class="pi-firma" value="${firmada ? esc(p.firma) : ''}"><span class="pi-firma-vista">${firmaHtml(p)}</span><button type="button" class="btn ghost firmar" data-a="firmar">${firmada ? 'Cambiar' : 'Firmar'}</button></span>
      <button type="button" class="x" data-a="delPart" title="Quitar">✕</button>
    </div>
  </div>`;
}
function ponerFirma(row, png){
  row.querySelector('.pi-firma').value = png;
  row.dataset.firmo = png ? '1' : '';
  row.dataset.sucia = '1';
  row.querySelector('.pi-firma-vista').innerHTML = firmaHtml({ firma: png, firmo: !!png });
  row.querySelector('.firmar').textContent = png ? 'Cambiar' : 'Firmar';
}
async function firmarFila(b){
  const row = b.closest('.part'), nombre = row.querySelector('.pi-nombre').value.trim();
  const png = await abrirFirma({ titulo: nombre ? `Firma de ${nombre}` : 'Firma del participante', firma: row.querySelector('.pi-firma').value });
  if (png !== null) ponerFirma(row, png);
}

// Una extracción. El MPa se muestra calculado (carga × 1000 ÷ área); si el laboratorio entrega otro valor el PM lo

function filaEnsayoHtml(f = {}){
  const manual = TC.esManual(f);
  const calc = TC.mpaDeFila({ ...f, mpa: undefined });
  return `<div class="ens-fila" data-manual="${manual ? 1 : ''}">
    <div class="ens-cab"><span class="ens-n"></span><input class="e-sustrato" placeholder="Sustrato o ubicación (ej. Dpto 106)" value="${esc(f.sustrato)}">

    <div class="ens-g">
      <div><label>Carga (kN)</label><input class="e-carga" inputmode="decimal" value="${esc(TC.fmtNum(f.cargaKn))}"></div>
      <div><label>Ancho corte (mm)</label><input class="e-ancho" inputmode="decimal" value="${esc(TC.fmtNum(f.anchoMm === undefined ? 50 : f.anchoMm))}"></div>
      <div><label>Alto corte (mm)</label><input class="e-alto" inputmode="decimal" value="${esc(TC.fmtNum(f.altoMm === undefined ? 50 : f.altoMm))}"></div>
      <div><label>MPa<span class="ens-man">manual</span></label><input class="e-mpa" inputmode="decimal" value="${esc(manual ? TC.fmtNum(f.mpa) : TC.fmtMpa(calc))}"></div>
    </div>
    <div class="ens-falla"><label>Tipo de falla</label><input class="e-falla" list="fallas-dl" placeholder="Elige de la lista o escribe" value="${esc(f.falla)}"></div>
    <button type="button" class="enlace ens-man" data-a="mpaAuto" style="margin:6px 0 0">Volver al MPa calculado</button>
  </div>`;
}

}

// Las filas tal como están escritas (el MPa solo cuenta si es manual).
const leerFilasEnsayo = () => [...document.querySelectorAll('#ens-filas .ens-fila')].map(row => ({
  sustrato: row.querySelector('.e-sustrato').value, carga: row.querySelector('.e-carga').value,
  ancho: row.querySelector('.e-ancho').value, alto: row.querySelector('.e-alto').value,
  mpa: row.dataset.manual ? row.querySelector('.e-mpa').value : '', falla: row.querySelector('.e-falla').value
}));
// Una foto ya guardada, dentro del formulario: miniatura, pie (solo en el ensayo) y «Quitar».
// La miniatura reusa el marcado de .fotos para que cargarFotos() le resuelva la URL firmada,
// y el data-path de la fila es la única fuente de las rutas que sobreviven.
function filaFotoGuardadaHtml(path, i, pie){
  return `<div class="fotos fg" data-path="${esc(path)}">`
    + `<a target="_blank" rel="noopener" data-path="${esc(path)}"><img alt="Foto ${i + 1} ya guardada"></a>`
    + `<div class="fg-txt">${pie == null ? `<small class="mute">Imagen ${i + 1} (ya guardada)</small>`
      : `<label>Pie de la imagen ${i + 1} (ya guardada)</label><input class="pie-foto" value="${esc(pie)}">`}</div>`
    + '<button type="button" class="btn ghost" data-a="quitarFoto">Quitar</button></div>';
}

// Las fotos guardadas que siguen en el formulario, cada una con su pie, en una sola pasada:
// leer las rutas y los pies por separado permitiría que quedaran desalineados.
const fotosGuardadasConPie = () => [...document.querySelectorAll('#form .fg[data-path]')].map(d => {
  const pie = d.querySelector('.pie-foto');
  return { ruta: d.dataset.path, pie: pie ? pie.value : '' };

const fotosGuardadasVivas = () => fotosGuardadasConPie().map(x => x.ruta);
const piesNuevos = () => [...document.querySelectorAll('#pies-nuevas .pie-foto')].map(i => i.value);

// El aviso del cupo se recalcula: tras quitar una foto, N no puede quedar mintiendo.
function renderAvisoCupo(){

  if (!$('#aviso-cupo')) input.insertAdjacentHTML('afterend', '<p class="mute" id="aviso-cupo"></p>');

// Tras quitar: renumera las guardadas, recalcula el aviso y los pies de las nuevas.
function refrescarFotosGuardadas(){
  document.querySelectorAll('#form .fg').forEach((d, i) => {
    const l = d.querySelector('label'), sm = d.querySelector('small'), img = d.querySelector('img');
    if (l) l.textContent = `Pie de la imagen ${i + 1} (ya guardada)`;
    if (sm) sm.textContent = `Imagen ${i + 1} (ya guardada)`;

}

const leerPies = () => [...document.querySelectorAll('#form .pie-foto')].map(i => i.value.trim());

// Recalcula lo que depende de la tabla: numeración, MPa calculado, indicadores de apoyo (solo pantalla) y texto base de la conclusión.
function actualizarEnsayo(){
  if (!$('#ens-filas')) return;
  const crudas = leerFilasEnsayo();
  let k = 0;
  document.querySelectorAll('#ens-filas .ens-fila').forEach((row, i) => {
    const c = crudas[i];
    row.querySelector('.ens-n').textContent = TC.filaEnBlanco(c) ? '—' : 'N° ' + (++k);
    if (!row.dataset.manual) row.querySelector('.e-mpa').value = TC.fmtMpa(TC.mpa(TC.numero(c.carga), TC.numero(c.ancho), TC.numero(c.alto)));
  });
  const filas = TC.normalizarFilas(crudas), r = TC.resumenEnsayo(filas);
  $('#ens-apoyo').innerHTML = `<b>Apoyo para redactar la conclusión</b> <span class="mute">solo se ve aquí: no aparece en el informe</span>`
    + (r.min == null ? '<p class="mute">Aún no hay resultados.</p>'
      : `<p>Mínimo <b>${TC.fmtMpa(r.min)}</b> · Máximo <b>${TC.fmtMpa(r.max)}</b> · Promedio <b>${TC.fmtMpa(r.prom)}</b> MPa</p>`
        + (r.bajoUmbral.length ? `<p class="aviso">Bajo 0,20 MPa: N° ${r.bajoUmbral.map(esc).join(', ')}</p>` : '<p class="mute">Ninguna extracción bajo 0,20 MPa.</p>'));
  const c = $('#conclusion');
  if (c && !c.dataset.editada) c.value = TC.conclusionBase(filas);
}

// Un pie de foto por cada foto elegida (las ya guardadas tienen el suyo en #pies-guardadas).

/* ===================== Guardado ===================== */
function leerCampos(){
  const d = {};
  document.querySelectorAll('#form [name]').forEach(el => {
    const n = el.name;
    if (el.type === 'checkbox') { d[n] = d[n] || []; if (el.checked) d[n].push(el.value); }
    else if (el.type === 'radio') { if (el.checked) d[n] = el.value; }
    else if (el.type === 'file') d[n] = [...el.files];
    else d[n] = el.value.trim();
  });
  return d;
}

// Filas del formulario tal como están en pantalla. El plan (TC.planParticipantes) decide qué va a la base.
function leerParticipantes(){
  return [...document.querySelectorAll('#partics .part')].map(row => ({
    id: row.dataset.id, origenFila: row.dataset.origen, sucia: !!row.dataset.sucia,
    rut: row.querySelector('.pi-rut').value.trim(),
    nombre: row.querySelector('.pi-nombre').value.trim(),
    cargo: row.querySelector('.pi-cargo').value.trim(),
    email: row.querySelector('.pi-email').value.trim(),
    fono: row.querySelector('.pi-fono').value.trim(),
    firma: row.querySelector('.pi-firma').value
  }));
}

const esUuid = s => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s);
const colsPart = f => ({ nombre: f.nombre, rut: f.rut, cargo: f.cargo, email: f.email, fono: f.fono, firma: esPngFirma(f.firma) ? f.firma : '' });
const filaDom = id => [...document.querySelectorAll('#partics .part')].find(r => r.dataset.id === id);

// Lleva a rt_asistencias lo que el PM escribió (origen 'manual'). Las filas ya guardadas quedan marcadas como
// 'tabla', así un reintento después de una falla a medias no duplica nada.
async function aplicarPlan(registroId, plan){
  const t = () => sb.from('rt_asistencias');
  const borrar = plan.borrar.filter(esUuid);
  if (borrar.length) {
    const { error } = await t().delete().eq('registro_id', registroId).in('id', borrar);
    if (error) throw error;
    borrar.forEach(id => quitados.delete(id));
  }
  if (plan.insertar.length) {
    const nuevas = plan.insertar.map(f => ({ f, id: esUuid(f.id) ? f.id : crypto.randomUUID() }));
    const { error } = await t().insert(nuevas.map(({ f, id }) => ({ id, registro_id: registroId, origen: 'manual', ...colsPart(f) })));
    if (error) throw error;
    nuevas.forEach(({ f, id }) => { const row = filaDom(f.id); if (row) { row.dataset.id = id; row.dataset.origen = 'tabla'; delete row.dataset.sucia; } });
  }
  await Promise.all(plan.actualizar.map(async f => {
    const { error } = await t().update(colsPart(f)).eq('id', f.id).eq('registro_id', registroId);
    if (error) throw error;
    const row = filaDom(f.id); if (row) delete row.dataset.sucia;
  }));
}

// Reduce la foto antes de subirla (máx. 1600 px, JPEG)
function comprimir(file){
  return new Promise(res => {
    if (!/^image\//.test(file.type)) return res(file);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => res(b || file), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

function validarCampos(kind, d, fotosPrevias = 0){
  if (kind === 'adherencia') {
    const falta = TC.validarEnsayo(d, TC.normalizarFilas(leerFilasEnsayo()));
    if (falta) return falta;
    const { sobran } = TC.cupoFotos(fotosPrevias, (d.fotos || []).length);
    return sobran ? `Máximo ${TC.MAX_FOTOS} fotos por ensayo: quita ${sobran}` : '';
  }
  if (!d.fecha) return 'Falta la fecha';
  if (!d.cliente) return 'Indica el cliente';
  if (kind === 'visita') {
    if (!d.motivo) return 'Describe el motivo del reclamo';
    const { sobran } = TC.cupoFotos(fotosPrevias, (d.fotos || []).length);
    return sobran ? `Máximo ${TC.MAX_FOTOS} fotos por visita: quita ${sobran}` : '';
  }
  return d.nombre ? '' : 'Falta el nombre de la actividad';
}

// Campos de la visita que van a `datos` (los usa el guardado y el informe: lo que se ve es lo que se guarda).
const datosVisita = d => ({
  direccion: d.direccion || '', contacto: d.contacto || '', producto: d.producto || '',
  motivo: d.motivo, verificacion: d.verificacion || '', causa: d.causa || '',
  solucion: d.solucion || '', lab: d.lab || 'No'
});

// Refleja en la lista local lo que acaba de quedar en la base, sin volver a pedir todos los registros.
function actualizarLocal(id, fila, datos, fotos){
  const i = registros.findIndex(x => x.id === id), previo = registros[i];
  const nuevo = mapRegistro({ ...fila, id, datos, fotos, autor: previo ? previo.autor : me.id, autor_nombre: previo ? previo.autor_nombre : me.nombre,
    created_at: previo ? previo.creado : new Date().toISOString(), asistencia_abierta: previo ? previo.asistencia_abierta : false,
    rt_asistencias: [{ count: previo ? previo.nAsistencias : 0 }] });
  if (i >= 0) registros[i] = nuevo; else registros.unshift(nuevo);
}

// Escribe el registro (insert o update) y, si es una actividad, sus participantes. Devuelve el id.
// `registroId`: si viene, corrige ese registro; si no, crea uno nuevo. Sirve igual para el guardado final y para el
// borrador que se crea al generar el QR. `btn` solo muestra el avance de las fotos.
async function persistir(kind, d, registroId, btn){
  /* Cliente: si no se eligió de la base, se crea (o se reutiliza si ya existe ese RUT/nombre) */
  let clienteId = cliSel && norm(cliSel.nombre) === norm(d.cliente) ? cliSel.id : null;
  if (!clienteId) {
    const { data, error } = await sb.rpc('rt_crear_cliente', { p_nombre: d.cliente, p_rut: d.cli_rut || '', p_comuna: d.cli_comuna || '', p_direccion: d.direccion || '' });
    if (error) throw error;
    clienteId = data;
    cliSel = { ...(cliSel || {}), id: clienteId, nombre: d.cliente }; cliNuevo = false; infoCliente();   // ya está en la base
  }

  const previo = registroId ? registros.find(x => x.id === registroId) : null;
  // Una sola lectura del formulario, ANTES de subir nada: las fotos que sobreviven con su pie, los
  // pies de las nuevas y la tabla del ensayo. Entre medio hay un await por cada foto que se sube;
  // leer unas antes y otras después dejaría un pie describiendo la imagen equivocada.
  const guardadas = fotosGuardadasConPie(), piesDeLasNuevas = piesNuevos(), filasEns = kind === 'adherencia' ? leerFilasEnsayo() : null;
  if (registroId && !previo) throw new Error('El registro ya no está disponible. Recarga la página.');
  const id = registroId || crypto.randomUUID();
  const fotos = [];
  if (esInforme(kind) && d.fotos && d.fotos.length) {
    for (let i = 0; i < d.fotos.length; i++) {
      if (btn) btn.textContent = `Subiendo foto ${i + 1} de ${d.fotos.length}…`;
      const blob = await comprimir(d.fotos[i]);
      const path = `${id}/${i + 1}-${Date.now()}.jpg`;
      const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: blob.type || 'image/jpeg' });
      if (error) throw error;
      fotos.push(path);
    }
  }

  // Lo que queda tras la corrección: las guardadas que sobrevivieron (con su pie) más las recién
  // subidas (con el suyo). Una sola regla decide las fotos y sus pies, así que no pueden divergir.
  const fotosDeLaCorreccion = TC.fotosYPies(guardadas, fotos.map((ruta, i) => ({ ruta, pie: piesDeLasNuevas[i] })));

  const datos = { ...(previo ? previo._datos : {}), observaciones: d.observaciones || '' };   // al corregir se conservan los campos que el formulario no toca
  if (kind === 'visita') {
    Object.assign(datos, datosVisita(d));
    // Los datos del cliente al cierre no son obligatorios: sin nada escrito ni firmado no se guarda `cierre`.
    const cierre = cierreDeCampos(d);
    if (cierre) datos.cierre = cierre; else delete datos.cierre;
  } else if (kind === 'adherencia') {
    Object.assign(datos, TC.datosEnsayo(d, filasEns, fotosDeLaCorreccion.pies));
  } else {
    // Los participantes ya no viajan en datos: viven en rt_asistencias.
    Object.assign(datos, {
      nombre: d.nombre, duracion: d.duracion || '60', relator: d.relator || '',
      cargo: d.cargo || '', temas: d.temas || [],
      tipo_act: kind === 'capacitacion' ? (d.tipo_act || 'Capacitación') : 'Charla técnica'
    });
  }
  const plan = esInforme(kind) ? null : TC.planParticipantes(leerParticipantes(), { quitados: [...quitados], viejo: partsViejo });

  const fila = {
    kind, fecha: d.fecha, cliente: d.cliente, cliente_id: clienteId, obra: d.obra || '',
    estado: kind === 'visita' ? (d.estado || 'Abierto') : null
  };
  if (registroId) {
    // Los participantes primero: si la lista de un registro viejo pasa a la tabla, datos.participantes solo se
    // retira cuando ya están guardados en ella.
    if (plan) await aplicarPlan(registroId, plan);
    if (plan && plan.migrar) delete datos.participantes;
    // Corrección: huella de quién y cuándo (un borrador que aún no se ha cerrado no es una corrección);
    // autor no se toca; las fotos previas se suman a las nuevas menos las que el PM quitó.
    const ahora = new Date().toISOString();
    const datosFinal = TC.esBorrador(previo) ? datos : TC.marcarEdicion(datos, me.nombre, ahora);
    const fotosFinal = esInforme(kind) ? fotosDeLaCorreccion.fotos : TC.fotosEditadas(previo.fotos, fotos);
    const { data, error } = await sb.from('registros').update({ ...fila, datos: datosFinal, fotos: fotosFinal, updated_at: ahora }).eq('id', registroId).select('id');
    if (error) throw error;
    if (!data || !data.length) throw new Error('Solo el autor del registro o un administrador puede corregirlo');
    actualizarLocal(id, fila, datosFinal, fotosFinal);
  } else {
    const { error } = await sb.from('registros').insert({ id, ...fila, datos, fotos, autor: me.id, autor_nombre: me.nombre });
    if (error) throw error;
    // Desde aquí el registro existe: si algo falla después, reintentar corrige este mismo registro en vez de duplicarlo.
    editandoId = id;
    actualizarLocal(id, fila, datos, fotos);
    if (plan) {
      try { await aplicarPlan(id, plan); }
      catch(e){ throw Object.assign(e, { registroGuardado: true }); }   // el registro ya existe: quien llama debe decirlo
    }
  }
  if (plan && plan.migrar) { partsViejo = false; quitados.clear(); }
  return id;
}

// `registroId`: si viene, corrige ese registro (update); si no, crea uno nuevo (insert).
// `enviar`: tras guardar, ofrece enviar la copia al cliente (con confirmación; nada sale sin que el PM la acepte).
async function guardar(kind, btn, registroId, enviar){
  const d = leerCampos();
  if (!esInforme(kind)) kind = d.kind_sel === 'capacitacion' ? 'capacitacion' : 'charla';
  const falta = validarCampos(kind, d, esInforme(kind) && registroId ? fotosGuardadasVivas().length : 0);
  if (falta) return toast(falta);

  btn.disabled = true; const txt = btn.textContent; btn.textContent = 'Guardando…';
  // Subir las fotos toma segundos: mientras tanto, nada que cambie la lista queda al alcance del dedo.
  const bloqueados = [...document.querySelectorAll('#form [data-a="quitarFoto"], #form [name="fotos"], #form [data-a="guardar"], #form [data-a="guardarEnviar"]')];
  bloqueados.forEach(el => { el.disabled = true; });
  const desbloquear = () => bloqueados.forEach(el => { el.disabled = false; });
  let guardadoId = null;
  try {
    const eraBorrador = TC.esBorrador(registros.find(x => x.id === registroId));
    const id = await persistir(kind, d, registroId, btn);
    if (kind === 'adherencia') recordarFirmante(d);
    // Al guardar la actividad el enlace del QR deja de aceptar participantes. Si el cierre falla el registro queda
    // como "en curso" en Registros, con su botón para cerrarlo.
    let aviso = '';
    const reg = registros.find(x => x.id === id);
    if (TC.esBorrador(reg)) {
      const { error } = await sb.rpc('rt_asistencia_cerrar', { p_registro: id });
      if (error) aviso = ' Pero no se pudo cerrar la asistencia por QR: ciérrala desde Registros.';
      else reg.asistencia_abierta = false;
    }
    toast((registroId && !eraBorrador ? 'Cambios guardados.' : 'Registro guardado.') + aviso);
    cliSel = null; cliNuevo = false; editandoId = null;
    vista = registroId || esInforme(kind) ? 'registros' : 'panel';
    render(); window.scrollTo(0, 0);
    guardadoId = id;
    if (!enviar) cargar();
  } catch(e){
    desbloquear(); btn.disabled = false; btn.textContent = txt;
    if (e && e.registroGuardado) return toast('La actividad quedó guardada, pero no se pudo guardar la lista de participantes: ' + (e.message || e.code || 'error') + '. Toca Guardar otra vez para completarla.');
    toast('No se pudo guardar: ' + (e.code === '42501' ? 'solo el autor del registro o un administrador puede corregirlo' : e.message || e.code || 'error'));
  }
  // El envío va aparte: si falla, el registro YA está guardado y el aviso no debe decir que no se guardó.
  if (guardadoId && enviar) {
    try { await cargar(); await enviarRegistro(guardadoId); }
    catch(e){ console.error(e); toast(gen(kind).Art + ' quedó guardad' + gen(kind).o + ', pero el envío falló: ' + (e.message || 'error') + '. Revisa la ficha antes de reintentar.'); }
  }
}

/* ===================== Informe de la visita (PDF) ===================== */
// El logo sale del SVG de la barra superior (vectorial: imprime nítido y no agrega archivos). Dentro de una imagen
// `currentColor` y las variables CSS no se resuelven, así que se fijan los colores.
const logoInforme = () => $('.topbar .txmark svg').outerHTML.replace(/style="[^"]*"/, 'width="92" height="39"').replace(/currentColor/g, '#121212').replace(/var\(--brand\)/g, '#e4032e');

const informeHtml = reg => reg.kind === 'adherencia'
  ? TC.informeAdherenciaHtml(reg, { fotos: reg.fotos, logo: logoInforme() })
  : TC.informeVisitaHtml(reg, { fotos: reg.fotos, logo: logoInforme(), pm: reg.pm });
const TITULO_INFORME = { visita: 'Informe de visita técnica', adherencia: 'Informe de prueba de adherencia' };

const blobADataUrl = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob); });

// Foto ya subida: se lee igual que la ficha (Storage; si ya se archivó en Drive, por la función foto-archivada).
// Ya viene reducida (1600 px, JPEG): se incrusta tal cual.
// El tipo lo decide el contenido, no lo que declare el servidor: un 404 o una página de error de Drive (a veces sin tipo)
// no debe pasar por foto. Si los bytes no son de imagen, la foto se trata como no disponible y se avisa cuál.
async function comoImagen(blob, n){
  const tipo = TC.tipoImagen(new Uint8Array(await blob.slice(0, 12).arrayBuffer()));
  if (!tipo) throw new Error(`La fotografía ${n} no está disponible (el archivo no es una imagen).`);
  return blob.type === tipo ? blob : new Blob([blob], { type: tipo });
}
async function fotoGuardadaDataUrl(path, n){
  const { data } = await sb.storage.from(BUCKET).download(path);
  if (data) return blobADataUrl(await comoImagen(data, n));
  if (window.fotoArchivada) {
    const u = await fotoArchivada(BUCKET, path), res = await fetch(u);
    if (!res.ok) throw new Error(`La fotografía ${n} no está disponible (respuesta ${res.status}).`);
    return blobADataUrl(await comoImagen(await res.blob(), n));
  }
  throw new Error(`La fotografía ${n} no está disponible.`);
}

// Fotos de la visita como data URL: las ya guardadas más las recién elegidas (reducidas igual que al subirlas).
async function fotosComoDataUrl(rutas, archivos){
  const guardadas = await Promise.all((rutas || []).map((p, i) => fotoGuardadaDataUrl(p, i + 1)));
  const nuevas = [];
  for (const f of archivos || []) nuevas.push(await blobADataUrl(await comprimir(f)));
  return [...guardadas, ...nuevas].slice(0, TC.MAX_FOTOS);
}

// Registro tal como lo consume el informe. `datos` ya incluye `cierre` (quien recibe y las dos firmas).
function regParaInforme(r, fotos){
  return { kind: r.kind, id: r.id, cliente: r.cliente, obra: r.obra, fecha: r.fecha, datos: r._datos || {}, pm: r.autor_nombre || me.nombre, fotos };
}
function regDesdeFormulario(kind = 'visita'){
  const d = leerCampos(), previo = editandoId ? registros.find(x => x.id === editandoId) : null;
  return {
    kind, id: editandoId || null, cliente: d.cliente, obra: d.obra, fecha: d.fecha, pm: previo ? previo.autor_nombre : me.nombre,
    datos: kind === 'adherencia' ? TC.datosEnsayo(d, leerFilasEnsayo(), leerPies()) : { ...datosVisita(d), cierre: cierreDeCampos(d) }
  };
}

// Hash corto del HTML: permite saber si el informe que se vio sigue siendo el de lo que hay ahora en pantalla.
const huellaTexto = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36) + '-' + s.length; };

const MARGEN_PDF = [24, 28, 64, 28];   // pt: arriba, derecha, abajo (aquí va el pie), izquierda
const MARGEN_PDF_ADHERENCIA = [66, 28, 64, 28];   // más arriba: aquí va el encabezado del documento controlado
const margenPdf = reg => reg.kind === 'adherencia' ? MARGEN_PDF_ADHERENCIA : MARGEN_PDF;
const ANCHO_PDF_PX = Math.floor((595.28 - MARGEN_PDF[1] - MARGEN_PDF[3]) * 96 / 72);   // ancho útil de la hoja A4 en px: el informe se maqueta a este ancho

// Encabezado del documento controlado (informe de adherencia), en cada hoja: título, código, creación, versión y "Página X de Y".
function encabezadoDePagina(pdf, i, n){ TC.dibujarEncabezado(pdf, i, n, MARGEN_PDF_ADHERENCIA); }

// Pie institucional en cada hoja y, en la visita, "Página X de Y" (en el informe de adherencia va en el encabezado). html2pdf no los trae.
function pieDePagina(pdf, adherencia){
  const n = pdf.internal.getNumberOfPages(), W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
  for (let i = 1; i <= n; i++) {
    pdf.setPage(i);
    if (adherencia) encabezadoDePagina(pdf, i, n);
    pdf.setDrawColor(200); pdf.setLineWidth(0.5); pdf.line(MARGEN_PDF[3], H - 56, W - MARGEN_PDF[1], H - 56);
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(7.5); pdf.setTextColor(90);
    pdf.text(TC.PIE[0], W / 2, H - 46, { align: 'center' });
    pdf.setFont('helvetica', 'normal');
    TC.PIE.slice(1).forEach((t, k) => pdf.text(t, W / 2, H - 37 + k * 9, { align: 'center' }));
    if (!adherencia) pdf.text(`Página ${i} de ${n}`, W - MARGEN_PDF[1], H - 14, { align: 'right' });
  }
}

// Genera el PDF UNA vez. Quien lo ve y quien lo envía usan este mismo resultado: { blob, base64, nombre, huella, registroId }.
// `registroId` (null si la visita aún no está guardada) dice a qué visita pertenece: el envío debe validar identidad Y huella.
async function generarPdf(reg){
  if (!window.html2pdf) throw new Error('No se pudo cargar el generador de PDF. Revisa tu conexión.');
  const html = informeHtml(reg);
  const host = document.createElement('div');
  host.style.cssText = `position:fixed;left:-10000px;top:0;width:${ANCHO_PDF_PX}px;background:#fff`;
  host.innerHTML = html; document.body.appendChild(host);
  try {
    const pdf = await html2pdf().set({
      margin: margenPdf(reg), image: { type: 'jpeg', quality: 0.9 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
      jsPDF: { unit: 'pt', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css'], avoid: ['.inf-bloque', '.inf-fila', '.inf-res'] }
    }).from(host.firstElementChild).toPdf().get('pdf');
    pieDePagina(pdf, reg.kind === 'adherencia');
    const blob = pdf.output('blob');
    const base64 = (await blobADataUrl(blob)).split(',')[1];
    return { blob, base64, nombre: TC.nombreInforme(reg), huella: huellaTexto(html), registroId: reg.id || null };
  } finally { host.remove(); }
}

/* Vista previa: lo que ve el PM es el mismo `blob` que luego se adjuntará (Task 7 lee `ultimoInforme`). */
let ultimoInforme = null;     // { blob, base64, nombre, huella, registroId } del último informe visto (el envío valida registroId Y huella)
let urlInforme = null;
function cerrarInforme(){
  const ov = $('#informe-ov'); if (ov) ov.remove();
  if (urlInforme) { URL.revokeObjectURL(urlInforme); urlInforme = null; }
}
function mostrarInforme(res, kind){
  cerrarInforme();
  urlInforme = URL.createObjectURL(res.blob);
  const t = TC.tamanoInforme(res.blob.size);
  const ov = document.createElement('div');
  ov.id = 'informe-ov'; ov.className = 'informe-ov';
  ov.innerHTML = `<div class="informe-dlg" role="dialog" aria-label="Vista previa del informe">
    <h2>${esc(TITULO_INFORME[kind] || TITULO_INFORME.visita)}</h2>
    <p class="mute">${esc(res.nombre)} · ${esc(t.texto)}</p>
    ${t.excede ? `<div class="aviso">El informe pesa ${esc(t.texto)} y supera los ${TC.LIMITE_ENVIO_BYTES / 1048576} MB que admite el envío por correo. Reduce las fotos antes de enviarlo.</div>` : ''}
    <iframe class="informe-vista" title="Informe" src="${esc(urlInforme)}"></iframe>
    <div class="acciones"><a class="btn ghost" target="_blank" rel="noopener" href="${esc(urlInforme)}">Abrir en otra pestaña</a>
      <a class="btn ghost" download="${esc(res.nombre)}" href="${esc(urlInforme)}">Descargar</a>
      <button type="button" class="btn" data-a="cerrarInforme">Cerrar</button></div></div>`;
  document.body.appendChild(ov);
}

async function verInforme(armar, btn){
  const txt = btn.textContent; btn.disabled = true; btn.textContent = 'Generando informe…';
  try {
    const { reg, rutas, archivos } = armar();
    const sobran = TC.cupoFotos(rutas.length, archivos.length).sobran;
    if (sobran) throw new Error(`Máximo ${TC.MAX_FOTOS} fotos por ${reg.kind === 'adherencia' ? 'ensayo' : 'visita'}: quita ${sobran}.`);
    reg.fotos = await fotosComoDataUrl(rutas, archivos);
    ultimoInforme = await generarPdf(reg);
    mostrarInforme(ultimoInforme, reg.kind);
  } catch(e){
    console.error(e); toast('No se pudo generar el informe: ' + (e.message || 'error'));
  } finally { btn.disabled = false; btn.textContent = txt; }
}

/* Cierre con el cliente: quien recibe, y las firmas (cliente y PM) con la ventana de firma compartida. */
const firmaVistaHtml = png => esPngFirma(png) ? `<img class="firma-mini" alt="Firma" src="${esc(png)}">` : '';
async function firmarCierre(b){
