:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:var(--f-ui);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}

.uchip .un{display:grid;line-height:1.15}.uchip .un b{font-size:12.5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.uchip .un small{font-size:10.5px;color:var(--mute)}

@media (max-width:560px){.topin{padding:10px 14px;gap:10px}.txmark{width:44px}.ttl h1{font-size:17px}.uchip{padding:3px;border:0}.uchip .un{display:none}nav{padding:0 14px 10px}}
main{padding:20px;max-width:1100px;margin:0 auto}

h3{margin:20px 0 8px;font-size:15px;font-weight:700}

label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--mute);margin:14px 0 6px}

.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.6;cursor:wait}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;background:var(--card);color:var(--ink)}
.chip input{display:none}
.chip:has(input:checked),.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.checks{display:flex;flex-direction:column;gap:8px;margin-top:4px}

.qr-box .qr-img svg{display:block;width:100%;height:100%}
.qr-box .qr-enlace{font-family:var(--f-mono);font-size:14px;font-weight:700;word-break:break-all;user-select:all;margin:14px 0 4px}

.part-barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}

.informe-dlg{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;overflow:auto}

.chart-box.ancho{grid-column:1/-1}
.tag{display:inline-block;font-family:var(--f-mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--mute);margin-right:8px;vertical-align:2px}
.tag.v{color:var(--brand);background:var(--brand-soft)}

.fotos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

.fotos img{width:100%;height:100%;object-fit:cover;display:block}
.fotos a.sin-foto{display:flex;align-items:center;justify-content:center;padding:4px;text-align:center}
.sin-foto-txt{font-size:11px;line-height:1.15;color:var(--mute)}
details.mas summary{cursor:pointer;color:var(--brand);font-size:13px;font-weight:600;margin-top:8px}
details.mas p{margin:6px 0}
.acc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:0}
.acc small{display:block;color:var(--mute);font-family:var(--f-mono);font-size:11.5px}
.sw{position:relative;width:46px;height:26px;flex:none;margin:0}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}

.gate{max-width:420px;margin:48px auto;padding:24px}
.gate .txmark{width:110px;margin-bottom:18px}
.del{background:transparent;border:0;color:var(--mute);font-size:12px;cursor:pointer;text-decoration:underline;float:right}

// Usuario de la sesión guardada en el equipo (para abrir sin señal cuando supabase no puede renovar el token).
const AUTH_KEY = 'sb-' + new URL(SB_URL).hostname.split('.')[0] + '-auth-token';
function usuarioGuardado(){ try { const s = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); return (s && s.user) || null; } catch (_) { return null; } }
const esperar = ms => new Promise(r => setTimeout(r, ms));
const esRed = e => !!window.TXOfflineCore && TXOfflineCore.clasificarError(e) === 'red';
let soloCopia = false;   // la primera carga va directo a la copia cuando no hay sesión viva por falta de red

async function iniciar(){
  setConexion('Conectando…');
  // Sin señal y con el token vencido, supabase reintenta renovarlo ~30 s: no se espera tanto,
  // se abre con el usuario guardado en el equipo (la fila renueva la sesión al volver la señal).
  const r0 = await Promise.race([sb.auth.getSession().catch(error => ({ data: { session: null }, error })), esperar(5000).then(() => null)]);
  let user = (r0 && r0.data && r0.data.session && r0.data.session.user) || null;
  soloCopia = !user && ((r0 && r0.error && esRed(r0.error)) || navigator.onLine === false);
  if (!user && (!r0 || (r0.error && esRed(r0.error)))) user = usuarioGuardado();
  if (!user) return pantallaLogin();
  const session = { user };
  // La copia local va por usuario: se abre en cuanto se sabe quién es, antes de consultar nada.
  // Los tipos de la fila se registran ANTES de iniciar, porque iniciar envía de inmediato lo que haya en la fila.
  registrarTiposFila();
  try { await TXOffline.iniciar({ app: 'terreno', sb, usuarioId: session.user.id }); }
  catch (e) { console.warn('[Terreno] sin copia local:', e); }
  let acc, prof;
  try {
    const r = await consultarTerreno('terreno.perfil', async () => {
      const [a, pr] = await Promise.all([
        sb.rpc('rt_tengo_acceso'),
        sb.from('profiles').select('nombre,email,rol,activo').eq('id', session.user.id).maybeSingle()
      ]);
      if (a.error) throw a.error;
      if (pr.error) throw pr.error;
      return { acceso: a.data, perfil: pr.data };
    });
    acc = { data: r.datos.acceso }; prof = { data: r.datos.perfil };
    mostrarCopia(r);
  } catch (e) {
    console.warn('[Terreno] no se pudo verificar el acceso:', e);
    if (esRed(e)) {   // sin señal y sin copia: no es falta de acceso, es que aún no se puede abrir
      $('#nav').hidden = true;
      setConexion('');
      $('#app').innerHTML = `<div class="card gate"><h2>Sin conexión</h2>
        <p>Necesitas señal para abrir Registro de Terreno por primera vez en este equipo.</p>
        <div class="acciones"><button class="btn" onclick="location.reload()">Reintentar</button>
        <button class="btn ghost" onclick="cerrarSesion()">Cerrar sesión</button></div></div>`;
      return;
    }
    acc = { error: e }; prof = {};
  }
  const p = prof.data || {};
  me = { id: session.user.id, email: session.user.email,
         nombre: p.nombre || session.user.user_metadata?.nombre || session.user.email.split('@')[0],
         admin: !!(p.activo && p.rol === 'admin') };
  if (acc.error || !acc.data) {
    $('#nav').hidden = true;
    setConexion(esc(me.nombre));
    $('#app').innerHTML = `<div class="card gate"><h2>Sin acceso a Registro de Terreno</h2>
      <p>Tu cuenta (${esc(me.email)}) todavía no tiene acceso a este módulo. Pídele al administrador que te habilite en la pestaña <b>Accesos</b>.</p>
      <div class="acciones">${EN_PORTAL ? '' : '<a class="btn" href="./">Volver al portal</a>'}
      <button class="btn ghost" onclick="cerrarSesion()">Cerrar sesión</button></div></div>`;
    return;
  }
  // 2FA: solo con señal (sin ella, TMfa.gate tampoco podría verificar nada). Si falla por red, no bloquea.
  if (!soloCopia && !(await TMfa.gate(sb, { requireEnrollment: me.admin }))) return;
  $('#nav').hidden = false;
  $('#nav-accesos').hidden = !me.admin;
  $('#btn-salir').hidden = false;
  setConexion(`<a class="uchip" ${EN_PORTAL ? '' : 'href="./" title="Volver al portal"'}><span class="av">${esc(iniciales(me.nombre))}</span><span class="un"><b>${esc(me.nombre)}</b><small>${me.admin ? 'Administrador' : 'Product Manager'}</small></span></a>`);
  render();
  await cargar();
  soloCopia = false;
  consultarTerreno('terreno.catalogo', async () => {
    const { data, error } = await sb.rpc('rt_productos');
    if (error) throw error;
    return data;
  }).then(r => { if (r.datos && r.datos.length) catalogo = r.datos; }).catch(() => {});
}

/* ===================== Sin conexión ===================== */
// Consulta con copia local: sin red conocida (navigator.onLine) va directo a la copia.
// Si no se pudo abrir la copia (TXOffline ausente o sin iniciar), la consulta sigue funcionando con señal.
function consultarTerreno(clave, fn) {
  const traer = () => { if (navigator.onLine === false || soloCopia) throw new TypeError('Failed to fetch'); return fn(); };
  if (!window.TXOffline) return traer().then(datos => ({ datos, desdeCache: false, guardadoEn: null }));
  return TXOffline.consultar(clave, traer).catch(e => {
    if (e && /no está iniciado/i.test(e.message || '')) return traer().then(datos => ({ datos, desdeCache: false, guardadoEn: null }));
    throw e;
  });
}
// Muestra de dónde vienen los datos: solo cuando salen de la copia guardada en este equipo.
function mostrarCopia(r) {
  const el = $('#copia-ind'); if (!el) return;
  const c = !!(r && r.desdeCache);
  el.textContent = c ? (navigator.onLine === false ? 'Sin conexión' : 'Sin respuesta del servidor') + ' · datos del ' + (TC.fechaHoraCL(r.guardadoEn) || 'último guardado') : '';
  el.title = c ? 'Se muestran los datos guardados en este equipo. Se actualizan solos al volver la señal.' : '';
  el.hidden = !c;
}
// Lo que se cargó del servidor (o de la copia), sin la fila de envíos: `registros` es esto más lo pendiente.
let registrosServ = [];
let entsFila = [];
let pintando = 0;
// `registros` = lo del servidor + lo pendiente. Todo código que cambia la lista escribe en `registrosServ` y recompone:
// si escribiera en `registros`, el siguiente repintado (cada pasada de la fila) se lo comería.
function recomponer() { registros = entsFila.length ? TC.aplicarFilaTerreno(registrosServ, entsFila) : registrosServ; }
// Firma de la fila (TC.firmaFila: ids+estado+error) tal como quedó pintada la última vez: una pasada de
// sincronización (cada 60 s, incluso sin pendientes) que no cambia nada de esto no debe repintar nada (I3).
let firmaVista = '';
// `opc.sinRender`: cargar() ya va a hacer su propio render() completo con los datos nuevos del servidor —
// pintarFila() solo necesita refrescar entsFila/registros antes de eso, sin repintar dos veces.
async function pintarFila(opc) {
  const n = ++pintando;
  let ents = [];
  try { ents = window.TXOffline ? await TXOffline.entradas() : []; } catch (_) { ents = []; }
  if (n !== pintando) return;     // llegó un repintado más nuevo: ese es el que cuenta
  entsFila = ents;
  recomponer();
  const firma = TC.firmaFila(ents), cambio = firma !== firmaVista;
  firmaVista = firma;
  if (opc && opc.sinRender) return;
  if (!cambio) return;            // nada pendiente nuevo, resuelto o con otro error: nada que mostrar distinto (I3)
  repintarListaSuave();
}
// A diferencia de render() (pensado para una navegación: cierra la vista previa del informe, pliega los
// <details>, limpia el formulario), esto es para un repintado EN SEGUNDO PLANO (la fila, cada 60 s): solo
// redibuja la lista/el panel, sin llevarse por delante un informe abierto, y reabre los <details> que ya
// estaban desplegados en Registros (I3). Si hay un overlay encima (vista previa, confirmar envío, "Un
// momento…", todos con la clase `informe-ov`) se posterga, en vez de repintar debajo de él.
let repintoProg = null;
const puedeRepintar = () => !document.querySelector('.informe-ov');
function repintarListaSuave() {
  if (vista !== 'panel' && vista !== 'registros') return;
  if (!puedeRepintar()) {
    if (!repintoProg) repintoProg = setTimeout(function rec(){
      repintoProg = null;
      if (puedeRepintar()) repintarListaSuave(); else repintoProg = setTimeout(rec, 2000);
    }, 2000);
    return;
  }
  const app = $('#app');
  if (vista === 'registros') {
    // `data-part` (participantes) o `data-sec` (resultados/detalle): los dos únicos atributos que identifican
    // un <details> de la lista. Se recuerda el par atributo/valor, no una clave armada, para no tener que
    // deshacerla después (los valores son ids: sin ':').
    const abiertas = [...app.querySelectorAll('details[open]')]
      .map(d => (d.dataset.part ? ['part', d.dataset.part] : d.dataset.sec ? ['sec', d.dataset.sec] : null))
      .filter(Boolean);
    app.innerHTML = vistaRegistros();
    abiertas.forEach(([attr, val]) => {
      const d = app.querySelector(`details[data-${attr}="${esc(val)}"]`);
      if (d) { d.open = true; if (attr === 'part') cargarParticipantes(d); }
    });
    cargarFotos();
  } else {
    app.innerHTML = vistaPanel();
    dibujarGraficos();
  }
  aplicarExigeSenal();
}

// Único camino para cerrar sesión: no se sale con registros sin enviar (se perderían).
// Como en el CRM: mientras se está cerrando sesión, el handler de SIGNED_OUT (más abajo) no debe disparar su
// propio location.reload() — competiría con alCerrarSesion() (que todavía no terminó de limpiar la copia local)
// por quién recarga primero (m4).
let saliendo = false;
async function cerrarSesion() {
  let ok = true;
  try { ok = !window.TXOffline || await TXOffline.puedeCerrarSesion(); } catch (_) {}
  if (!ok) {
    let n = 0; try { n = (await TXOffline.entradas()).length; } catch (_) {}
    toast(n ? `Tienes ${n} ${n === 1 ? 'registro' : 'registros'} sin enviar: espera a tener señal` : 'Tienes registros sin enviar: espera a tener señal');
    return;
  }
  saliendo = true;
  const { error } = await sb.auth.signOut();
  if (error) { saliendo = false; toast(window.TXOfflineCore && TXOfflineCore.clasificarError(error) === 'red' ? 'Sin conexión: no se pudo cerrar sesión. Intenta de nuevo con señal.' : 'No se pudo cerrar sesión'); return; }
  try { if (window.TXOffline) await TXOffline.alCerrarSesion(); } catch (_) {}
  location.reload();
}

async function cargar(){
  let r;
  try {
    r = await consultarTerreno('terreno.registros', async () => {
      const { data, error } = await sb.from('registros').select('*, rt_asistencias(count)').order('fecha', { ascending: false }).order('created_at', { ascending: false }).limit(2000);
      if (error) throw error;
      return data;
    });

  mostrarCopia(r);
  registrosServ = r.datos.map(mapRegistro);
  recomponer();
  ultimaCarga = Date.now();
  // Datos nuevos del servidor: siempre se repinta (abajo), así que pintarFila() no debe hacerlo también por su
  // cuenta (antes pintaba dos veces).
  await pintarFila({ sinRender: true });
  if (vista === 'panel' || vista === 'registros') render();
}

// Una foto ya guardada, dentro del formulario: miniatura, pie (solo en el ensayo) y «Quitar».
// La miniatura reusa el marcado de .fotos para que cargarFotos() le resuelva la URL firmada,
// y el data-path de la fila es la única fuente de las rutas que sobreviven.
function filaFotoGuardadaHtml(path, i, pie){
  return `<div class="fotos fg" data-path="${esc(path)}">`
    + `<a target="_blank" rel="noopener" data-path="${esc(path)}"><img alt="Foto ${i + 1} ya guardada"></a>`
    + `<div class="fg-txt">${pie == null ? `<small class="mute">Imagen ${i + 1} (ya guardada)</small>`
      : `<label>Pie de la imagen ${i + 1} (ya guardada)</label><input class="pie-foto" value="${esc(pie)}">`}</div>`
    + '<button type="button" class="btn ghost" data-a="quitarFoto">Quitar</button></div>';
}

// Las fotos guardadas que siguen en el formulario, cada una con su pie, en una sola pasada:
// leer las rutas y los pies por separado permitiría que quedaran desalineados.
const fotosGuardadasConPie = () => [...document.querySelectorAll('#form .fg[data-path]')].map(d => {
  const pie = d.querySelector('.pie-foto');
  return { ruta: d.dataset.path, pie: pie ? pie.value : '' };
});
const fotosGuardadasVivas = () => fotosGuardadasConPie().map(x => x.ruta);
const piesNuevos = () => [...document.querySelectorAll('#pies-nuevas .pie-foto')].map(i => i.value);

// El aviso del cupo se recalcula: tras quitar una foto, N no puede quedar mintiendo.
function renderAvisoCupo(){
  const input = document.querySelector('#form [name="fotos"]'); if (!input) return;
  // Va debajo de las miniaturas ya guardadas, no entre el selector y ellas.
  if (!$('#aviso-cupo')) ($('#fotos-guardadas') || input).insertAdjacentHTML('afterend', '<p class="mute" id="aviso-cupo"></p>');
  const p = $('#aviso-cupo'), n = fotosGuardadasVivas().length;
  p.hidden = !n;
  const tope = TC.topeFotos(input.closest('#form').dataset.kind);
  p.textContent = `Ya tiene ${n} foto(s); las que elijas se agregan (máximo ${tope} en total).`;
}

// Tras quitar: renumera las guardadas, recalcula el aviso y los pies de las nuevas, y
// recupera las que el cupo había dejado fuera (devuelve cuántas volvieron a entrar).
function refrescarFotosGuardadas(){
  document.querySelectorAll('#form .fg').forEach((d, i) => {
    const l = d.querySelector('label'), sm = d.querySelector('small'), img = d.querySelector('img');
    if (l) l.textContent = `Pie de la imagen ${i + 1} (ya guardada)`;
    if (sm) sm.textContent = `Imagen ${i + 1} (ya guardada)`;
    if (img) img.alt = `Foto ${i + 1} ya guardada`;
  });
  renderAvisoCupo();
  const recuperadas = aplicarCupoArchivos(document.querySelector('#form [name="fotos"]'), false);
  renderPiesNuevos();
  return recuperadas;
}

// Deja en el selector tantas de las fotos elegidas como quepan ahora. La lista completa se
// recuerda en archivosElegidos porque el navegador no permite reabrir el selector con lo que
// ya se eligió: si no, quitar una foto guardada obligaría a elegir los archivos otra vez.
// Devuelve cuántas volvieron a entrar, para que quien quitó la foto lo sepa en un solo aviso.
function aplicarCupoArchivos(input, avisar){
  if (!input || !archivosElegidos.length) return 0;
  const kind = input.closest('#form').dataset.kind, tope = TC.topeFotos(kind);
  const { admitidas, sobran } = TC.cupoFotos(fotosGuardadasVivas().length, archivosElegidos.length, tope);
  const antes = input.files.length;
  if (antes === admitidas) return 0;
  const dt = new DataTransfer();
  archivosElegidos.slice(0, admitidas).forEach(x => dt.items.add(x));
  input.files = dt.files;
  if (avisar && sobran) toast(`Máximo ${tope} fotos por ${kind === 'adherencia' ? 'ensayo' : 'visita'}: se tomaron las primeras ${admitidas}.`);
  return Math.max(0, admitidas - antes);
}

const leerPies = () => [...document.querySelectorAll('#form .pie-foto')].map(i => i.value.trim());

// Recalcula lo que depende de la tabla: numeración, MPa calculado, indicadores de apoyo (solo pantalla) y texto base de la conclusión.

  });
  const filas = TC.normalizarFilas(crudas), r = TC.resumenEnsayo(filas);
  $('#ens-apoyo').innerHTML = `<b>Apoyo para redactar la conclusión</b> <span class="mute">solo se ve aquí: no aparece en el informe</span>`

      : `<p>Mínimo <b>${TC.fmtMpa(r.min)}</b> · Máximo <b>${TC.fmtMpa(r.max)}</b> · Promedio <b>${TC.fmtMpa(r.prom)}</b> MPa</p>`
        + (r.bajoUmbral.length ? `<p class="aviso">Bajo 0,20 MPa: N° ${r.bajoUmbral.map(esc).join(', ')}</p>` : '<p class="mute">Ninguna extracción bajo 0,20 MPa.</p>'));
  const c = $('#conclusion');
  if (c && !c.dataset.editada) c.value = TC.conclusionBase(filas);
}

/* ===================== Buscador de clientes (base única Silos / CRM) ===================== */
let sugeridos = [];
const buscarClientes = debounce(async (input) => {
  const box = input.parentElement.querySelector('.sug');
  const q = input.value.trim();
  if (q.length < 2) { box.hidden = true; return; }
  const { data, error } = await sb.rpc('rt_buscar_clientes', { q });
  if (input.value.trim() !== q) return;
  sugeridos = error ? [] : (data || []);
  const exacto = sugeridos.some(c => norm(c.nombre) === norm(q));
  let html = sugeridos.map(c => `<button type="button" class="sug-i" data-id="${esc(c.id)}">
      ${esc(c.nombre)}<small>${[c.rut, c.comuna, c.vendedor && 'Vendedor: ' + c.vendedor].filter(Boolean).map(esc).join(' · ')}</small></button>`).join('');
  if (!exacto) html += `<button type="button" class="sug-i nuevo" data-nuevo="1">+ Crear cliente nuevo: “${esc(q)}”</button>`;
  box.innerHTML = html;
  box.hidden = false;
}, 250);

function infoCliente(){
  const el = $('#cli-info'); if (!el) return;
  $('#cli-extra').hidden = !cliNuevo;
  el.innerHTML = cliSel ? `<div class="cli-ok">✓ Cliente de la base${cliSel.rut ? ' · ' + esc(cliSel.rut) : ''}${cliSel.comuna ? ' · ' + esc(cliSel.comuna) : ''}</div>`
    : cliNuevo ? `<div class="cli-new">Cliente nuevo: se agregará a la base única de clientes al guardar.</div>` : '';
}

async function elegirCliente(id){
  const c = sugeridos.find(x => x.id === id);
  if (!c) return;
  cliSel = c; cliNuevo = false;
  const f = $('#form');
  f.querySelector('[name="cliente"]').value = c.nombre;
  const dir = f.querySelector('[name="direccion"]');
  if (dir && !dir.value && c.direccion) dir.value = c.direccion;
  f.querySelectorAll('.sug').forEach(s => s.hidden = true);
  infoCliente();
  const { data } = await sb.rpc('rt_obras_cliente', { p_cliente: c.id });
  const dl = $('#obras-dl');
  if (dl && data) dl.innerHTML = data.map(o => `<option value="${esc(o.obra)}">${esc(o.lugar || '')}</option>`).join('');
  const ob = f.querySelector('[name="obra"]');
  if (ob && data && data.length) ob.placeholder = `${data.length} obra(s) conocidas: toca para elegir o escribe`;
}

function leerCampos(){
  const d = {};
  document.querySelectorAll('#form [name]').forEach(el => {
    const n = el.name;
    if (el.type === 'checkbox') { d[n] = d[n] || []; if (el.checked) d[n].push(el.value); }
    else if (el.type === 'radio') { if (el.checked) d[n] = el.value; }
    else if (el.type === 'file') d[n] = [...el.files];
    else d[n] = el.value.trim();

}

const esUuid = s => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s);
const colsPart = f => ({ nombre: f.nombre, rut: f.rut, cargo: f.cargo, email: f.email, fono: f.fono, firma: esPngFirma(f.firma) ? f.firma : '' });
const filaDom = id => [...document.querySelectorAll('#partics .part')].find(r => r.dataset.id === id);

// Lleva a rt_asistencias lo que el PM escribió (origen 'manual'). Las filas ya guardadas quedan marcadas como
// 'tabla', así un reintento después de una falla a medias no duplica nada.
async function aplicarPlan(registroId, plan){
  const t = () => sb.from('rt_asistencias');
  // El error con su status HTTP pegado: un 503 es "reintentar luego", no un rechazo.
  const fallo = res => (window.TXOfflineCore ? TXOfflineCore.errorDeRespuesta(res) : res.error);
  const borrar = plan.borrar.filter(esUuid);
  if (borrar.length) {
    const error = fallo(await t().delete().eq('registro_id', registroId).in('id', borrar));
    if (error) throw error;
    borrar.forEach(id => quitados.delete(id));
  }
  if (plan.insertar.length) {
    const nuevas = plan.insertar.map(f => ({ f, id: esUuid(f.id) ? f.id : crypto.randomUUID() }));
    // Un reintento después de una falla a medias: lo que ya quedó guardado no se vuelve a insertar.
    const rEx = await t().select('id').eq('registro_id', registroId).in('id', nuevas.map(n => n.id));
    if (fallo(rEx)) throw fallo(rEx);
    const ya = new Set((rEx.data || []).map(x => x.id));
    const faltan = nuevas.filter(n => !ya.has(n.id));
    if (faltan.length) {
      const error = fallo(await t().insert(faltan.map(({ f, id }) => ({ id, registro_id: registroId, origen: 'manual', ...colsPart(f) }))));
      if (error) throw error;
    }
    nuevas.forEach(({ f, id }) => { const row = filaDom(f.id); if (row) { row.dataset.id = id; row.dataset.origen = 'tabla'; delete row.dataset.sucia; } });
  }
  await Promise.all(plan.actualizar.map(async f => {
    const error = fallo(await t().update(colsPart(f)).eq('id', f.id).eq('registro_id', registroId));
    if (error) throw error;
    const row = filaDom(f.id); if (row) delete row.dataset.sucia;
  }));
}

// Reduce la foto antes de subirla (máx. 1600 px, JPEG)
function comprimir(file){
  return new Promise(res => {
    if (!/^image\//.test(file.type)) return res(file);
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => res(b || file), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

function validarCampos(kind, d, fotosPrevias = 0){
  if (kind === 'adherencia') {
    const falta = TC.validarEnsayo(d, TC.normalizarFilas(leerFilasEnsayo()));
    if (falta) return falta;
    const { sobran } = TC.cupoFotos(fotosPrevias, (d.fotos || []).length, TC.topeFotos('adherencia'));
    return sobran ? `Máximo ${TC.topeFotos('adherencia')} fotos por ensayo: quita ${sobran}` : '';
  }
  if (!d.fecha) return 'Falta la fecha';
  if (!d.cliente) return 'Indica el cliente';
  if (kind === 'visita') {
    if (!d.motivo) return 'Describe el motivo del reclamo';
    const { sobran } = TC.cupoFotos(fotosPrevias, (d.fotos || []).length, TC.topeFotos('visita'));
    return sobran ? `Máximo ${TC.topeFotos('visita')} fotos por visita: quita ${sobran}` : '';
  }
  return d.nombre ? '' : 'Falta el nombre de la actividad';
}

// Campos de la visita que van a `datos` (los usa el guardado y el informe: lo que se ve es lo que se guarda).
const datosVisita = d => ({
  direccion: d.direccion || '', contacto: d.contacto || '', producto: d.producto || '',
  motivo: d.motivo, verificacion: d.verificacion || '', causa: d.causa || '',
  solucion: d.solucion || '', lab: d.lab || 'No'
});

// Refleja en la lista local lo que acaba de quedar en la base, sin volver a pedir todos los registros.
// Si se conoce la versión que dejó el servidor (updatedAt), también se refresca la copia que usa la app sin
// señal (N1, revisión final): sin esto, `anotarEnvio` dejaba el historial de envíos viejo en esa copia aunque
// `registrosServ` ya tuviera el real, y una corrección hecha después sin señal lo pisaba en silencio, sin
// CONFLICTO. Las dos llamadas de `persistir()` (guardarBorrador, siempre con señal) omiten `updatedAt` a
// propósito: ahí la base del formulario se limpia aparte (`baseEditando = null`), así que no corresponde tocar
// la copia con una versión que todavía no se conoce.
function actualizarLocal(id, fila, datos, fotos, updatedAt){
  const i = registrosServ.findIndex(x => x.id === id), previo = registrosServ[i];
  const crudo = { ...fila, id, datos, fotos, autor: previo ? previo.autor : me.id, autor_nombre: previo ? previo.autor_nombre : me.nombre,
    created_at: previo ? previo.creado : new Date().toISOString(), asistencia_abierta: previo ? previo.asistencia_abierta : false,
    updated_at: updatedAt,   // sin versión conocida (null): el manejador pide la del servidor
    rt_asistencias: [{ count: previo ? previo.nAsistencias : 0 }] };
  const nuevo = mapRegistro(crudo);
  registrosServ = i >= 0 ? registrosServ.map((x, k) => k === i ? nuevo : x) : [nuevo, ...registrosServ];
  recomponer();
  if (updatedAt && window.TXOffline) {
    TXOffline.ajustarConsulta('terreno.registros', lista => {
      const l = Array.isArray(lista) ? lista : [], j = l.findIndex(x => x.id === id);
      return j >= 0 ? l.map((x, k) => k === j ? { ...x, ...crudo } : x) : [crudo, ...l];
    }).catch(() => {});
  }
}

// Una acción propia que NO pasa por la fila (chip de estado, abrir/cerrar el QR, anotar un envío) acaba de subir
// `updated_at` en el servidor (todo UPDATE de `registros` pasa por el disparador que lo toca): sin esto, la
// próxima vez que se abra "Editar" sobre este mismo registro viajaría una base vieja y `rt_guardar_registro`
// daría un CONFLICTO falso, acusando a "otra persona" de un cambio que hizo el propio PM (I1). `ts` es la
// versión real que dejó el servidor (hay que leerla: el disparador fija `clock_timestamp()`, no lo que se
// manda en el UPDATE).
// `cambios` (revisión final, N1): los campos que esa misma acción acaba de dejar en el servidor (p. ej.
// `{ estado }` o `{ asistencia_abierta: false }`), para que la copia no quede vieja en EL RESTO de la fila: antes
// fijarVersion solo tocaba `updated_at`, así que si el PM cerraba la app antes de otra recarga y corregía ese
// mismo registro sin señal, la corrección viajaba con la base nueva (sin CONFLICTO) y pisaba en silencio el
// estado o el historial de envío que esa acción en vivo había dejado.
function fijarVersion(id, ts, cambios){
  if (!ts) return;
  const i = registrosServ.findIndex(x => x.id === id);
  if (i >= 0 && (registrosServ[i].updated_at !== ts || cambios)) {
    registrosServ = registrosServ.map((x, k) => k === i ? { ...x, ...cambios, updated_at: ts } : x);
    recomponer();
  }
  if (!window.TXOffline) return;
  TXOffline.ajustarConsulta('terreno.registros', lista => {
    const l = Array.isArray(lista) ? lista : [], j = l.findIndex(x => x.id === id);
    return j >= 0 ? l.map((x, k) => k === j ? { ...x, ...cambios, updated_at: ts } : x) : l;
  }).catch(() => {});
}

/* Tipos de la fila de envíos. Se registran antes de TXOffline.iniciar (que envía de inmediato lo que haya en la fila). */
// El cliente escrito sin señal: el id que devuelve la base queda guardado con la clave de esta entrada, y el registro
// que depende de ella lo lee antes de enviarse.
TIPOS_FILA['terreno.cliente'] = async (d, archivos, meta) => {
  const previos = new Set();   // clientes que ya existían con ese nombre o RUT: la base devuelve el existente en vez de duplicar
  for (const q of [d.nombre, d.rut].filter(x => x && String(x).trim().length >= 2)) {
    try { const r = await sb.rpc('rt_buscar_clientes', { q }); if (!r.error) (r.data || []).forEach(c => previos.add(c.id)); } catch (_) { /* el alta de abajo dirá si es falta de red */ }
  }
  const res = await sb.rpc('rt_crear_cliente', { p_nombre: d.nombre, p_rut: d.rut || '', p_comuna: d.comuna || '', p_direccion: d.direccion || '' });
  const err = TXOfflineCore.errorDeRespuesta(res);
  if (err) throw err;
  await TXOffline.guardarLocal('cliente-de:' + meta.id, res.data);
  if (previos.has(res.data)) toast(`Ese cliente ya estaba: se usó el existente (${d.nombre})`);
  return res.data;
};

// El registro: fotos (409 = ya subida en un intento anterior), alta idempotente o guardado con versión, participantes.
TIPOS_FILA['terreno.registro'] = async (d, archivos, meta) => {
  const C = TXOfflineCore;
  const ok = res => { const e = C.errorDeRespuesta(res); if (e) throw e; return res.data; };
  let clienteId = d.fila.cliente_id || null;
  if (!clienteId && d.clienteNuevo) {
    clienteId = await TXOffline.leerLocal('cliente-de:' + d.clienteNuevo.entradaId);
    if (!clienteId) throw new Error('No quedó el cliente nuevo de este registro: descártalo y créalo de nuevo.');
  }
  for (let i = 0; i < d.nFotosNuevas; i++) {
    const blob = archivos[`${i + 1}.jpg`];
    if (!blob) throw new Error(`Falta la foto ${i + 1} en este teléfono: descarta el registro y créalo de nuevo.`);
    const r = await sb.storage.from(BUCKET).upload(TC.rutaFoto(d.id, i), blob, { contentType: blob.type || 'image/jpeg' });
    const e = C.errorDeRespuesta(r);
    if (e && !C.subidaYaExiste(e)) throw e;
  }
  const f = d.fila;
  const cuerpo = { kind: f.kind, fecha: f.fecha, cliente: f.cliente, cliente_id: clienteId, obra: f.obra || '', estado: f.estado, datos: d.datos, fotos: d.fotosGuardadas };
  const id = d.registroId || d.id;
  // Si una pasada anterior de ESTA MISMA entrada ya guardó el registro con éxito y la red se cortó recién después
  // (antes de aplicar el plan de participantes), 'version-de:<este id>' ya quedó escrita: un reintento no debe
  // volver a mandar rt_guardar_registro/rt_crear_registro con la base de entonces (que el propio envío anterior
  // ya dejó vieja: daría un CONFLICTO contra uno mismo) — salta directo a aplicar el plan con la versión que ya se
  // sabe.
  let ts = await TXOffline.leerLocal('version-de:' + meta.id);
  if (!ts) {
    if (d.registroId) {
      // La base capturada al abrir el formulario queda vieja en cuanto la entrada de la que depende esta (una
      // alta o corrección anterior del MISMO registro, encadenada porque estaba pendiente) se envía con éxito: esa
      // madre deja su versión nueva con la clave 'version-de:<su id>' (más abajo), y acá se prefiere sobre la
      // capturada (TC.baseCorreccion) — EXCEPTO si esta entrada trae una base fresca (`d.baseFresca`, "Ver mi
      // versión" ya la pidió al servidor o a la copia local): esa nunca se reemplaza por la de una madre.
      // `d.madre` (si se guardó al encolar) es la madre REAL de esta corrección aunque `meta.dependeDe` apunte a
      // un cliente nuevo de por medio (cadena madre→cliente→corrección, m1): sin esto la versión de la madre no
      // se encontraba y se usaba la base capturada, ya vieja.
      let base = d.base;
      const madreId = TC.madreParaVersion(d, meta && meta.dependeDe);
      if (madreId) {
        try { base = TC.baseCorreccion(d.base, await TXOffline.leerLocal('version-de:' + madreId), d.baseFresca); } catch (_) {}
      }
      if (!base) {   // sin versión conocida (p. ej. el borrador del QR): se toma la del servidor
        const v = await sb.from('registros').select('updated_at').eq('id', id).maybeSingle();
        const fila = ok(v);
        if (!fila) throw new Error('NO_EXISTE: el registro ya no está');
        base = fila.updated_at;
      }
      const res = await sb.rpc('rt_guardar_registro', { p_id: id, p_base: base, p: cuerpo });
      const err = C.errorDeRespuesta(res);
      if (err && TC.esConflicto(err)) {
        // La respuesta de un envío anterior de ESTA MISMA entrada puede haberse perdido después de aplicarse con
        // éxito en el servidor (la red cayó justo después): el reintento manda la misma base, que el propio envío
        // anterior ya dejó vieja, y el servidor responde CONFLICTO contra uno mismo. Antes de darlo por un rechazo
        // real, se compara lo que el servidor tiene AHORA contra lo que esta entrada estaba por mandar; si es
        // exactamente lo mismo, ya se aplicó: se trata como éxito con el updated_at leído, no "con problema" (I4).
        let fila = null;
        try { fila = ok(await sb.from('registros').select('kind, fecha, cliente, cliente_id, obra, estado, datos, fotos, updated_at').eq('id', id).maybeSingle()); } catch (_) {}
        if (fila && TC.mismoContenido(fila, cuerpo)) ts = fila.updated_at;
        else throw err;
      } else if (err) {
        throw err;
      } else {
        ts = res.data;
      }
    } else {
      ts = ok(await sb.rpc('rt_crear_registro', { p: { id, ...cuerpo, autor_nombre: f.autor_nombre, hecho_en: d.hechoEn } }));
    }
    // Se guarda ANTES de aplicarPlan (no solo al final): si la red se corta en el paso siguiente, el reintento de
    // esta misma entrada no debe repetir el guardado del registro (ver el leerLocal de arriba).
    try { await TXOffline.guardarLocal('version-de:' + meta.id, ts); } catch (_) {}
  }
  // Los participantes DESPUÉS de que el registro quedó guardado (o se sabe que ya se guardó, arriba): si
  // rt_guardar_registro/rt_crear_registro rechaza, rt_asistencias no se toca (la corrección entera queda "con
  // problema", no a medias).
  if (d.plan) await aplicarPlan(id, d.plan);
  reflejarEnvio(id, { ...cuerpo, id }, ts, d);
};

// Lo que ya salió queda en la lista (y en la copia local) con la versión que dio el servidor; si no, al dejar de ser
// pendiente desaparecería de Registros hasta la próxima carga.
function reflejarEnvio(id, cuerpo, ts, d){
  try {
    const previo = registrosServ.find(x => x.id === id);
    const crudo = { ...cuerpo, autor: previo ? previo.autor : d.fila.autor, autor_nombre: previo ? previo.autor_nombre : d.fila.autor_nombre,
      created_at: previo ? previo.creado : d.hechoEn, updated_at: ts, asistencia_abierta: previo ? previo.asistencia_abierta : false,
      rt_asistencias: [{ count: previo ? previo.nAsistencias : 0 }] };
    const nuevo = mapRegistro(crudo);
    registrosServ = previo ? registrosServ.map(x => x.id === id ? nuevo : x) : [nuevo, ...registrosServ];
    recomponer();
    TXOffline.ajustarConsulta('terreno.registros', lista => {
      const l = Array.isArray(lista) ? lista : [], i = l.findIndex(x => x.id === id);
      return i >= 0 ? l.map((x, k) => k === i ? { ...x, ...crudo } : x) : [crudo, ...l];
    }).catch(() => {});
  } catch (e) { console.warn('[Terreno] no se pudo reflejar el envío en la lista:', e); }
}

// Arma el registro (y su cliente nuevo, si lo hay) y lo deja en la fila de envíos del teléfono; el envío real lo hace el
// manejador de 'terreno.registro' (más abajo), ahora o cuando vuelva la señal. Devuelve el id del registro.
// `registroId`: si viene, corrige ese registro; si no, crea uno nuevo. `btn` solo muestra el avance de las fotos.
// `opc.enLinea`: escribe de inmediato en la base (solo el borrador del QR, que necesita existir ya en el servidor).
let ultimoEnvio = { ids: [] };   // entradas que dejó el último persistir (guardar() mira si ya salieron)
async function persistir(kind, d, registroId, btn, opc){
  const enLinea = !!(opc && opc.enLinea);
  const previo = registroId ? registros.find(x => x.id === registroId) : null;
  // Una sola lectura del formulario, ANTES de procesar nada: las fotos que sobreviven con su pie, los
  // pies de las nuevas y la tabla del ensayo. Entre medio hay un await por cada foto que se comprime;
  // leer unas antes y otras después dejaría un pie describiendo la imagen equivocada.
  const guardadas = fotosGuardadasConPie(), piesDeLasNuevas = piesNuevos(), filasEns = kind === 'adherencia' ? leerFilasEnsayo() : null;
  if (registroId && !previo) throw new Error('El registro ya no está disponible. Recarga la página.');
  const id = registroId || crypto.randomUUID();
  // Las fotos nuevas viajan como archivos de la fila, con rutas que salen solo de este id: un reintento sube a la misma
  // ruta (y la base responde "ya existe"). Al corregir se usa un id propio, para no pisar las fotos que ya tenía.
  const idEnvio = registroId ? crypto.randomUUID() : id;
  const nuevas = !enLinea && esInforme(kind) && d.fotos ? d.fotos : [];
  const archivos = {};
  for (let i = 0; i < nuevas.length; i++) {
    if (btn) btn.textContent = `Preparando foto ${i + 1} de ${nuevas.length}…`;
    archivos[`${i + 1}.jpg`] = await comprimir(nuevas[i]);
  }
  const rutas = nuevas.map((_, i) => TC.rutaFoto(idEnvio, i));

  // Lo que queda tras la corrección: las guardadas que sobrevivieron (con su pie) más las nuevas (con el suyo).
  // Una sola regla decide las fotos y sus pies, así que no pueden divergir.
  const fotosDeLaCorreccion = TC.fotosYPies(guardadas, rutas.map((ruta, i) => ({ ruta, pie: piesDeLasNuevas[i] })));
  const fotosLista = esInforme(kind) ? fotosDeLaCorreccion.fotos : (previo ? TC.fotosEditadas(previo.fotos, []) : []);

  const datos = { ...(previo ? previo._datos : {}), observaciones: d.observaciones || '' };   // al corregir se conservan los campos que el formulario no toca
  if (kind === 'visita') {
    Object.assign(datos, datosVisita(d));
    // Los datos del cliente al cierre no son obligatorios: sin nada escrito ni firmado no se guarda `cierre`.
    const cierre = cierreDeCampos(d);
    if (cierre) datos.cierre = cierre; else delete datos.cierre;
  } else if (kind === 'adherencia') {
    Object.assign(datos, TC.datosEnsayo(d, filasEns, fotosDeLaCorreccion.pies));
  } else {
    // Los participantes ya no viajan en datos: viven en rt_asistencias.
    Object.assign(datos, {
      nombre: d.nombre, duracion: d.duracion || '60', relator: d.relator || '',
      cargo: d.cargo || '', temas: d.temas || [],
      tipo_act: kind === 'capacitacion' ? (d.tipo_act || 'Capacitación') : 'Charla técnica'
    });
  }
  // Al reemplazar una entrada con problema ("Ver mi versión"), el plan de participantes es el que esa entrada ya
  // traía (planReemplazado), TAL CUAL: no se recalcula desde el formulario, que para una actividad no muestra la
  // lista real (ver `participantesDisponibles`), y omitirlo perdería sin aviso los cambios que el PM ya había
  // hecho. Fuera de ese caso, sin la lista real (sin señal) tampoco se calcula ni se encola ningún cambio: no hay
  // con qué, y un plan a medias borraría o duplicaría asistentes reales que este formulario nunca mostró.
  const plan = esInforme(kind) ? null
    : reemplazaEntrada ? planReemplazado
    : (participantesDisponibles ? TC.planParticipantes(leerParticipantes(), { quitados: [...quitados], viejo: partsViejo }) : null);
  // Si la lista de un registro viejo pasa a la tabla, datos.participantes se retira; el manejador guarda primero los
  // participantes y recién después el registro, así que nunca se pierde la lista antigua.
  if (plan && plan.migrar) delete datos.participantes;

  let clienteId = cliSel && norm(cliSel.nombre) === norm(d.cliente) ? cliSel.id : null;
  const clienteNuevo = clienteId ? null : { nombre: d.cliente, rut: d.cli_rut || '', comuna: d.cli_comuna || '', direccion: d.direccion || '' };
  const fila = {
    kind, fecha: d.fecha, cliente: d.cliente, cliente_id: clienteId, obra: d.obra || '',
    estado: kind === 'visita' ? (d.estado || 'Abierto') : null
  };
  const ahora = new Date().toISOString();
  const datosFinal = previo && !TC.esBorrador(previo) ? TC.marcarEdicion(datos, me.nombre, ahora) : datos;   // un borrador que aún no se ha cerrado no es una corrección

  if (enLinea) {
    /* Cliente: si no se eligió de la base, se crea (o se reutiliza si ya existe ese RUT/nombre) */
    if (clienteNuevo) {
      const { data, error } = await sb.rpc('rt_crear_cliente', { p_nombre: clienteNuevo.nombre, p_rut: clienteNuevo.rut, p_comuna: clienteNuevo.comuna, p_direccion: clienteNuevo.direccion });
      if (error) throw error;
      clienteId = data; fila.cliente_id = clienteId;
      cliSel = { ...(cliSel || {}), id: clienteId, nombre: d.cliente }; cliNuevo = false; infoCliente();   // ya está en la base
    }
    if (registroId) {
      if (plan) await aplicarPlan(registroId, plan);
      const { data, error } = await sb.from('registros').update({ ...fila, datos: datosFinal, fotos: fotosLista, updated_at: ahora }).eq('id', registroId).select('id, updated_at');
      if (error) throw error;
      if (!data || !data.length) throw new Error('Solo el autor del registro o un administrador puede corregirlo');
      // Se le pasa la versión real que dejó el servidor para que actualizarLocal refresque también la copia que
      // usa la app sin señal (I-1, revisión final de N1): sin esto, un "Generar QR" sobre un registro existente
      // (este mismo camino) dejaba esa copia con el contenido VIEJO, y el `fijarVersion` que viene después (al
      // abrir la asistencia) le ponía encima una versión fresca sin el contenido real: una corrección hecha
      // después sin señal no daría CONFLICTO y pisaría en silencio lo que este guardado acababa de dejar.
      actualizarLocal(id, fila, datosFinal, fotosLista, data[0].updated_at);
      // Este `update` (p. ej. el borrador del QR) acaba de subir `updated_at` en el servidor: la base que el
      // formulario tenía al abrirse (`baseEditando`) quedó vieja. Si no se limpia, la próxima vez que se toque
      // "Guardar cambios" sobre este mismo formulario manda una base vencida y sale CONFLICTO con señal, sin que
      // nadie más haya tocado el registro.
      baseEditando = null;
    } else {
      const { error } = await sb.from('registros').insert({ id, ...fila, datos, fotos: fotosLista, autor: me.id, autor_nombre: me.nombre });
      if (error) throw error;
      // Desde aquí el registro existe: si algo falla después, reintentar corrige este mismo registro en vez de duplicarlo.
      editandoId = id;
      baseEditando = null;   // recién creado: una futura corrección sin base conocida pide la versión del servidor
      actualizarLocal(id, fila, datos, fotosLista);
      if (plan) {
        try { await aplicarPlan(id, plan); }
        catch(e){ throw Object.assign(e, { registroGuardado: true }); }   // el registro ya existe: quien llama debe decirlo
      }
    }
    if (plan && plan.migrar) { partsViejo = false; quitados.clear(); }
    ultimoEnvio = { ids: [] };
    return id;
  }

  // Cada participante nuevo lleva su id desde ahora: un reintento no puede insertarlo dos veces.
  if (plan) plan.insertar = plan.insertar.map(f => ({ ...f, id: esUuid(f.id) ? f.id : crypto.randomUUID() }));
  const ids = [];
  try {
    // El registro que se corrige es, él mismo, una entrada que todavía no llegó al servidor (su alta, u otra
    // corrección, sigue pendiente o con problema): nada de esta corrección puede adelantarse a esa entrada,
    // ni siquiera el cliente nuevo que se encole junto con ella. Cadena en serie: madre -> cliente -> corrección
    // (si hay madre y cliente a la vez), para que un solo `dependeDe` por entrada baste y nadie quede huérfano.
    // Si este formulario viene de "Ver mi versión" (reemplazaEntrada), la entrada vieja se va a descartar más
    // abajo: la madre no puede ser ella misma (quedaría huérfana), así que se hereda lo que ESA tenía.
    const entradasParaReemplazo = reemplazaEntrada ? await TXOffline.entradas() : [];
    const madre = registroId ? TC.dependeDeCorreccion(entradasParaReemplazo, { reemplazaEntrada, filaPrevia: previo ? previo._fila : null }) : null;
    let clienteEntrada = null;
    if (clienteNuevo) { clienteEntrada = await TXOffline.encolar('terreno.cliente', clienteNuevo, { dependeDe: madre }); ids.push(clienteEntrada); }
    const filaEnvio = registroId ? fila : { ...fila, autor: me.id, autor_nombre: me.nombre, creado: ahora, asistencia_abierta: false, nAsistencias: 0 };
    const ent = TC.entradaRegistro({ id: idEnvio, kind, fila: filaEnvio, datos: datosFinal, fotos: nuevas.length, base: registroId ? baseEditando : null,
      baseFresca: !!reemplazaEntrada,   // "Ver mi versión" ya pidió esta base al servidor (o a la copia local): nunca se reemplaza por la de una madre
      registroId, clienteNuevo: clienteNuevo ? { entradaId: clienteEntrada, nombre: clienteNuevo.nombre } : null, hechoEn: ahora });
    ent.datos.fotosGuardadas = fotosLista;   // la lista COMPLETA que tendrá el registro: de aquí sale lo que se pinta mientras está pendiente
    ent.datos.plan = plan;
    // La madre REAL de esta corrección/alta (misma cadena del registro), aunque el `dependeDe` de la fila (abajo)
    // apunte al cliente nuevo de por medio: el manejador la necesita para encontrar 'version-de:<madre>' (m1).
    ent.datos.madre = madre || null;
    ids.push(await TXOffline.encolar(ent.tipo, ent.datos, { archivos, dependeDe: clienteEntrada || madre }));
    // La corrección nueva ya está a salvo en la fila: ahora sí se puede descartar la que reemplaza (nunca antes,
    // porque si algo de arriba falla el PM no debe perder ni la vieja ni lo que acaba de escribir).
    if (reemplazaEntrada) {
      // I-2 (revisión final): un cliente nuevo que se había encolado junto con la entrada que se reemplaza (p.
      // ej. madre→cliente→corrección) queda huérfano si se descarta solo la madre: su propio `dependeDe` apunta
      // a un id que ya no existe y, si ya estaba 'problema', nunca se reprocesa solo (procesarFila solo
      // reintenta 'pendiente'), sin tarjeta ni botones, bloqueando cerrar sesión para siempre.
      // I-2a: solo los clientes que YA están 'problema' (TC.clientesHuerfanos) — uno todavía 'pendiente' puede
      // seguir siendo necesario para otra corrección viva de este mismo registro (una edición normal hecha
      // mientras la tarjeta seguía mostrando esta madre) que no ha fallado y se resuelve sola.
      const huerfanos = TC.clientesHuerfanos(entradasParaReemplazo, reemplazaEntrada);
      for (const h of huerfanos) { try { await TXOffline.descartar(h, { aunPendiente: true }); } catch (_) {} }
      try { await TXOffline.descartar(reemplazaEntrada, { aunPendiente: true }); } catch (_) {}
      reemplazaEntrada = null;
    }
  } catch (e) {
    for (const x of ids) { try { await TXOffline.descartar(x, { aunPendiente: true }); } catch (_) {} }   // no dejar un cliente suelto
    throw e;
  }
  ultimoEnvio = { ids };
  if (plan && plan.migrar) { partsViejo = false; quitados.clear(); }
  await pintarFila();
  return id;
}

// `registroId`: si viene, corrige ese registro (update); si no, crea uno nuevo (insert).
// `enviar`: tras guardar, ofrece enviar la copia al cliente (con confirmación; nada sale sin que el PM la acepte).
async function guardar(kind, btn, registroId, enviar){
  const d = leerCampos();
  if (!esInforme(kind)) kind = d.kind_sel === 'capacitacion' ? 'capacitacion' : 'charla';
  const falta = validarCampos(kind, d, esInforme(kind) && registroId ? fotosGuardadasVivas().length : 0);
  if (falta) return toast(falta);

  btn.disabled = true; const txt = btn.textContent; btn.textContent = 'Guardando…';
  // Subir las fotos toma segundos: mientras tanto, nada que cambie la lista queda al alcance del dedo.
  const bloqueados = [...document.querySelectorAll('#form [data-a="quitarFoto"], #form [name="fotos"], #form [data-a="guardar"], #form [data-a="guardarEnviar"]')];
  bloqueados.forEach(el => { el.disabled = true; });
  const desbloquear = () => bloqueados.forEach(el => { el.disabled = false; });
  let guardadoId = null, enServidor = false;
  try {
    const eraBorrador = TC.esBorrador(registros.find(x => x.id === registroId));
    const id = await persistir(kind, d, registroId, btn);
    if (kind === 'adherencia') recordarFirmante(d);
    // Con señal se intenta el envío ahora y se avisa cómo quedó; sin señal queda en el teléfono. `sincronizar()`
    // procesa TODA la fila pendiente, no solo lo que se acaba de guardar: con señal débil o mucha cola el
    // formulario quedaría bloqueado esperando. Con un tope (como en Entregas y CRM) se sigue sin esperar más: lo
    // escrito ya está a salvo en IndexedDB y la fila sigue en segundo plano (I2).
    const TOPE_SINCRONIZAR_MS = 8000;
    let problemaEnvio = null, vencioEspera = false;
    if (navigator.onLine !== false && window.TXOffline) {
      try { vencioEspera = (await Promise.race([TXOffline.sincronizar().then(() => false), esperar(TOPE_SINCRONIZAR_MS).then(() => true)])); } catch (_) {}
      try { const mias = (await TXOffline.entradas()).filter(e => ultimoEnvio.ids.includes(e.id)); enServidor = !mias.length; problemaEnvio = mias.find(e => e.estado === 'problema') || null; } catch (_) {}
    }
    // Al guardar la actividad el enlace del QR deja de aceptar participantes. Si el cierre falla el registro queda
    // como "en curso" en Registros, con su botón para cerrarlo.
    let aviso = '';
    const reg = registros.find(x => x.id === id);
    if (TC.esBorrador(reg)) {
      // El registro mismo puede ser todavía solo una entrada (sin enviar): cerrar la asistencia en la base
      // ahora mismo no tendría qué actualizar. Nada la cierra sola todavía (ni al sincronizar la corrección,
      // ni en otra parte): posible trabajo futuro sería que el manejador de 'terreno.registro' llamara a
      // rt_asistencia_cerrar tras confirmar el alta de un borrador, pero eso no es de esta tarea.
      if (reg._fila) aviso = ' La asistencia por QR sigue abierta: ciérrala desde Registros cuando el registro se envíe.';
      else {
        const { error } = await sb.rpc('rt_asistencia_cerrar', { p_registro: id });
        if (error) aviso = ' Pero no se pudo cerrar la asistencia por QR: ciérrala desde Registros.';
        else {
          reg.asistencia_abierta = false;
          // rt_asistencia_cerrar subió updated_at en el servidor y cerró la asistencia: refrescar la copia local
          // con las dos cosas, o la próxima vez que se toque "Editar" sobre este registro saldría un CONFLICTO
          // falso (I1), o peor, una corrección sin señal reabriría la asistencia sin querer (N1).
          try { const v = await sb.from('registros').select('updated_at').eq('id', id).maybeSingle(); fijarVersion(id, v.data && v.data.updated_at, { asistencia_abierta: false }); } catch (_) {}
        }
      }
    }
    toast(enServidor ? (registroId && !eraBorrador ? 'Cambios guardados.' : 'Registro guardado.') + aviso
      : problemaEnvio ? ((TC.esConflicto(problemaEnvio.error) || TC.noExiste(problemaEnvio.error))
          ? (TC.esConflicto(problemaEnvio.error) ? TC.MSG_CONFLICTO : problemaEnvio.error) + ' Usa "Ver mi versión" desde Registros.'
          : 'No se pudo enviar: ' + (problemaEnvio.error || 'error') + '. Queda en Registros para reintentar o descartar.')
      : vencioEspera ? 'Guardado en el teléfono: se está enviando.' + aviso
      : 'Guardado en el teléfono: se enviará al volver la señal.' + aviso);
    cliSel = null; cliNuevo = false; editandoId = null; baseEditando = null; reemplazaEntrada = null; participantesDisponibles = true; planReemplazado = null;
    vista = registroId || esInforme(kind) ? 'registros' : 'panel';
    render(); window.scrollTo(0, 0);
    guardadoId = id;
    if (!enviar) cargar();
  } catch(e){
    desbloquear(); btn.disabled = false; btn.textContent = txt;
    if (e && e.registroGuardado) return toast('La actividad quedó guardada, pero no se pudo guardar la lista de participantes: ' + (e.message || e.code || 'error') + '. Toca Guardar otra vez para completarla.');
    toast('No se pudo guardar: ' + (e.code === '42501' ? 'solo el autor del registro o un administrador puede corregirlo' : e.message || e.code || 'error'));
  }
  // El envío va aparte: si falla, el registro YA está guardado y el aviso no debe decir que no se guardó.
  if (guardadoId && enviar && !enServidor) {
    toast(gen(kind).Art + ' quedó guardad' + gen(kind).o + ' en el teléfono. La copia al cliente se envía desde Registros cuando salga el registro.');
  } else if (guardadoId && enviar) {
    try { await cargar(); await enviarRegistro(guardadoId); }
    catch(e){ console.error(e); toast(gen(kind).Art + ' quedó guardad' + gen(kind).o + ', pero el envío falló: ' + (e.message || 'error') + '. Revisa la ficha antes de reintentar.'); }
  }
}

/* ===================== Informe de la visita (PDF) ===================== */
// El logo sale del SVG de la barra superior (vectorial: imprime nítido y no agrega archivos). Dentro de una imagen
// `currentColor` y las variables CSS no se resuelven, así que se fijan los colores.
const logoInforme = () => $('.topbar .txmark svg').outerHTML.replace(/style="[^"]*"/, 'width="92" height="39"').replace(/currentColor/g, '#121212').replace(/var\(--brand\)/g, '#e4032e');

const informeHtml = reg => reg.kind === 'adherencia'
  ? TC.informeAdherenciaHtml(reg, { fotos: reg.fotos, logo: logoInforme() })
  : TC.informeVisitaHtml(reg, { fotos: reg.fotos, logo: logoInforme(), pm: reg.pm });
const TITULO_INFORME = { visita: 'Informe de visita técnica', adherencia: 'Informe de prueba de adherencia' };

const blobADataUrl = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob); });

// Foto ya subida: se lee igual que la ficha (Storage; si ya se archivó en Drive, por la función foto-archivada).
// Ya viene reducida (1600 px, JPEG): se incrusta tal cual.
// El tipo lo decide el contenido, no lo que declare el servidor: un 404 o una página de error de Drive (a veces sin tipo)
// no debe pasar por foto. Si los bytes no son de imagen, la foto se trata como no disponible y se avisa cuál.
async function comoImagen(blob, n){
  const tipo = TC.tipoImagen(new Uint8Array(await blob.slice(0, 12).arrayBuffer()));
  if (!tipo) throw new Error(`La fotografía ${n} no está disponible (el archivo no es una imagen).`);
  return blob.type === tipo ? blob : new Blob([blob], { type: tipo });
}
async function fotoGuardadaDataUrl(path, n){
  const { data } = await sb.storage.from(BUCKET).download(path);
  if (data) return blobADataUrl(await comoImagen(data, n));
  if (window.fotoArchivada) {
    const u = await fotoArchivada(BUCKET, path), res = await fetch(u);
    if (!res.ok) throw new Error(`La fotografía ${n} no está disponible (respuesta ${res.status}).`);
    return blobADataUrl(await comoImagen(await res.blob(), n));
  }
  throw new Error(`La fotografía ${n} no está disponible.`);
}

// Fotos del informe como data URL: las ya guardadas más las recién elegidas (reducidas igual que al subirlas).
// `kind` decide el tope (el ensayo de adherencia admite más que una visita).
async function fotosComoDataUrl(rutas, archivos, kind){
  const guardadas = await Promise.all((rutas || []).map((p, i) => fotoGuardadaDataUrl(p, i + 1)));
  const nuevas = [];
  for (const f of archivos || []) nuevas.push(await blobADataUrl(await comprimir(f)));
  return [...guardadas, ...nuevas].slice(0, TC.topeFotos(kind));
}

// Registro tal como lo consume el informe. `datos` ya incluye `cierre` (quien recibe y las dos firmas).
function regParaInforme(r, fotos){
  return { kind: r.kind, id: r.id, cliente: r.cliente, obra: r.obra, fecha: r.fecha, datos: r._datos || {}, pm: r.autor_nombre || me.nombre, fotos };
}
function regDesdeFormulario(kind = 'visita'){
  const d = leerCampos(), previo = editandoId ? registros.find(x => x.id === editandoId) : null;
  return {
    kind, id: editandoId || null, cliente: d.cliente, obra: d.obra, fecha: d.fecha, pm: previo ? previo.autor_nombre : me.nombre,
    datos: kind === 'adherencia' ? TC.datosEnsayo(d, leerFilasEnsayo(), leerPies()) : { ...datosVisita(d), cierre: cierreDeCampos(d) }
  };
}

// Hash corto del HTML: permite saber si el informe que se vio sigue siendo el de lo que hay ahora en pantalla.
const huellaTexto = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36) + '-' + s.length; };

const MARGEN_PDF = [24, 28, 64, 28];   // pt: arriba, derecha, abajo (aquí va el pie), izquierda
const MARGEN_PDF_ADHERENCIA = [66, 28, 64, 28];   // más arriba: aquí va el encabezado del documento controlado
const margenPdf = reg => reg.kind === 'adherencia' ? MARGEN_PDF_ADHERENCIA : MARGEN_PDF;
const ANCHO_PDF_PX = Math.floor((595.28 - MARGEN_PDF[1] - MARGEN_PDF[3]) * 96 / 72);   // ancho útil de la hoja A4 en px: el informe se maqueta a este ancho

// Encabezado del documento controlado (informe de adherencia), en cada hoja: título, código, creación, versión y "Página X de Y".
function encabezadoDePagina(pdf, i, n){ TC.dibujarEncabezado(pdf, i, n, MARGEN_PDF_ADHERENCIA); }

// Pie institucional en cada hoja y, en la visita, "Página X de Y" (en el informe de adherencia va en el encabezado). html2pdf no los trae.
function pieDePagina(pdf, adherencia){
  const n = pdf.internal.getNumberOfPages(), W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
  for (let i = 1; i <= n; i++) {
    pdf.setPage(i);
    if (adherencia) encabezadoDePagina(pdf, i, n);
    pdf.setDrawColor(200); pdf.setLineWidth(0.5); pdf.line(MARGEN_PDF[3], H - 56, W - MARGEN_PDF[1], H - 56);
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(7.5); pdf.setTextColor(90);
    pdf.text(TC.PIE[0], W / 2, H - 46, { align: 'center' });
    pdf.setFont('helvetica', 'normal');
    TC.PIE.slice(1).forEach((t, k) => pdf.text(t, W / 2, H - 37 + k * 9, { align: 'center' }));
    if (!adherencia) pdf.text(`Página ${i} de ${n}`, W - MARGEN_PDF[1], H - 14, { align: 'right' });
  }
}

// Genera el PDF UNA vez. Quien lo ve y quien lo envía usan este mismo resultado: { blob, base64, nombre, huella, registroId }.
// `registroId` (null si la visita aún no está guardada) dice a qué visita pertenece: el envío debe validar identidad Y huella.
async function generarPdf(reg){
  if (!window.html2pdf){
    try{await loadScript(HTML2PDF_SRC)}catch(e){throw new Error('No se pudo cargar el generador de PDF. Revisa tu conexión.')}
  }
  const html = informeHtml(reg);
  const host = document.createElement('div');
  host.style.cssText = `position:fixed;left:-10000px;top:0;width:${ANCHO_PDF_PX}px;background:#fff`;
  host.innerHTML = html; document.body.appendChild(host);
  try {
    const pdf = await html2pdf().set({
      margin: margenPdf(reg), image: { type: 'jpeg', quality: 0.9 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
      jsPDF: { unit: 'pt', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css'], avoid: ['.inf-bloque', '.inf-fila', '.inf-res'] }
    }).from(host.firstElementChild).toPdf().get('pdf');
    pieDePagina(pdf, reg.kind === 'adherencia');
    const blob = pdf.output('blob');
    const base64 = (await blobADataUrl(blob)).split(',')[1];
    return { blob, base64, nombre: TC.nombreInforme(reg), huella: huellaTexto(html), registroId: reg.id || null };
  } finally { host.remove(); }
}

/* Vista previa: lo que ve el PM es el mismo `blob` que luego se adjuntará (Task 7 lee `ultimoInforme`). */
let ultimoInforme = null;     // { blob, base64, nombre, huella, registroId } del último informe visto (el envío valida registroId Y huella)
let urlInforme = null;
function cerrarInforme(){
  const ov = $('#informe-ov'); if (ov) ov.remove();
  if (urlInforme) { URL.revokeObjectURL(urlInforme); urlInforme = null; }
}
function mostrarInforme(res, kind){
  cerrarInforme();
  urlInforme = URL.createObjectURL(res.blob);
  const t = TC.tamanoInforme(res.blob.size);
  const ov = document.createElement('div');
  ov.id = 'informe-ov'; ov.className = 'informe-ov';
  ov.innerHTML = `<div class="informe-dlg" role="dialog" aria-label="Vista previa del informe">
    <h2>${esc(TITULO_INFORME[kind] || TITULO_INFORME.visita)}</h2>
    <p class="mute">${esc(res.nombre)} · ${esc(t.texto)}</p>
    ${t.excede ? `<div class="aviso">El informe pesa ${esc(t.texto)} y supera los ${TC.LIMITE_ENVIO_BYTES / 1048576} MB que admite el envío por correo. Reduce las fotos antes de enviarlo.</div>` : ''}
    <iframe class="informe-vista" title="Informe" src="${esc(urlInforme)}"></iframe>
    <div class="acciones"><a class="btn ghost" target="_blank" rel="noopener" href="${esc(urlInforme)}">Abrir en otra pestaña</a>
      <a class="btn ghost" download="${esc(res.nombre)}" href="${esc(urlInforme)}">Descargar</a>
      <button type="button" class="btn" data-a="cerrarInforme">Cerrar</button></div></div>`;
  document.body.appendChild(ov);
}

async function verInforme(armar, btn){
  const txt = btn.textContent; btn.disabled = true; btn.textContent = 'Generando informe…';
  try {
    const { reg, rutas, archivos } = armar();
    const tope = TC.topeFotos(reg.kind);
    const sobran = TC.cupoFotos(rutas.length, archivos.length, tope).sobran;
    if (sobran) throw new Error(`Máximo ${tope} fotos por ${reg.kind === 'adherencia' ? 'ensayo' : 'visita'}: quita ${sobran}.`);
    reg.fotos = await fotosComoDataUrl(rutas, archivos, reg.kind);
    ultimoInforme = await generarPdf(reg);
    mostrarInforme(ultimoInforme, reg.kind);
  } catch(e){
    console.error(e); toast(esRed(e) ? 'Necesitas señal para ver el informe (las fotos están en el servidor)' : 'No se pudo generar el informe: ' + (e.message || 'error'));
  } finally {
    btn.textContent = txt;
    if (btn.dataset.a === 'verInformeReg') {
      // "Ver informe" de la lista (uno de los 5 controles de esta tarea, gobernado por exigeSenal): si la red se
      // cayó mientras esta llamada estaba en vuelo, no lo reactiva igual — navigator.onLine (y, si ya corrió,
      // exigeSenal vía el evento 'offline') son la única fuente de verdad sobre si debe quedar habilitado.
      if (navigator.onLine !== false) { btn.disabled = false; btn.title = ''; }
    } else {
      // Vista previa del formulario (data-a="verInforme"): no es uno de los 5 controles de esta tarea y nunca
      // pasa por exigeSenal, así que ningún evento 'online' lo recuperaría después. Se reactiva siempre, igual
      // que antes de esta tarea, para no dejarlo atascado sin título y sin forma de volver a habilitarse.
      btn.disabled = false;
    }
  }
}
