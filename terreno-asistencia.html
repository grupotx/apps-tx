<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de asistencia · Grupo TX</title>
<!-- Página pública (sin sesión): la abre cualquiera que tenga el enlace del QR. El enlace lleva un token, así que no
     se filtra a otros sitios por la cabecera Referer, no se indexa y la página solo puede hablar con Supabase. -->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://xinnonzltoaoptnvkhhy.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="theme-color" content="#0c0d0f">
<script>(function(){function a(){try{var t=localStorage.getItem("tx-theme"),d=document.documentElement;if(t==="dark"||t==="light")d.dataset.theme=t;else delete d.dataset.theme}catch(e){}}a()})();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="terreno-core.js"></script>
<script src="terreno-firma.js"></script>
<style>
:root{--brand:#e4032e;--brand-ink:#fff;--brand-soft:#fde7eb;--bg:#f2f2f0;--card:#ffffff;--sunk:#eaeae7;--ink:#121212;--mute:#5e6066;--line:#dfdfdb;--ok:#18864a;--ok-soft:#ddf2e5;--warn:#b86e00;--warn-soft:#fbeed6;--err:#b3001f;--err-soft:#fde7eb;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--brand:#ff2a4d;--brand-soft:#3a0f18;--bg:#0c0d0f;--card:#15171a;--sunk:#1d2024;--ink:#f1f1f1;--mute:#9a9da4;--line:#2a2d32;--ok:#4fd18a;--ok-soft:#13301f;--warn:#f2b04a;--warn-soft:#352813;--err:#ff7b92;--err-soft:#3a0f18;color-scheme:dark}}
:root[data-theme="dark"]{--brand:#ff2a4d;--brand-soft:#3a0f18;--bg:#0c0d0f;--card:#15171a;--sunk:#1d2024;--ink:#f1f1f1;--mute:#9a9da4;--line:#2a2d32;--ok:#4fd18a;--ok-soft:#13301f;--warn:#f2b04a;--warn-soft:#352813;--err:#ff7b92;--err-soft:#3a0f18;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:var(--f-ui);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button,input{font:inherit;color:inherit}
header{padding:14px 16px 0;max-width:560px;margin:0 auto;display:flex;align-items:baseline;gap:10px}
header b{font-size:20px;font-weight:800;letter-spacing:-.01em}
header b i{font-style:normal;color:var(--brand)}
header small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
main{padding:12px 16px 32px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
h1{margin:2px 0 4px;font-size:22px;line-height:1.2;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
h2{margin:0 0 8px;font-size:20px;font-weight:800}
.eb{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:700}
.mute{color:var(--mute);font-size:14px;margin:4px 0 0;overflow-wrap:anywhere}
label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--mute);margin:16px 0 6px}
label small{text-transform:none;letter-spacing:0;font-weight:500}
input{width:100%;min-height:48px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);color:var(--ink);font-size:16px}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:12px 18px;border-radius:12px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:700;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.grande{width:100%;margin-top:18px;font-size:17px}
.btn[disabled]{opacity:.6;cursor:wait}
.firma-fila{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.firma-vista{height:56px;max-width:180px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
.aviso{border-radius:12px;padding:12px 14px;font-size:15px;margin-top:16px}
.aviso.err{background:var(--err-soft);color:var(--err)}
.aviso.warn{background:var(--warn-soft);color:var(--warn)}
.ok-mark{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:30px;font-weight:800;margin-bottom:10px}
.pie{font-size:12.5px;color:var(--mute);margin:14px 0 0}
.limpiar{display:block;margin:14px auto 0;background:none;border:0;color:var(--mute);font-size:14px;text-decoration:underline;cursor:pointer;padding:8px}
</style>
</head>
<body>
<header><b>Grupo <i>TX</i></b><small>Registro de asistencia</small></header>
<main>
  <section id="p-cargando" class="card" aria-live="polite"><p class="mute" style="margin:0">Cargando la actividad…</p></section>

  <section id="p-mensaje" class="card" hidden aria-live="polite">
    <h2 id="m-titulo"></h2>
    <p class="mute" id="m-texto" style="font-size:16px"></p>
    <button type="button" class="btn ghost" id="m-reintentar" style="margin-top:14px" hidden>Reintentar</button>
  </section>

  <section id="p-actividad" class="card" hidden>
    <p class="eb">Actividad</p>
    <h1 id="a-nombre"></h1>
    <p class="mute" id="a-cliente"></p>
    <p class="mute" id="a-obra"></p>
    <p class="mute" id="a-fecha"></p>
  </section>

  <form id="p-form" class="card" hidden novalidate autocomplete="on">
    <h2>Registra tu asistencia</h2>
    <label for="f-nombre">Nombre completo <small>(obligatorio)</small></label>
    <input id="f-nombre" name="nombre" autocomplete="name" maxlength="120" required aria-required="true">
    <label for="f-rut">RUT <small>(opcional)</small></label>
    <input id="f-rut" name="rut" autocomplete="off" autocapitalize="characters" maxlength="20" placeholder="12.345.678-9">
    <label for="f-cargo">Cargo <small>(opcional)</small></label>
    <input id="f-cargo" name="cargo" autocomplete="organization-title" maxlength="120">
    <label for="f-email">Correo <small>(opcional)</small></label>
    <input id="f-email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" maxlength="120">
    <label for="f-fono">Teléfono <small>(opcional)</small></label>
    <input id="f-fono" name="fono" type="tel" inputmode="tel" autocomplete="tel" maxlength="30">
    <label>Firma <small>(opcional)</small></label>
    <div class="firma-fila">
      <img id="f-firma-vista" class="firma-vista" alt="Tu firma" hidden>
      <button type="button" class="btn ghost" id="f-firmar">Firmar</button>
    </div>
    <div id="f-msg" class="aviso err" role="alert" hidden></div>
    <button type="submit" class="btn grande" id="f-enviar">Enviar mi asistencia</button>
    <button type="button" class="limpiar" id="f-limpiar">Borrar lo escrito</button>
    <p class="pie">Tus datos y tu firma quedan como constancia de tu asistencia a esta actividad de Grupo TX.</p>
  </form>

  <section id="p-gracias" class="card" hidden aria-live="polite">
    <div class="ok-mark" aria-hidden="true">✓</div>
    <h2>¡Gracias!</h2>
    <p class="mute" style="font-size:16px">Tu asistencia quedó registrada.</p>
    <button type="button" class="btn grande" id="g-otro">Ingresar otro participante</button>
  </section>
</main>
<script>
/* ===================== Configuración ===================== */
// Misma URL y clave publicable que la app de Terreno: son públicas por diseño. Esta página solo puede llamar a dos
// funciones de la base (rt_asistencia_info y rt_asistencia_agregar); no lee ninguna tabla. Nunca usa una sesión.
const SB_URL = 'https://xinnonzltoaoptnvkhhy.supabase.co';
const SB_KEY = 'sb_publishable_DoSRSj0wmAR_UIX8tENXXQ_X5BS5a1q';
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
const token = new URLSearchParams(location.search).get('t') || '';
const TIPOS = { charla: 'Charla técnica', capacitacion: 'Capacitación' };
const ESPERA_MS = 20000;   // con mala señal una consulta puede colgarse: se corta y se deja reintentar

const $ = s => document.querySelector(s);
const fechaCL = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? `${m[3]}-${m[2]}-${m[1]}` : ''; };

// Solo una de estas pantallas está visible a la vez. Todo lo que viene de la base se escribe con textContent.
const PANTALLAS = ['p-cargando', 'p-mensaje', 'p-actividad', 'p-form', 'p-gracias'];
function mostrar(...ids){ PANTALLAS.forEach(p => { document.getElementById(p).hidden = !ids.includes(p); }); }
function mensaje(titulo, texto, reintentar){
  $('#m-titulo').textContent = titulo; $('#m-texto').textContent = texto;
  $('#m-reintentar').hidden = !reintentar;
  mostrar('p-mensaje');
}
const cerrado = () => mensaje('Este enlace ya no está activo', TC.mensajeAsistencia({ message: 'enlace no válido' }).texto);

async function llamar(fn, args){
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), ESPERA_MS);
  try { return await sb.rpc(fn, args).abortSignal(ac.signal); }
  catch(e){ return { data: null, error: { message: String((e && e.message) || e) } }; }
  finally { clearTimeout(t); }
}

/* ===================== Actividad ===================== */
async function cargar(){
  if (!TC.tokenValido(token)) return cerrado();   // un enlace mal copiado no merece ni una consulta
  mostrar('p-cargando');
  const { data, error } = await llamar('rt_asistencia_info', { p_token: token });
  if (error) return mensaje('No pudimos cargar la actividad', 'Revisa tu conexión e inténtalo de nuevo.', true);
  if (!data || !data.length) return cerrado();
  const a = data[0];   // solo actividad, cliente, obra y fecha: la base no entrega nada más
  $('#a-nombre').textContent = TIPOS[a.actividad] || a.actividad || 'Actividad';   // el nombre de la actividad; sin nombre, el tipo
  $('#a-cliente').textContent = a.cliente ? 'Cliente: ' + a.cliente : '';
  $('#a-obra').textContent = a.obra ? 'Obra: ' + a.obra : '';
  $('#a-obra').hidden = !a.obra;
  $('#a-fecha').textContent = fechaCL(a.fecha);
  mostrar('p-actividad', 'p-form');
}
$('#m-reintentar').onclick = cargar;

/* ===================== Formulario ===================== */
let firma = '';              // PNG de la firma ('' = sin firma)
let enviando = false;
let intentoIncierto = false; // un envío anterior pudo llegar al servidor aunque no volvió la respuesta

function ponerFirma(png){
  firma = png || '';
  const img = $('#f-firma-vista');
  if (TC.esPngFirma(firma)) { img.src = firma; img.hidden = false; } else { img.removeAttribute('src'); img.hidden = true; }
  $('#f-firmar').textContent = firma ? 'Cambiar firma' : 'Firmar';
}
function avisar(texto){ const m = $('#f-msg'); m.textContent = texto || ''; m.hidden = !texto; }
function limpiar(){
  $('#p-form').reset(); ponerFirma(''); avisar(''); intentoIncierto = false;
}

$('#f-firmar').onclick = async () => {
  const png = await TFirma.abrirFirma({ titulo: 'Tu firma', firma });
  if (png !== null) ponerFirma(png);
};
$('#f-limpiar').onclick = () => { limpiar(); $('#f-nombre').focus(); };
$('#g-otro').onclick = () => { limpiar(); mostrar('p-actividad', 'p-form'); window.scrollTo(0, 0); $('#f-nombre').focus(); };
$('#p-form').addEventListener('input', () => { if (!$('#f-msg').hidden) avisar(''); });

const MOTIVOS = {
  nombre: 'Escribe tu nombre completo.',
  firma: 'La firma es demasiado pesada. Bórrala y vuelve a firmar con un trazo más simple.'
};

$('#p-form').addEventListener('submit', async e => {
  e.preventDefault();
  if (enviando) return;   // un segundo toque no debe mandar otro registro
  const datos = { nombre: $('#f-nombre').value, rut: $('#f-rut').value, cargo: $('#f-cargo').value, email: $('#f-email').value, fono: $('#f-fono').value, firma };
  // enlaceValido es true porque el formulario solo se muestra cuando la base reconoció el enlace.
  const v = TC.validarAsistencia(datos, { enlaceValido: true });
  if (!v.ok) { avisar(MOTIVOS[v.motivo] || 'Revisa los datos.'); (v.motivo === 'nombre' ? $('#f-nombre') : $('#f-firmar')).focus(); return; }
  if (datos.email.trim() && !$('#f-email').checkValidity()) { avisar('El correo no parece válido. Corrígelo o déjalo en blanco.'); $('#f-email').focus(); return; }

  enviando = true; avisar('');
  const b = $('#f-enviar'); b.disabled = true; b.textContent = 'Enviando…';
  const { error } = await llamar('rt_asistencia_agregar', { p_token: token, p_nombre: datos.nombre, p_rut: datos.rut, p_cargo: datos.cargo, p_email: datos.email, p_fono: datos.fono, p_firma: firma });
  enviando = false; b.disabled = false; b.textContent = 'Enviar mi asistencia';

  const m = error ? TC.mensajeAsistencia(error) : null;
  // Si un intento anterior se cortó a medias y ahora la base dice "ya estás registrado", el primero sí llegó.
  const registrado = !error || (m.tipo === 'duplicado' && intentoIncierto);
  if (registrado) { limpiar(); mostrar('p-gracias'); window.scrollTo(0, 0); return; }
  if (m.tipo === 'cerrado') return cerrado();
  if (m.tipo === 'red') intentoIncierto = true;
  avisar(m.texto);
});

cargar();
</script>
</body>
</html>
