<style>
:root{
  --brand:#ff2a4d;--brand-ink:#fff;--brand-soft:#3a0f18;
  --bg:#050505;--card:#0e0f11;--sunk:#17181b;--ink:#f4f4f4;--mute:#a4a7ae;
  --line:rgba(255,255,255,.22);--line-soft:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.55);
  --ok:#4fd18a;--bad:#ff6670;--warn:#f2b04a;--txbg:#2a0d14;
  --b-tx:#ff2a4d;--b-presec:#3987e5;--b-bemezcla:#d95926;--b-weber:#199e70;--b-bekron:#c98500;--b-sika:#d55181;--b-toro:#9085e9;--b-otros:#9aa3b4;
  --f-ui:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark}
:root[data-theme="light"]{
  --brand:#e4032e;--brand-soft:#fde7eb;--bg:#f2f2f0;--card:#ffffff;--sunk:#eaeae7;--ink:#121212;--mute:#5e6066;
  --line:rgba(0,0,0,.18);--line-soft:rgba(0,0,0,.08);--line-strong:rgba(0,0,0,.5);--ok:#18864a;--bad:#c4121f;--warn:#b86e00;--txbg:#fdebee;
  --b-tx:#e4032e;--b-presec:#2a78d6;--b-bemezcla:#eb6834;--b-weber:#1baf7a;--b-bekron:#eda100;--b-sika:#e87ba4;--b-toro:#6250d6;--b-otros:#8b919c;
  color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:var(--f-ui);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
.topin{display:flex;align-items:center;gap:14px;padding:12px max(20px,env(safe-area-inset-left,0px));max-width:1200px;margin:0 auto;flex-wrap:wrap}
.txmark{width:58px;flex:none;color:var(--ink);display:block}
.ttl{display:flex;flex-direction:column;margin-right:auto;min-width:0;line-height:1.15}
.ttl small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:700}
.ttl h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mute);font-size:12px}
.semsel{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute)}
.semsel select{width:auto;padding:7px 10px}
.uchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line-soft);border-radius:99px;padding:4px 12px 4px 4px;color:var(--ink);text-decoration:none;font-size:13px}
.uchip .av{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:11.5px;font-weight:700}
.uchip .un{display:grid;line-height:1.15}.uchip .un b{font-size:12.5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.uchip .un small{font-size:10.5px;color:var(--mute)}
#estado-conexion{font-size:12px;color:var(--mute)}
.vivo{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.vivo i{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block}
.vivo.on i{background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulso 2s infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(79,209,138,.6)}70%{box-shadow:0 0 0 8px rgba(79,209,138,0)}100%{box-shadow:0 0 0 0 rgba(79,209,138,0)}}
.pres{display:inline-flex;margin-left:4px}
.pres span{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:10px;font-weight:700;margin-left:-6px;border:2px solid var(--bg)}
nav.tabs{display:flex;gap:6px;padding:0 max(20px,env(safe-area-inset-left,0px)) 10px;overflow-x:auto;max-width:1200px;margin:0 auto;scrollbar-width:none}
nav.tabs button{flex:none;border:1px solid transparent;background:transparent;color:var(--mute);padding:8px 14px;border-radius:10px;font-weight:600;font-size:13.5px;cursor:pointer}
nav.tabs button:hover{color:var(--ink);background:var(--sunk)}
nav.tabs button.on{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
main{padding:20px max(20px,env(safe-area-inset-left,0px)) 56px;max-width:1200px;margin:0 auto}
@media (max-width:560px){.topin{padding:10px 14px;gap:10px}.txmark{width:44px}.ttl h1{font-size:17px}.uchip{padding:3px}.uchip .un{display:none}nav.tabs{padding:0 14px 10px}main{padding:14px 14px 48px}}
h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:10px;background:var(--sunk);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
input:disabled{opacity:.85;border-color:var(--line)}
input[type=checkbox]{width:auto;accent-color:var(--brand)}
textarea{min-height:200px;font:12px var(--f-mono);resize:vertical}
.btn,button.primary{background:var(--brand);color:var(--brand-ink);border:1px solid var(--brand);border-radius:10px;padding:9px 15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover,button.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.6;cursor:wait}
button.ghost,.btn.ghost,.filtros button:not(.primary):not(.mini){background:var(--card);color:var(--ink);border:1px solid var(--line-strong);border-radius:10px;padding:9px 15px;font-weight:600;cursor:pointer}
.card,.panel{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:16px;margin-bottom:14px}
.panel-h{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.panel-h h2{font-size:16px}
.aviso{color:var(--mute);font-size:12.5px;margin:0 0 12px}
.small{color:var(--mute);font-size:11.5px;white-space:normal}
.sin{color:var(--mute);text-align:center;padding:24px 8px}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:12px;margin-bottom:14px}
.filtros input[type=search]{flex:1 1 180px;width:auto}
.filtros select{flex:0 1 auto;width:auto;max-width:100%}
.filtros label{font-size:12.5px;color:var(--mute);display:flex;gap:6px;align-items:center}
.chips{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:10px;margin-top:2px;border-top:1px dashed var(--line)}
.chip{position:relative;display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;background:transparent;color:var(--mute);user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.chip:has(input:checked){background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.chip:has(input:checked)::before{content:"\2713";margin-right:5px}
.chip:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}
button.mini{padding:4px 10px;font-size:12px;border-radius:999px;background:transparent;color:var(--mute);border:1px solid var(--line);cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line-soft);border-top:3px solid var(--brand);border-radius:14px;padding:14px}
.kpi.w{border-top-color:var(--line)}.kpi.ok{border-top-color:var(--ok)}
.kpi .n{font-weight:800;font-size:28px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.kpi .s{font-size:12px;color:var(--mute);margin-top:2px}
.leyenda{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.marca{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.pos{color:var(--bad);font-weight:700}.neg{color:var(--ok);font-weight:700}
/* gráficos animados */
.prod-c{margin-bottom:16px}.prod-c h3{font-size:13.5px;margin-bottom:8px}
.bar-row,.dv-row{display:grid;grid-template-columns:minmax(120px,260px) 1fr minmax(70px,auto);gap:4px 10px;align-items:center;margin-bottom:6px}
.bar-row .lb{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .lb b{color:var(--ink);font-weight:700}
.bar-row .v,.dv-row .v{font-size:12px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;font-weight:700}
.track,.dv-track,.pt{position:relative;background:var(--sunk);border:1px solid var(--line);min-width:0}
.track{height:14px;border-radius:4px;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.dv-track{height:16px;border-radius:4px}
.dv-track::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.8}
.dv-b{position:absolute;top:0;bottom:0;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.pt-row{display:grid;grid-template-columns:minmax(120px,260px) 1fr;gap:10px;align-items:center;margin-bottom:8px}
.pt{height:30px;border-radius:6px}
.l100{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--brand);z-index:1}
.mk{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--card);z-index:2;outline-offset:3px;transition:left 1.1s cubic-bezier(.2,.8,.2,1)}
.axis{position:relative;height:18px;font-size:11px;color:var(--mute)}
.axis span{position:absolute;top:2px;transform:translateX(-50%);white-space:nowrap}
.axis .axtx{color:var(--brand);font-weight:700}
.tip{position:fixed;z-index:50;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:12px;line-height:1.35;pointer-events:none;max-width:260px}
svg.lin{width:100%;height:auto;display:block}
svg.lin .ejes{stroke:var(--line-strong);fill:none}
svg.lin .cero{stroke:var(--ink);stroke-dasharray:4 4;opacity:.7}
svg.lin .ruta{fill:none;stroke:var(--brand);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
svg.lin .pt2{fill:var(--brand);stroke:var(--card);stroke-width:2;opacity:0;transition:opacity .4s}
svg.lin text{fill:var(--mute);font-size:11px;font-family:var(--f-ui)}
@media (prefers-reduced-motion:reduce){.fill,.dv-b,.mk{transition:none}.vivo.on i{animation:none}}
/* tablas */
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:11px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.08em;background:var(--sunk);border-bottom:1px solid var(--line-strong)}
th.sub2{font-size:10.5px;text-transform:none;letter-spacing:0;font-weight:500;display:block}
tr.tx td{background:var(--txbg)}
tr.tx td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
td input,td select{min-width:84px;padding:6px 8px}
td input[data-f="nota"],td input[data-f="url"]{min-width:200px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.cell-sub{display:block;font-size:11px;font-weight:700;margin-top:1px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,470px),1fr));gap:12px}
.cards .card{margin:0}.cards h3{font-size:14px;margin-bottom:10px}
.acciones{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.estado{color:var(--mute);font-size:12.5px}
.src{color:inherit;text-decoration:underline dotted;text-underline-offset:3px}
.src:hover,a.buscar:hover{color:var(--brand)}
a.buscar{color:var(--mute);font-size:12px;text-decoration:underline dotted;text-underline-offset:3px}
.ok-c a{font-weight:700}
.acc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:0}.acc small{display:block;color:var(--mute);font-family:var(--f-mono);font-size:11.5px}
.acc select{width:auto}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--sunk);border:1px solid var(--line-strong);transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:var(--ink);transition:.2s}
.sw input:checked+span{background:var(--brand);border-color:var(--brand)}
.sw input:checked+span:before{transform:translateX(20px);background:#fff}
.gate{max-width:420px;margin:48px auto;padding:24px}
.gate .txmark{width:110px;margin-bottom:18px}
.gate label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--mute);margin:14px 0 6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;transition:transform .25s,opacity .25s;opacity:0;pointer-events:none;font-size:13.5px;z-index:60}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
@media (max-width:560px){.pt-row{grid-template-columns:1fr}.pt-row.ax>div:first-child{display:none}.kpi .n{font-size:22px}.bar-row,.dv-row{grid-template-columns:1fr auto}.bar-row .track,.dv-row .dv-track{grid-column:1/-1;order:3}}

.uc{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:14px;margin-bottom:12px}
.uc-h{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(170px,1.2fr) minmax(150px,1fr) auto;gap:10px;align-items:end}
.uc-h label{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--mute);margin-bottom:4px}
.uc-h .em{font-family:var(--f-mono);font-size:12.5px;padding:9px 0;word-break:break-all}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.mod{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:6px;background:var(--sunk)}
.mod.on{border-color:var(--ok)}
.mod-t{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:13px}
.mod select{padding:5px 8px;font-size:12.5px}
.pill{font-size:11px;border:1px solid var(--line-strong);border-radius:99px;padding:2px 9px;color:var(--mute)}
.pill.ok{border-color:var(--ok);color:var(--ok)}.pill.off{border-color:var(--bad);color:var(--bad)}
.cnt{font-size:12px;color:var(--mute)}
@media (max-width:760px){.uc-h{grid-template-columns:1fr}}

  $('#app').innerHTML=`<form class="card gate" id="login"><span class="txmark">${$('.topbar .txmark').innerHTML}</span><h2>Ingresar</h2>
  ${msg?`<div class="aviso" style="margin-top:8px">${esc(msg)}</div>`:''}
  <label>Correo</label><input id="lg-email" type="email" autocomplete="username" required>
  <label>Contraseña</label><input id="lg-pass" type="password" autocomplete="current-password" required>
  <div class="acciones"><button class="btn" id="lg-btn" type="submit">Ingresar</button></div></form>`;
  $('#login').onsubmit=async e=>{e.preventDefault();const b=$('#lg-btn');b.disabled=true;b.textContent='Ingresando…';
    const {error}=await sb.auth.signInWithPassword({email:$('#lg-email').value.trim(),password:$('#lg-pass').value});
    if(error)return login(/invalid/i.test(error.message)?'Correo o contraseña incorrectos.':error.message);start()};
}
async function start(){
  const {data:{session}}=await sb.auth.getSession(); if(!session)return login();
  const {data:p}=await sb.from('profiles').select('nombre,email,rol,activo').eq('id',session.user.id).maybeSingle();
  me={id:session.user.id,email:session.user.email,nombre:p?.nombre||session.user.email.split('@')[0],admin:!!(p&&p.activo&&p.rol==='admin')};
  $('#estado-conexion').innerHTML=`<a class="uchip" ${EN_PORTAL?'':'href="./"'}><span class="av">${esc(ini(me.nombre))}</span><span class="un"><b>${esc(me.nombre)}</b><small>${me.admin?'Administrador':'Sin permiso'}</small></span></a>`;
  if(!me.admin){$('#app').innerHTML=`<div class="card gate"><h2>Solo administradores</h2><p>Esta página es para administrar usuarios y accesos. Pídele acceso al administrador del portal.</p><div class="acciones">${EN_PORTAL?'':'<a class="btn" href="./">Volver al portal</a>'}</div></div>`;return}
  // requireEnrollment:false aunque sea admin: esta ES la página donde se activa el 2FA, no tendría
  // sentido bloquear a quien todavía no se ha podido inscribir. Si ya lo tiene activo, sí pide el
  // código de esta sesión (igual que cualquier otra app).
  if(!(await TMfa.gate(sb,{requireEnrollment:false})))return;
  await renderSeguridad();
  await cargar();
}
/* ============ Mi seguridad (2FA) ============ */
// Activación y baja del propio 2FA (TOTP). La verificación al entrar a cada app la hace mfa-gate.js;
// aquí solo se activa o desactiva el factor.
async function renderSeguridad(){
  const {data:lf,error}=await sb.auth.mfa.listFactors();
  if(error){$('#miseguridad').innerHTML=`<div class="card"><h2>Mi seguridad</h2><p class="aviso">No se pudo consultar el estado del 2FA: ${esc(error.message)}</p></div>`;return}
  const verificado=(lf.totp||[]).find(f=>f.status==='verified');
  if(verificado){
    $('#miseguridad').innerHTML=`<div class="card"><h2>Mi seguridad</h2>
      <p class="aviso">Verificación en dos pasos (2FA) <b style="color:var(--ok)">activa</b>.</p>
      <div class="acciones"><button class="btn ghost" id="sg-off">Desactivar 2FA</button></div></div>`;
    $('#sg-off').onclick=async()=>{
      if(!confirm('¿Desactivar la verificación en dos pasos de tu cuenta?'))return;
      const{error}=await sb.auth.mfa.unenroll({factorId:verificado.id});
      if(error){toast(error.message);return}
      toast('2FA desactivado');await renderSeguridad();
    };
    return;
  }
  $('#miseguridad').innerHTML=`<div class="card"><h2>Mi seguridad</h2>
    <p class="aviso">Verificación en dos pasos (2FA): <b style="color:var(--bad)">no activa</b>. Actívala con una app de autenticación (Google Authenticator, Authy, etc.).</p>
    <div class="acciones"><button class="btn" id="sg-on">Activar 2FA</button></div></div>`;
  $('#sg-on').onclick=async()=>{
    const btn=$('#sg-on');btn.disabled=true;btn.textContent='Generando…';
    // Limpia cualquier factor sin verificar de un intento anterior abandonado, para no chocar con él.
    for(const f of (lf.totp||[]).filter(f=>f.status!=='verified'))await sb.auth.mfa.unenroll({factorId:f.id}).catch(()=>{});
    const{data:en,error}=await sb.auth.mfa.enroll({factorType:'totp'});
    if(error){toast(error.message);btn.disabled=false;btn.textContent='Activar 2FA';return}
    $('#miseguridad').innerHTML=`<div class="card"><h2>Activar 2FA</h2>
      <p class="aviso">Escanea este código con tu app de autenticación (Google Authenticator, Authy, etc.) o ingresa la clave manualmente.</p>
      <div style="max-width:220px;margin:0 auto 12px">${en.totp.qr_code}</div>
      <p class="small" style="text-align:center;word-break:break-all">${esc(en.totp.secret)}</p>
      <label>Código de 6 dígitos</label><input id="sg-code" inputmode="numeric" maxlength="6" placeholder="000000">
      <div class="acciones"><button class="btn ghost" id="sg-cancel">Cancelar</button><button class="btn" id="sg-verify">Confirmar</button></div></div>`;
    $('#sg-cancel').onclick=async()=>{await sb.auth.mfa.unenroll({factorId:en.id}).catch(()=>{});await renderSeguridad()};
    $('#sg-verify').onclick=async()=>{
      const code=$('#sg-code').value.trim();
      if(!/^\d{6}$/.test(code)){toast('Ingresa los 6 dígitos.');return}
      const vbtn=$('#sg-verify');vbtn.disabled=true;vbtn.textContent='Verificando…';
      const{data:ch,error:chErr}=await sb.auth.mfa.challenge({factorId:en.id});
      if(chErr){toast(chErr.message);vbtn.disabled=false;vbtn.textContent='Confirmar';return}
      const{error:vErr}=await sb.auth.mfa.verify({factorId:en.id,challengeId:ch.id,code});
      if(vErr){toast('Código incorrecto o vencido.');vbtn.disabled=false;vbtn.textContent='Confirmar';return}
      toast('2FA activado');await renderSeguridad();
    };
  };
}
async function cargar(){
  const {data,error}=await sb.rpc('admin_usuarios');
  if(error){$('#app').innerHTML=`<div class="card gate"><h2>No se pudo cargar</h2><p class="small">${esc(error.message)}</p></div>`;return}
  USERS=data; pintar();
}
const nAcc=u=>MODS.filter(m=>u.modulos[m.k]?.activo).length;
function pintar(){
  const ql=q.toLowerCase();
  const L=USERS.filter(u=>(!ql||(u.nombre+' '+u.email+' '+(u.cargo||'')).toLowerCase().includes(ql))&&(solo!=='sin'||nAcc(u)===0)&&(solo!=='inact'||!u.cuenta_activa));
  const root=$('#app');
  const keep=document.activeElement&&document.activeElement.id==='uq';
  root.innerHTML=`<div class="filtros"><input type="search" id="uq" placeholder="Buscar por nombre, correo o cargo…" value="${esc(q)}">
    <select id="usolo"><option value="">Todos</option><option value="sin" ${solo==='sin'?'selected':''}>Sin acceso a ningún módulo</option><option value="inact" ${solo==='inact'?'selected':''}>Cuentas desactivadas</option></select>
    <span class="cnt">${L.length} de ${USERS.length} usuarios</span></div>
    <p class="aviso">Cada persona crea su cuenta en el portal; aquí le asignas nombre, cargo y qué módulos puede usar y con qué rol. Los cambios se aplican al instante.</p>`+
  L.map(u=>`<section class="uc" data-id="${u.id}">
    <div class="uc-h">
      <div><label>Nombre</label><input data-f="nombre" value="${esc(u.nombre||'')}" placeholder="Nombre y apellido"></div>
      <div><label>Correo</label><div class="em">${esc(u.email)}</div></div>
      <div><label>Cargo</label><input data-f="cargo" value="${esc(u.cargo||'')}" placeholder="Ej. Jefe de ventas"></div>
      <div style="display:flex;gap:8px;align-items:center"><span class="pill ${u.cuenta_activa?'ok':'off'}">${u.cuenta_activa?'Cuenta activa':'Desactivada'}</span>
        <label class="sw" title="Activar o desactivar la cuenta"><input type="checkbox" data-cuenta ${u.cuenta_activa?'checked':''} ${u.id===me.id?'disabled':''}><span></span></label>
        ${u.id===me.id?'':`<button type="button" class="mini" data-reset-mfa title="Si perdió el celular con su app de autenticación: borra su 2FA actual, para que pueda activarlo de nuevo desde cero">Resetear 2FA</button>`}</div>
    </div>
    <div class="mods">${MODS.map(m=>{const s=u.modulos[m.k]||{};const on=!!s.activo;
      return `<div class="mod ${on?'on':''}"><div class="mod-t"><span>${esc(m.n)}</span><label class="sw"><input type="checkbox" data-mod="${m.k}" ${on?'checked':''}><span></span></label></div>
      ${m.roles?`<select data-rol="${m.k}" ${on?'':'disabled'} aria-label="Rol en ${esc(m.n)}">${m.roles.map(r=>`<option value="${r}" ${(s.rol||m.roles[0])===r?'selected':''}>${ROL_LBL[r]}</option>`).join('')}</select>`:`<span class="small">${on?'Con acceso':'Sin acceso'}</span>`}</div>`}).join('')}</div></section>`).join('')||'<p class="sin">Ningún usuario coincide.</p>';
  if(keep){const i=$('#uq');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
}
async function rpc(fn,args,ok){const {error}=await sb.rpc(fn,args);if(error){toast(error.message);await cargar();return false}toast(ok||'Guardado');return true}
document.addEventListener('input',e=>{if(e.target.id==='uq'){q=e.target.value;pintar()}});
document.addEventListener('change',async e=>{
  const t=e.target; if(t.id==='usolo'){solo=t.value;return pintar()}
  const sec=t.closest('.uc'); if(!sec)return; const id=sec.dataset.id; const u=USERS.find(x=>x.id===id);
  if(t.dataset.f){u[t.dataset.f]=t.value.trim();await rpc('admin_set_perfil',{p_id:id,p_nombre:u.nombre||null,p_cargo:u.cargo||null},'Perfil guardado')}
  else if(t.dataset.cuenta!==undefined){if(await rpc('admin_set_cuenta',{p_id:id,p_activo:t.checked},t.checked?'Cuenta activada':'Cuenta desactivada'))await cargar()}
  else if(t.dataset.mod){const m=MODS.find(x=>x.k===t.dataset.mod);const rol=m.roles?(sec.querySelector(`[data-rol="${m.k}"]`).value):null;
    if(await rpc('admin_set_modulo',{p_id:id,p_modulo:m.k,p_activo:t.checked,p_rol:t.checked?rol:null},t.checked?'Acceso otorgado':'Acceso quitado'))await cargar()}
  else if(t.dataset.rol){if(await rpc('admin_set_modulo',{p_id:id,p_modulo:t.dataset.rol,p_activo:true,p_rol:t.value},'Rol actualizado'))await cargar()}
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-reset-mfa]'); if(!b)return;
  const sec=b.closest('.uc'); const id=sec.dataset.id; const u=USERS.find(x=>x.id===id);
  if(!confirm(`¿Resetear el 2FA de ${u.nombre||u.email}? Tendrá que activarlo de nuevo desde cero.`))return;
  b.disabled=true;b.textContent='Reseteando…';
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session){toast('Tu sesión venció: recarga la página e intenta de nuevo.');return}
    const r=await fetch(SB_URL+'/functions/v1/admin-mfa',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({action:'reset_mfa',user_id:id})});
    const j=await r.json().catch(()=>({error:'Respuesta inválida'}));
    if(!r.ok||j.error){toast(j.error||'No se pudo resetear el 2FA');return}
    toast(j.removed?'2FA reseteado':'Esa cuenta no tenía 2FA activo');
  }catch(e){toast('No se pudo resetear el 2FA: revisa tu conexión.')}
  finally{b.disabled=false;b.textContent='Resetear 2FA'}
});
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.reload()});
start();
</script></body></html>
