<style>

*{box-sizing:border-box}

.tabs::-webkit-scrollbar{display:none}
.tabs button{display:flex;align-items:center;gap:7px;white-space:nowrap;border:0;background:none;color:rgba(243,243,241,.7);padding:7px 11px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer}
.tabs button:hover{background:rgba(255,255,255,.08);color:#fff}
.tabs button.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 -2px 0 var(--c)}
.tabs button svg{width:16px;height:16px;flex:0 0 auto}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.tools .gh{background:transparent;color:#f3f3f1;border:1px solid rgba(255,255,255,.2)}
.uchip{font-size:12.5px;font-weight:600;color:var(--ink);background:var(--sunk);border-radius:99px;padding:6px 12px;white-space:nowrap}

.ro [data-act="usuarios"],.ro [data-act="importar"]{display:none}
.sync{font-size:11px;color:rgba(243,243,241,.6)}
main{padding:20px;max-width:1120px;margin:0 auto}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:4px 0 14px}
h2{font-size:17px;font-weight:800;letter-spacing:-.01em;margin:0 0 10px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.kpi b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em}
.kpi span{color:var(--muted);font-size:12.5px;font-weight:600}
.kpi{border-top:4px solid var(--c,var(--brand))}
.hello{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hello p{margin:4px 0 0;color:var(--muted)}
.logo-card{display:flex;align-items:center;gap:14px;background:#111214;color:#fff;border-radius:18px;padding:16px 20px}
.logo-card svg{width:150px;height:auto;color:#fff;display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}
.grow{flex:1 1 220px !important}
input,select,textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:60px}
label{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:5px}
button.btn{font-weight:700;border:1px solid var(--brand);border-radius:10px;padding:10px 16px;background:var(--brand);color:var(--brand-ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.btn:hover{filter:brightness(.95)}
button.btn.gh{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
button.btn.ink{background:#111214;border-color:#111214;color:#fff}
button.btn.ok{background:var(--ok);border-color:var(--ok)}
button.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.12em;background:#fafaf8;position:sticky;top:0}
.tbl{overflow:auto;max-height:580px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--sunk);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:#e7edf9;color:var(--c-crm)}
.p-mut{background:var(--sunk);color:var(--muted)}
.alert{border-left:4px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:12px;margin-bottom:8px}
.alert.alta{border-color:var(--bad);background:var(--bad-soft)}
.alert small{color:var(--muted)}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg label{flex-direction:row;align-items:center;gap:4px;padding:6px 10px;margin:0;cursor:pointer;color:var(--muted);font-size:12.5px;border-radius:9px}
.seg input{display:none}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg label.f:has(input:checked){background:var(--bad);color:#fff}
.seg label.o:has(input:checked){background:var(--ok);color:#fff}
.muted{color:var(--muted)}
.eq-code{font-family:var(--f-mono);font-size:12px;color:var(--c-crm);font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;background:var(--surface)}
.sep{height:1px;background:var(--line);margin:16px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111214;color:#fff;padding:11px 18px;border-radius:10px;display:none;max-width:calc(100% - 32px);z-index:9;font-weight:600;font-size:13.5px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:18px}
@media(max-width:700px){.tabs button span{display:none}.tabs button{padding:8px 10px}.logo-card svg{width:120px}.kpi b{font-size:24px}main{padding:14px}}
.sheet-bg{position:fixed;inset:0;background:rgba(5,6,8,.5);display:grid;place-items:center;z-index:20;padding:16px}
.sheet{background:#fff;border-radius:18px;padding:20px;display:grid;gap:10px;width:min(560px,100%)}

.seg label.f:has(input:checked){background:var(--warn);color:#fff}
.foto{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:6px 9px;cursor:pointer;white-space:nowrap}
.foto:hover{border-color:var(--ink);color:var(--ink)}
.rep-dark{background:#0b0c0f;color:#f3f3f1;border-radius:22px;padding:18px;--surface:#14161b;--sunk:#1d2026;--ink:#f3f3f1;--muted:#9ea3ad;--line:#2a2e36;--bg:#0b0c0f}
.rep-dark h1,.rep-dark h2{color:#f3f3f1}
.rep-dark .card{background:linear-gradient(180deg,#171a20,#12141a);border-color:#2a2e36}
.rep-dark input,.rep-dark select,.rep-dark textarea{background:#1d2026;color:#f3f3f1;border:1px solid #2a2e36;border-radius:10px;padding:8px 10px;width:100%;box-sizing:border-box}
.rep-dark .row select{width:auto}
.rep-dark .seg label{color:#9ea3ad}
.rep-dark .seg label:has(input:checked){background:#2a2e36;color:#fff}
.rep-dark .tbl{background:#14161b;border-color:#2a2e36}
.rep-dark .tbl th{background:#101217;color:#9ea3ad}
.rep-dark .tbl td{border-color:#22262e}
.rep-dark .kpi b{color:#fff}
.rep-dark .step{display:flex;gap:6px;background:#1d2026;border:1px solid #2a2e36;border-radius:14px;padding:5px;margin-bottom:14px;flex-wrap:wrap}
.rep-dark .step button{flex:1;min-width:160px;border:0;background:transparent;color:#9ea3ad;padding:11px 12px;border-radius:10px;font-weight:700;cursor:pointer;font-size:13.5px}
.rep-dark .step button:hover{color:#fff}
.rep-dark .step button.on{background:#f3f3f1;color:#0b0c0f}

body{background:radial-gradient(1100px 480px at 15% -12%,rgba(228,3,46,.13),transparent 60%),radial-gradient(800px 400px at 100% 0%,rgba(110,168,255,.06),transparent 60%),var(--bg);min-height:100vh;color:var(--ink)}
header.bar{background:rgba(7,8,11,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 18px;gap:14px}

.brand b{letter-spacing:.02em}

.tools select{background:#14171d;border-color:var(--line)}

main{padding:24px 22px 40px}

.logo-card svg{width:88px;height:auto}
input,select,textarea{background:#0e1015;border:1px solid var(--line);color:var(--ink);border-radius:10px}
input::placeholder,textarea::placeholder{color:#5b616c}

.tbl{background:#0f1116;border:1px solid var(--line);border-radius:14px}
th{background:#14171e;color:#7c8390}
td{color:#dcdcd8}
tr:hover td{background:rgba(255,255,255,.015)}

        var b2 = read();

      var bytes = [];

        if (c < 128) {
          bytes.push(c);

function tipoDe(nombre){
  const n = (nombre||'').toUpperCase();
  if (/MEZCL|AGIT/.test(n)) return 'mezclador';
  if (/CRIBA|ZARANDA|HARNERO/.test(n)) return 'criba';
  if (/ELEVADOR/.test(n)) return 'elevador';
  if (/CINTA|TRANSPORTE/.test(n)) return 'cinta';
  if (/SILO|TOLVA/.test(n)) return 'silo';
  if (/ENSACAD/.test(n)) return 'ensacadora';
  if (/TORNILLO|SINFIN|SIN FIN/.test(n)) return 'sinfin';
  if (/CHANCAD|MOLIENDA|VSI|CONO/.test(n)) return 'chancador';
  return 'general';
}

  if(!db.tpls) db.tpls = {};
  if(!db.mm) db.mm = {};
  ARR.forEach(c => { if(!Array.isArray(db[c])) db[c] = []; });
}
function docsDeDb(){
  asegurar();
  const m = new Map();
  ARR.forEach(c => db[c].forEach(x => m.set(c+SEP+x.id, x)));
  Object.entries(db.tpls).forEach(([k,v]) => m.set('tpls'+SEP+k, v));
  Object.entries(db.mm).forEach(([k,v]) => m.set('mm'+SEP+k, v));
  m.set('cfg'+SEP+'usuarios', {v: db.usuarios});
  if(db.baseUrl) m.set('cfg'+SEP+'baseUrl', {v: db.baseUrl});
  return m;
}
function aplicarDoc(col, id, data){
  const k = col+SEP+id;
  if(ARR.includes(col)){
    if(!Array.isArray(db[col])) db[col] = [];
    const i = db[col].findIndex(x => x.id === id);
    if(data == null){ if(i >= 0) db[col].splice(i,1); }
    else if(i >= 0) db[col][i] = data; else db[col].push(data);
  } else if(col === 'tpls' || col === 'mm'){
    if(data == null) delete db[col][id]; else db[col][id] = data;
  } else if(col === 'cfg'){
    if(id === 'usuarios' && data) db.usuarios = data.v;
    if(id === 'baseUrl') { if(data) db.baseUrl = data.v; else delete db.baseUrl; }
  }
  if(data == null) snap.delete(k); else snap.set(k, JSON.stringify(data));
}
function estadoSync(t){ const e = document.getElementById('sync'); if(e) e.textContent = t; }

// Tarea 5, Step 2: ya no arma lotes para `sb.from('mtto_docs').upsert(...)` directo. Cada documento
// que cambió (MC.docsCambiados, equivalente puro del diff viejo contra `snap`) se encola como su
// propia entrada de la fila (TXOffline.encolar) y la envía el manejador único 'mantencion.doc' (ver
// TIPOS_FILA más abajo), ahora o cuando vuelva la señal. `snap` se actualiza recién DENTRO del
// manejador, cuando la entrada se confirma enviada — nunca aquí al encolar — para que un reenvío de
// la misma entrada siga comparando contra lo último realmente confirmado, no contra algo que solo se
// alcanzó a poner en la fila (si se actualizara acá, un documento que queda "con problema" se vería
// erróneamente como ya sincronizado para la siguiente pasada de subirCambios).
async function subirCambios(){
  if(!ME) return;
  if(!ME.editor){ toast('Tu acceso es de solo lectura: el cambio no se guardó.'); await cargarTodo(); render(); return; }
  const { cambiados, borrados } = MC.docsCambiados(docsDeDb(), snap);
  if(!cambiados.length && !borrados.length) return;
  estadoSync('Guardando…');
  // Los checklists se encolan PRIMERO: si alguno creó una OT correctiva en el mismo guardado
  // (mismo chkId), la OT se encola DESPUÉS con dependeDe hacia la entrada que se acaba de encolar
  // para ese checklist (Tarea 5, Step 3 — mismo patrón que Terreno con el cliente nuevo de un
  // registro: el id de la entrada ya encolada se pasa como dependeDe de la siguiente, nunca al
  // revés). Si el checklist no viene en este mismo lote (ya se había encolado o sincronizado antes),
  // la OT no depende de nada nuevo.
  const chks = [], otros = [];
  cambiados.forEach(par => (par[0].startsWith('chk'+SEP) ? chks : otros).push(par));
  // `base` sale de `baseConocida` (fix del hallazgo Critical de la revisión: antes siempre viajaba
  // null, y mtto_guardar_doc trata un `p_base` null sobre un documento YA EXISTENTE como "compara
  // contenido" -> CONFLICTO en cuanto el contenido cambia, es decir, SIEMPRE que de verdad se corrige
  // algo). Sin entrada en `baseConocida` (documento recién creado en este mismo lote, o uno que de
  // verdad nunca se cargó antes) queda null a propósito: es la primera alta, mtto_guardar_doc no
  // compara nada.
  // Fix del hallazgo Important de la revisión: si ya hay una entrada pendiente/con problema para
  // ESTE MISMO documento (dos correcciones sucesivas — p. ej. marcar dos pasos de la misma OT — antes
  // de que la primera confirme: exactamente lo que puede pasar con señal pobre/lenta, que es la razón
  // de ser de esta tarea), `baseConocida` leída AHORA puede quedar vieja antes de que esa entrada
  // anterior siquiera se intente enviar. La nueva se encadena a esa entrada anterior con `dependeDe`
  // (vía `madre`, un campo propio en `datos` — no tocar `mantencion-core.js` — paralelo al
  // `dependeDe` que ya usan los pares checklist→OT) y el manejador, al enviarla, usa la versión que
  // esa entrada madre deja al confirmarse, no una base leída de antemano — mismo patrón que
  // terreno-core.js (dependeDeCorreccion/filaPrevia + baseCorreccion/madreParaVersion).
  const entradasFila = window.TXOffline ? await TXOffline.entradas() : [];
  // `TXOffline.entradas()` ya viene ordenada ASCENDENTE por `creada` (offline.js): con 3+
  // correcciones sin confirmar del MISMO documento (técnico sin señal que marca varios pasos
  // seguidos — uso normal, no caso extremo), hay que encadenar con la MÁS RECIENTE, no con la
  // primera que aparece en el arreglo — `.find()` a secas daría la más vieja y dejaría la 2ª y la 3ª
  // colgando de la 1ª en vez de 1←2←3 (fix de la segunda ronda de revisión de este hallazgo).
  // `reduce` se queda con la última coincidencia recorriendo una sola vez, sin mutar el arreglo
  // (ordenado) con reverse().
  const entradaPreviaDe = (clave) => entradasFila.reduce((ultima, e) => (e && e.tipo === 'mantencion.doc' && e.datos && MC.claveDoc(e.datos.coleccion, e.datos.docId || e.datos.id) === clave) ? e : ultima, null);
  const entradaDeChk = new Map();
  for (const [clave, doc] of chks){
    const [, id] = clave.split(SEP);
    const archivos = fotosPendientes(id);
    const base = baseConocida.get(clave) || null;
    const madre = entradaPreviaDe(clave);
    const ent = MC.entradaDoc({ id, coleccion:'chk', data:doc, base, hechoEn:new Date().toISOString(), dependeDe: madre ? madre.id : null });
    if (madre) ent.datos.madre = madre.id;
    const entradaId = await TXOffline.encolar(ent.tipo, ent.datos, { archivos, dependeDe: ent.dependeDe });
    entradaDeChk.set(id, entradaId);
  }
  for (const [clave, doc] of otros){
    const [coleccion, id] = clave.split(SEP);
    const base = baseConocida.get(clave) || null;
    const madre = entradaPreviaDe(clave);
    const dependeDe = madre ? madre.id : ((coleccion==='ots' && doc.chkId) ? (entradaDeChk.get(doc.chkId) || null) : null);
    const ent = MC.entradaDoc({ id, coleccion, data:doc, base, hechoEn:new Date().toISOString(), dependeDe });
    if (madre) ent.datos.madre = madre.id;
    await TXOffline.encolar(ent.tipo, ent.datos, { dependeDe: ent.dependeDe });
  }
  // Los borrados (hoy solo `orgdel`, y ese ya exige señal — Tarea 7) no pasan por la fila: el
  // manejador único/`mtto_guardar_doc` no tienen forma de borrar, y este camino solo se alcanza
  // cuando SÍ hay señal (el botón está deshabilitado si no la hay), así que seguir llamando a
  // Supabase directo acá es seguro y no necesita reintentos sin conexión.
  if (borrados.length){
    const porColeccion = {};
    borrados.forEach(k => { const [c,bid] = k.split(SEP); (porColeccion[c] = porColeccion[c] || []).push(bid); });
    for (const [c,ids] of Object.entries(porColeccion)){
      const { error } = await sb.from('mtto_docs').delete().eq('coleccion',c).in('id',ids);
      if(error) throw error;
      ids.forEach(bid => { snap.delete(c+SEP+bid); baseConocida.delete(c+SEP+bid); });
    }
  }
  estadoSync('Guardado · se envía solo');
}
// Consulta con copia local: sin red conocida (navigator.onLine) va directo a la copia. Si no se pudo
// abrir la copia (TXOffline ausente o sin iniciar), la consulta sigue funcionando con señal — mismo
// contrato que consultarTerreno/consultarSilos (registro-terreno.html / silos-tx/index.html).
// `cargarTodo()` trae TODO mtto_docs de una vez (paginado de 200 en 200): puede tardar más que el tope
// por defecto de TXOffline.consultar (8 s) en una red lenta, así que usa el mismo tope largo que
// Silos (consultarSilosLarga) para que la copia llegue a crearse completa, no a medio camino.
const TOPE_LARGO_MS = 120000;
// Acota una página cualquiera a `ms`: mismo mecanismo que silos-tx/index.html (conTope/PAGINA_TOPE_MS).
// El tope largo de arriba cubre TODA la operación paginada, pero una conexión REALMENTE colgada (acepta
// la conexión y nunca responde — distinto de un fetch que falla rápido) dejaría al técnico esperando
// hasta 2 minutos en "Conectando…" sin ningún indicio de que algo anda mal, antes de caer a la copia.
// Con esto, cada página por sí sola falla a los 8 s (clasificado 'red' por el AbortError) y el resto de
// la operación sigue su curso normal (el tope largo, o la copia si ya se agotó también ese).
const PAGINA_TOPE_MS = 8000;
function conTope(promesa, ms){
  return new Promise((ok, mal) => {
    const t = setTimeout(() => { const e = new Error('Tiempo de espera agotado'); e.name = 'AbortError'; mal(e); }, ms);
    promesa.then(v => { clearTimeout(t); ok(v); }, e => { clearTimeout(t); mal(e); });
  });
}
function consultarMantencion(clave, fn){
  const traer = () => { if(navigator.onLine === false) throw new TypeError('Failed to fetch'); return fn(); };
  if(!window.TXOffline) return traer().then(datos => ({ datos, desdeCache:false, guardadoEn:null }));
  return TXOffline.consultar(clave, traer, { tope: TOPE_LARGO_MS }).catch(e => {
    if(e && /no está iniciado/i.test(e.message || '')) return traer().then(datos => ({ datos, desdeCache:false, guardadoEn:null }));
    throw e;
  });
}
async function cargarTodo(){
  const r = await consultarMantencion('mantencion.docs', async () => {
    const filas = [];
    for(let d=0;;d+=200){
      // `updated_at` se agrega al select (Tarea 5, fix del hallazgo Critical de su revisión): sin
      // esto `baseConocida` no se puede llenar al cargar y toda corrección de un documento ya
      // existente queda condenada a CONFLICTO (ver el comentario junto a `baseConocida`, arriba).
      const { data, error } = await conTope(sb.from('mtto_docs').select('coleccion,id,data,updated_at').order('coleccion').order('id').range(d,d+199), PAGINA_TOPE_MS);
      if(error) throw error;
      filas.push(...data); if(data.length < 200) break;
    }
    return filas;
  });
  // Fix del hallazgo Important de la revisión final de la rama: `TXOffline.iniciar()` (arrancar(),
  // más abajo) dispara `sincronizar()` SIN esperarlo apenas abre la copia local, y esa resincronización
  // en segundo plano puede seguir reenviando una corrección pendiente/con problema de una sesión
  // anterior (sube fotos una por una antes de llamar a mtto_guardar_doc: puede tardar, más aún con la
  // señal débil/intermitente que es el caso de uso de esta app) mientras esta lectura cruda ya está en
  // camino. Sin fusionar, `db`/`snap` quedarían con la versión VIEJA de ese documento: el técnico vería
  // su propia corrección como "revertida" aunque el servidor ya la tenga bien, y la siguiente edición
  // de ese mismo documento (subirCambios()/docsCambiados comparando `db` viejo contra `snap`, que el
  // manejador único 'mantencion.doc' SÍ deja al día al confirmarse) volvería a encolar y a sobrescribir
  // el servidor con el contenido viejo. `MC.aplicarFilaDocs` (probado en tests/mantencion-core.test.js)
  // es exactamente para esto — mismo patrón que silos-tx/index.html (recomponerSols/SC.aplicarFilaSilos):
  // se fusiona ANTES de reconstruir `db`/`snap`, nunca después. Solo hace falta en ESTE punto (la única
  // lectura cruda de TODO mtto_docs sin pasar por `db`): las ediciones en vivo ya escriben directo en
  // `db[col]` (comentario de refrescarEntsFila/filaDeDoc, más abajo) y cambioRT() ya se cuida de no
  // pisar un documento con una entrada propia pendiente (filaPendiente()), así que no hace falta repetir
  // esta fusión en cada 'txoffline:cambio' — hacerlo ahí volvería a aplicar entradas ya retiradas de la
  // fila sobre un snapshot congelado y revertiría silenciosamente la corrección recién confirmada.
  let entradasFusion = []; try{ entradasFusion = window.TXOffline ? await TXOffline.entradas() : []; } catch(_){}
  const fusionDocs = MC.aplicarFilaDocs(r.datos, entradasFusion);
  db = vacio(); snap.clear(); db.org = null; db.tpls = {}; db.mm = {};
  baseConocida.clear();
  // `baseConocida` se llena con el `updated_at` REAL del servidor (r.datos, nunca `fusionDocs`): sigue
  // siendo la base para comparar en la próxima corrección (mtto_guardar_doc), y debe representar lo que
  // el servidor de verdad tiene confirmado, no el contenido todavía pendiente de confirmarse.
  r.datos.forEach(f => baseConocida.set(MC.claveDoc(f.coleccion, f.id), f.updated_at));
  fusionDocs.forEach(f => aplicarDoc(f.coleccion, f.id, f.data));
  const sinOrg = !db.org || !db.org.length;
  asegurar();
  // Si los datos vienen de la copia (sin señal) no se sube nada: subirCambios necesita red y solo
  // produciría un "Error al guardar" sin sentido mientras no vuelva la señal.
  if(sinOrg && ME.editor && !r.desdeCache) syncGuardar();
  estadoSync(r.desdeCache ? 'Sin conexión · datos del ' + new Date(r.guardadoEn).toLocaleString('es-CL') : 'Sincronizado');
}

function conectarVivo(){
  if(canalRT) sb.removeChannel(canalRT);
  canalRT = sb.channel('mtto-docs').on('postgres_changes', { event:'*', schema:'public', table:'mtto_docs' }, p => { cambioRT(p).catch(()=>{}); }).subscribe();

// Un documento (coleccion+id) con una entrada propia pendiente o con problema en la fila de envíos sin
// conexión (un cambio de este mismo técnico, en este mismo equipo, que todavía no salió) no se pisa con
// lo que llega por tiempo real: si se reemplazara db/snap de inmediato, se perdería en memoria lo que el
// técnico está editando antes de que la fila alcance a enviarlo. El conflicto real (¿otra persona cambió
// este documento mientras no había señal?) lo decide mtto_guardar_doc al sincronizar esa entrada (su
// propia versión del servidor vía clock_timestamp()), nunca este repintado en vivo — este solo evita
// adelantarse. A diferencia de Terreno/Silos (un solo id por fila), acá la identidad de un documento es
// coleccion+id (MC.claveDoc): uno de los 2 riesgos del plan sin equivalente exacto en esas apps.
async function filaPendiente(coleccion, id){
  if(!window.TXOffline) return false;
  let ents; try{ ents = await TXOffline.entradas(); } catch(_){ return false; }
  if(!ents.length) return false;
  const clave = MC.claveDoc(coleccion, id);
  return ents.some(e => e && e.tipo === 'mantencion.doc' && e.datos && MC.claveDoc(e.datos.coleccion, e.datos.docId || e.datos.id) === clave);
}
// Tarea 6: cache en memoria de `TXOffline.entradas()` (pendientes/con problema), solo para PINTAR la
// banda de conflicto de cada OT (filaDeDoc/bandaFilaOt más abajo) — a diferencia de Terreno/Silos, acá
// no hace falta fusionar ESTO con `MC.aplicarFilaDocs` para mostrar "mi versión" en cada repintado:
// `db.ots` YA ES la versión editable (pasos/cierre/permiso se escriben ahí mismo al tocar la OT,
// confirmados o no), así que lo que se ve en la fila en todo momento es lo que el técnico escribió.
// `MC.aplicarFilaDocs` sí se usa, pero una sola vez, dentro de `cargarTodo()` (arriba): es la única
// lectura cruda de TODO mtto_docs que puede llegar antes de que una corrección pendiente de una sesión
// anterior termine de confirmarse (revisión final de la rama) — fusionar en cada 'txoffline:cambio'
// aquí sería incorrecto, porque reaplicaría sobre `db` entradas ya retiradas de la fila. Se refresca con cada
// 'txoffline:cambio' (el mismo evento que ya pinta fila-ind) y dispara un repintado seguro (no pisa un
// formulario/sheet abierto, igual que cambioRT).
let entsFila = [];
async function refrescarEntsFila(){
  try{ entsFila = window.TXOffline ? await TXOffline.entradas() : []; } catch(_){ entsFila = []; }
  renderSeguro();
}
window.addEventListener('txoffline:cambio', refrescarEntsFila);
// Info de la fila para UN documento (coleccion+id): null si no hay nada pendiente/con problema. Misma
// precedencia que MC.aplicarFilaDocs (ver su comentario en mantencion-core.js): si ya hay un PROBLEMA
// para este documento se deja ese — es la única entrada con "Ver mi versión"/Reintentar y Descartar, y
// una pendiente posterior (p. ej. otra corrección encolada mientras la primera seguía con problema) no
// debe taparlo. `MC.causaCadena` se llama con `entsFila` completo (no solo las de este documento):
// una OT correctiva puede estar "Depende de un registro con problema" apuntando a SU checklist de
// origen, en otra colección/clave, y la causa real hay que seguirla hasta ahí.
function filaDeDoc(coleccion, id){
  const clave = MC.claveDoc(coleccion, id);
  const propias = entsFila.filter(e => e && e.tipo === 'mantencion.doc' && e.datos && MC.claveDoc(e.datos.coleccion, e.datos.docId || e.datos.id) === clave);
  if (!propias.length) return null;
  const problema = propias.find(e => e.estado === 'problema');
  const e = problema || propias[propias.length - 1];
  return { entradaId: e.id, estado: e.estado, error: e.estado === 'problema' ? MC.causaCadena(entsFila, e) : null };
}
// Único criterio de "puede corregir" en Mantención: a diferencia de Silos (puedeEditarSolicitud, que
// combina estado+rol+autoría del documento — tuvo que unificarse en una sola función porque el botón
// normal y "Ver mi versión" la habían duplicado y se desincronizaron, Tarea 6 de Silos), aquí no hay
// ningún permiso por documento: es el mismo ME.editor binario que ya revisa subirCambios() antes de
// encolar cualquier corrección (Tarea 5) y que la política RLS de mtto_docs (mtto_editor()) vuelve a
// exigir en el servidor sin importar lo que decida el cliente. Se nombra aparte (en vez de leer
// `ME.editor` suelto) para que "Ver mi versión" y cualquier otro camino de corrección futuro lean
// siempre el mismo criterio — un solo lugar que cambiar si Mantención alguna vez agrega una regla por
// documento.
function puedeCorregir(){ return !!ME && !!ME.editor; }
// Trae UN solo documento (coleccion+id) del servidor y lo aplica a `db`/`snap`/`baseConocida`, igual
// que cargarTodo() para todos a la vez pero sin recargar todo mtto_docs — lo usa Descartar (Tarea 6,
// hueco documentado del plan): si no se volviera a traer el documento real, el técnico seguiría viendo
// en pantalla la corrección que acaba de descartar hasta el próximo cargarTodo() completo (recarga de
// página), tal como señaló explícitamente la revisión de la Tarea 5. Sin señal no hace nada (no hay de
// dónde traerlo): se queda con lo que había, mismo límite que ya tiene cualquier consulta de esta app.
async function refrescarDocDesdeServidor(coleccion, id){
  if (navigator.onLine === false) return;
  try {
    const r = await sb.from('mtto_docs').select('data,updated_at').eq('coleccion',coleccion).eq('id',id).maybeSingle();
    if (r.error) return;
    const clave = MC.claveDoc(coleccion, id);
    if (!r.data){ aplicarDoc(coleccion, id, null); baseConocida.delete(clave); return; }
    aplicarDoc(coleccion, id, r.data.data); baseConocida.set(clave, r.data.updated_at);
  } catch(_) { /* sin señal o error de red: se queda con lo que había */ }
}
// Separado de conectarVivo (que solo cablea el canal) para poder probarse a mano desde la consola —
// cambioRT({eventType:'UPDATE', new:{coleccion:'chk', id:'x', data:{...}}}) — sin depender de un
// evento real de Supabase ni tocar la base de verdad.
async function cambioRT(p){
  if(p.eventType === 'DELETE'){
    const o = p.old; if(!o || !o.coleccion) return;
    if(await filaPendiente(o.coleccion, o.id)) return;
    aplicarDoc(o.coleccion, o.id, null); baseConocida.delete(MC.claveDoc(o.coleccion, o.id)); renderSeguro(); return;
  }
  const n = p.new;
  if(await filaPendiente(n.coleccion, n.id)) return;
  let data = n.data, updatedAt = n.updated_at;
  if(data === undefined || data === null){
    const r = await sb.from('mtto_docs').select('data,updated_at').eq('coleccion',n.coleccion).eq('id',n.id).maybeSingle();
    data = r.data && r.data.data; if(!data) return;
    updatedAt = r.data.updated_at;
  }
  if(snap.get(n.coleccion+SEP+n.id) === JSON.stringify(data)) return;
  // `updated_at` también se guarda acá (no solo en cargarTodo): Tarea 5, fix del hallazgo Critical de
  // su revisión — si no se actualizara, un cambio ajeno que llega por tiempo real dejaría
  // `baseConocida` vieja, y una corrección propia posterior de ESE MISMO documento chocaría con
  // CONFLICTO aunque el contenido en memoria ya esté al día (ver MC.claveDoc arriba).
  aplicarDoc(n.coleccion, n.id, data); baseConocida.set(MC.claveDoc(n.coleccion, n.id), updatedAt); renderSeguro();
}

// parte de la UI lo encoló — mismo patrón que silos-tx/index.html ('silos.solicitud'). Sube las
// fotos pendientes del checklist (si las hay, una por una, ruta determinista) y recién después llama
// a mtto_guardar_doc; el placeholder {pendiente:true} se reemplaza por la ruta real tanto en lo que
// se guarda como en el documento VIVO de `db` (si todavía está ahí): si solo se corrigiera la copia
// local de `datos.data`, subirCambios() vería este checklist "cambiado" para siempre, porque `db`
// seguiría con el placeholder aunque el servidor ya tenga la ruta real.
// `base` sale de `baseConocida` cuando subirCambios() encola (null solo en la primera alta de
// verdad); al confirmarse el guardado, acá abajo se refresca `baseConocida` con el `updated_at` que
// devuelve mtto_guardar_doc, para que la PRÓXIMA corrección de este mismo documento (aunque la
// encole una pasada de subirCambios distinta, incluso en otra sesión tras recargar) ya lo conozca.
// Red de seguridad (fix del hallazgo Critical de la revisión de la Tarea 5): un CONFLICTO con
// `base` null SOLO puede pasar si el documento YA EXISTÍA con contenido distinto (una alta de
// verdad jamás da CONFLICTO) — es decir, `baseConocida` tenía un hueco para este documento (nunca
// se cargó individualmente, o la corrección llegó antes de que cargarTodo()/cambioRT() alcanzaran a
// registrarlo). Antes de dejarlo "con problema" como un conflicto real con otra persona, se pide la
// versión actual del servidor y se reintenta UNA sola vez con esa base: si nadie más lo tocó en esa
// ventana mínima, el reintento tiene éxito (el propio técnico corrigiendo su trabajo reciente); si
// alguien más sí lo cambió justo ahí, el reintento vuelve a chocar y eso sí queda como conflicto
// real, para que la Tarea 6 lo resuelva.
TIPOS_FILA['mantencion.doc'] = async (datos, archivos, meta) => {
  const C = TXOfflineCore;
  const coleccion = datos.coleccion, docId = datos.docId || datos.id;
  const clave = MC.claveDoc(coleccion, docId);
  let data = datos.data || {};
  if (coleccion === 'chk' && Array.isArray(data.items)){
    const vivo = (db.chk || []).find(k => k.id === docId);
    for (let ix=0; ix<data.items.length; ix++){
      const it = data.items[ix];
      if (!it || !it.foto || !it.foto.pendiente) continue;
      const blob = archivos[ix+'.jpg'];
      if (!blob) throw new Error('Falta la foto '+(ix+1)+' en este teléfono: descarta el checklist y créalo de nuevo.');
      const ruta = rutaFoto(docId, ix);
      const r = await sb.storage.from('mantencion').upload(ruta, blob, { contentType: blob.type || 'image/jpeg' });
      const e = C.errorDeRespuesta(r);
      if (e && !C.subidaYaExiste(e)) throw e;
      it.foto = { path: ruta };
      if (vivo && vivo.items && vivo.items[ix]) vivo.items[ix].foto = { path: ruta };
    }
    if (vivo) data = vivo;
  }
  let base = datos.base;
  // Fix del hallazgo Important de la revisión: si esta entrada corrige el MISMO documento que una
  // entrada anterior todavía sin confirmar (`datos.madre`, fijado por subirCambios), la base que se
  // haya capturado entonces (o `baseConocida` en ese momento) puede haber quedado vieja antes de que
  // esa madre siquiera se intentara enviar — se usa la versión que la madre deja al confirmarse, NO
  // la capturada (mismo patrón que TC.baseCorreccion/madreParaVersion de Terreno; `datos.madre` acá
  // cumple el rol de `madreParaVersion`, sin la excepción `baseFresca` de Terreno porque Mantención
  // todavía no tiene un "Ver mi versión" que la necesite — Tarea 6 la agregará si corresponde).
  if (datos.madre){
    const versionMadre = await TXOffline.leerLocal('version-de:' + datos.madre);
    if (versionMadre) base = versionMadre;
  }
  let res = await sb.rpc('mtto_guardar_doc', { p_coleccion: coleccion, p_id: docId, p_base: base, p_data: data });
  let err = C.errorDeRespuesta(res);
  if (err && base == null && MC.esConflicto(err)){
    const actual = await sb.from('mtto_docs').select('updated_at').eq('coleccion', coleccion).eq('id', docId).maybeSingle();
    if (!actual.error && actual.data && actual.data.updated_at){
      base = actual.data.updated_at;
      res = await sb.rpc('mtto_guardar_doc', { p_coleccion: coleccion, p_id: docId, p_base: base, p_data: data });
      err = C.errorDeRespuesta(res);
    }
  }
  if (err) throw err;
  snap.set(clave, JSON.stringify(data));
  baseConocida.set(clave, res.data);
  try { await TXOffline.guardarLocal('version-de:' + meta.id, res.data); } catch(_){}
  return res.data;
};

// Arranque: una carrera corta contra getSession() en vez de esperarla completa (sin señal y con el
// token vencido puede tardar mucho en resolver, dejando la app entera "colgada" antes de pintar nada —
// confirmado en un teléfono real, no solo en la simulación de offline de esta sesión, que siempre falla
// rápido y nunca había reproducido este cuelgue). Mismo patrón ya probado en Registro de Terreno, Silos
// y CRM: si no llega a tiempo por red, se abre igual con el último usuario guardado en este equipo (la
// fila renueva la sesión real al volver la señal).
async function arrancar(){
  estadoSync('Conectando…');
  const r0 = await Promise.race([sb.auth.getSession().catch(error => ({ data:{ session:null }, error })), esperar(5000).then(() => null)]);
  let session = (r0 && r0.data && r0.data.session) || null;
  if(!session && (!r0 || (r0.error && esRedMantencion(r0.error)))){
    const u = usuarioGuardado();
    if(u) session = { user: u };
  }
  if(!session) return pantallaLogin();
  // Los tipos de la fila se registran ANTES de iniciar, porque iniciar() envía de inmediato lo que haya
  // quedado pendiente de una sesión anterior. La copia local va por usuario (TXOffline.iniciar abre/crea
  // su base ya sabiendo quién es).
  registrarTiposFila();
  try{ await TXOffline.iniciar({ app:'mantencion', sb, usuarioId: session.user.id }); }
  catch(e){ console.warn('[Mantencion] sin copia local:', e); }
  // Mismo problema que getSession() arriba, un paso más adelante: sin esta carrera, una red que no
  // responde (no solo que falla rápido) deja la app colgada aquí para siempre aunque la sesión ya se
  // haya resuelto con la copia guardada. Se cachea el último rol/perfil conocido de este usuario en
  // este teléfono (TXOffline.guardarLocal, misma base IndexedDB que el resto de la fila) para poder
  // abrir con eso si la red no contesta a tiempo.
  const cacheAcceso = 'mi-acceso:' + session.user.id;
  let acceso = null;
  const r1 = await Promise.race([
    (async () => {
      const [rol, prof] = await Promise.all([ sb.rpc('mtto_mi_rol'), sb.from('profiles').select('nombre,email').eq('id', session.user.id).maybeSingle() ]);
      return { rolData: rol.data, rolError: rol.error, profData: prof.data };
    })().catch(error => ({ error })),
    esperar(8000).then(() => null)
  ]);
  if (r1 && !r1.error){
    acceso = r1;
    if (window.TXOffline){ try { await TXOffline.guardarLocal(cacheAcceso, acceso); } catch(_){} }
  } else if (window.TXOffline){
    try { acceso = await TXOffline.leerLocal(cacheAcceso); } catch(_){}
  }
  if (!acceso){
    estadoSync('Sin conexión');
    document.getElementById('nav').hidden = true;
    document.getElementById('app').innerHTML = `<div id="gate"><div class="card"><h2>Sin conexión</h2><p class="muted">Necesitas abrir Mantención con señal al menos una vez en este teléfono para poder usarla después sin conexión.</p></div></div>`;
    return;
  }
  const pr = acceso.profData || {};
  ME = { id: session.user.id, email: session.user.email, nombre: pr.nombre || session.user.user_metadata?.nombre || session.user.email.split('@')[0], editor: acceso.rolData === 'editor' };
  if(acceso.rolError || !acceso.rolData){
    document.getElementById('nav').hidden = true; estadoSync('');
    document.getElementById('app').innerHTML = `<div id="gate"><div class="card"><h2>Sin acceso a Mantención</h2><p class="muted">Tu cuenta (${esc(ME.email)}) aún no tiene acceso a este módulo. Pídele al administrador que te habilite en Usuarios y accesos.</p>
      <button class="btn gh" onclick="cerrarSesion()">Cerrar sesión</button></div></div>`;
    return;
  }
  document.getElementById('uchip').textContent = ME.nombre + ' · ' + (ME.editor ? 'Editor' : 'Solo lectura');
  document.body.classList.toggle('ro', !ME.editor);
  document.getElementById('nav').hidden = false;
  try{ await cargarTodo(); }
  catch(e){ estadoSync('Error de conexión'); document.getElementById('app').innerHTML = `<div id="gate"><div class="card"><h2>No se pudieron cargar los datos</h2><p class="muted">${esc(e.message||e)}</p></div></div>`; return; }
  leerHash(); render(); conectarVivo();
}

function qrCanvas(code, titulo){

  const n=q.getModuleCount(), s=8, m=4, W=(n+2*m)*s, H=W+82;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,W,H); g.fillStyle='#000';
  for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) g.fillRect((k+m)*s,(r+m)*s,s,s);
  g.fillStyle='#e4032e'; g.fillRect(0,W,W,6);
  g.textAlign='center'; g.fillStyle='#111'; g.font='bold 20px sans-serif'; g.fillText(code,W/2,W+34);
  g.font='14px sans-serif'; g.fillText(String(titulo||'').slice(0,42),W/2,W+56);

  return c;

function svgMov(){
  const keys = diasKeys(30);
  const ent = keys.map(k=>db.movs.filter(m=>m.fecha===k&&m.tipo==='entrada').reduce((a,m)=>a+m.cant,0));
  const sal = keys.map(k=>db.movs.filter(m=>m.fecha===k&&m.tipo==='salida').reduce((a,m)=>a+m.cant,0));
  const max = Math.max(1,...ent,...sal), W=720, H=220, P=28, bw=(W-P*2)/30;
  let g='';
  for(let i=0;i<4;i++){const y=P+(H-2*P)*i/3; g+=`<line x1="${P}" x2="${W-P}" y1="${y}" y2="${y}" stroke="#2a2e36"/>`;}
  keys.forEach((k,i)=>{
    const x=P+i*bw+bw*0.15, w=bw*0.7, he=(ent[i]/max)*(H-2*P), hs=(sal[i]/max)*(H-2*P);
    g+=`<rect x="${x}" y="${H-P-he}" width="${w}" height="${he}" rx="2" fill="#2fbf71"><title>${k} · entradas ${ent[i]}</title></rect>`;
    g+=`<rect x="${x}" y="${H-P-hs}" width="${w}" height="${hs}" rx="2" fill="#f5a524"><title>${k} · salidas ${sal[i]}</title></rect>`;

  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Movimientos últimos 30 días">${g}</svg>`;
}

/* ===================== Lo que exige señal ===================== */
// Repuestos/bodega, organigrama (incl. su único borrado, orgdel), crear una plantilla de checklist nueva
// (fnchk) y la lista de usuarios son trabajo de oficina/gestión, no de captura en terreno (decisión del
// propio plan, "Fuera de alcance"): a diferencia de los checklists/OTs, que SÍ se encolan sin señal, estos
// controles se dejan deshabilitados sin red, con el motivo a la vista, en vez de dejarlos entrar a
// save()/subirCambios() y fallar ahí con un error técnico. Cada uno dice qué necesita en el `title` (nunca
// un "sin conexión" genérico). Mismo patrón ya endurecido en Terreno/Silos: exigeSenal/aplicarExigeSenal
// (copiado tal cual de registro-terreno.html).
function exigeSenal(btn, motivo){
  if (!btn || (btn.disabled && btn.title && btn.title !== motivo)) return;
  if (navigator.onLine === false) { btn.disabled = true; btn.title = motivo; }
  else if (btn.title === motivo) { btn.disabled = false; btn.title = ''; }
}
// El "Depende de" (jefe) del organigrama casi siempre tiene más de 7 opciones: comboboxes() (más abajo)
// lo reemplaza por un campo de texto + datalist y oculta el <select> real. Deshabilitar solo el <select>
// no alcanza para bloquear la edición ahí: hay que alcanzar también ese campo visible si ya existe.
function exigeSenalCampo(el, motivo){
  exigeSenal(el, motivo);
  const cbx = el.nextElementSibling;
  if (cbx && cbx.classList && cbx.classList.contains('cbx')) exigeSenal(cbx, motivo);
}
// Reaplica exigeSenal a los controles ya dibujados: se llama al final de cada render() y, más abajo,
// también al vuelo en los eventos online/offline, sin esperar al siguiente render. Solo uno de
// fsol/fmov/frep existe a la vez en el DOM (repuestos() solo pinta el paso activo): los otros
// querySelectorAll simplemente no encuentran nada, sin problema.
function aplicarExigeSenal(){
  document.querySelectorAll('#fsol button[type="submit"]').forEach(b => exigeSenal(b, 'Necesitas señal para enviar la solicitud de repuesto'));
  document.querySelectorAll('#fmov button[type="submit"]').forEach(b => exigeSenal(b, 'Necesitas señal para registrar el movimiento de bodega'));
  document.querySelectorAll('#frep button[type="submit"]').forEach(b => exigeSenal(b, 'Necesitas señal para crear el producto en el catálogo'));
  document.querySelectorAll('[data-act="entregar"]').forEach(b => exigeSenal(b, 'Necesitas señal para entregar el repuesto'));
  document.querySelectorAll('[data-act="rechazar"]').forEach(b => exigeSenal(b, 'Necesitas señal para rechazar la solicitud'));
  document.querySelectorAll('#forg button[type="submit"]').forEach(b => exigeSenal(b, 'Necesitas señal para agregar a esta persona al organigrama'));
  document.querySelectorAll('[data-org]').forEach(el => exigeSenalCampo(el, 'Necesitas señal para editar el organigrama'));
  document.querySelectorAll('[data-act="orgdel"]').forEach(b => exigeSenal(b, 'Necesitas señal para quitar a esta persona del organigrama'));
  document.querySelectorAll('#fnchk button[type="submit"]').forEach(b => exigeSenal(b, 'Necesitas señal para crear la plantilla de checklist'));
  document.querySelectorAll('[data-act="usuarios"]').forEach(b => exigeSenal(b, 'Necesitas señal para editar la lista de usuarios'));
}
// Se agregan una sola vez (no en cada render): reevalúan los controles ya dibujados al vuelo cuando
// cambia la señal, sin esperar al siguiente render().
window.addEventListener('online', aplicarExigeSenal);
window.addEventListener('offline', aplicarExigeSenal);
aplicarExigeSenal();   // el botón "Usuarios" del encabezado existe desde que carga la página, antes del primer render()

function render(){
  document.getElementById('nav').innerHTML = TABS.map(([k,l,c])=>`<button class="${k===tab?'on':''}" style="--c:${c}" data-act="ir" data-tab="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg><span>${l}</span></button>`).join('');
  document.getElementById('yo').innerHTML = db.usuarios.map((u,i)=>`<option value="${i}" ${i===db.yo?'selected':''}>${esc(u)}</option>`).join('');
  document.getElementById('app').innerHTML = PAGES[tab]();
  aplicarExigeSenal();
}

const ACT = {
  ir(b){ tab = b.dataset.tab; render(); window.scrollTo(0,0); },
  chk(b){ sel = b.dataset.eq; tab='checklist'; render(); },
  repsub(b){ repSub = b.dataset.s; render(); },
  otde(b){ window._otEq = b.dataset.eq; tab='ot'; render(); },
  solrep(b){ repSub='solicitar'; tab='repuestos'; render(); document.querySelector('#fsol select[name=rep]').value=b.dataset.id; },
  entregar(b){
    const s = db.sol.find(x=>x.id===b.dataset.id); if(!s) return;
    if (stock(s.rep) < s.cant){ toast('No hay existencia suficiente para entregar. Registra una entrada primero.'); return; }
    db.movs.push({id:uid('m'),rep:s.rep,tipo:'salida',cant:s.cant,eq:s.eq,ref:s.ref||s.id,nota:'Entrega solicitud '+s.id,fecha:hoy(),usuario:yo()});
    s.estado='entregada'; s.entrega=hoy(); save(); render(); toast('Entregado y descontado de bodega');
  },
  rechazar(b){ const s=db.sol.find(x=>x.id===b.dataset.id); if(s){ s.estado='rechazada'; save(); render(); } },
  otest(b){
    const o = db.ots.find(x=>x.id===b.dataset.id); if(!o) return;
    if (o.riesgos && o.riesgos.length && !o.permiso){ toast('Antes de continuar falta el permiso de trabajo seguro con corroboración del supervisor.'); verPermiso(o.id); return; }
    o.estado = b.dataset.e; if (o.estado==='cerrada'){ o.cierre = hoy(); }
    if (o.estado==='cerrada' && o.chkId){ const k=db.chk.find(x=>x.id===o.chkId); if(k) k.resuelta=true; }
    save(); render();
  },
  usuarios(){
    const nuevo = db.usuarios.map((u,i)=>`${i+1}. ${u}`).join('\n');
    const r = prompt('Nombres de los 6 usuarios, separados por coma:', db.usuarios.join(', '));
    if (r){ const l = r.split(',').map(x=>x.trim()).filter(Boolean).slice(0,6); if(l.length){ db.usuarios=l; db.yo=Math.min(db.yo,l.length-1); save(); render(); } }
  },
  exportar(){
    const blob = new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'respaldo-mantencion-'+hoy()+'.json'; a.click();
  },
  importar(){ document.getElementById('fileImp').click(); },
  pasos(b){ verPasos(b.dataset.id); },
  qr(b){ verQR(b.dataset.eq); },
  permiso(b){ verPermiso(b.dataset.id); },
  orgdel(b){ db.org.forEach(p=>{ if(p.jefe===b.dataset.id) p.jefe=''; }); db.org = db.org.filter(p=>p.id!==b.dataset.id); save(); render(); },
  // Tarea 6: tarjeta de pendientes de una OT con problema (bandaFilaOt, dentro de PAGES.ot).
  verMiVersionOt(b){ verMiVersionOt(b.dataset.eid); },
  filaReintentarOt: async b => { await TXOffline.reintentar(MC.cadenaCompleta(await TXOffline.entradas(), b.dataset.eid)); },
  filaDescartarOt: async b => {
    if (!confirm('¿Descartar esta corrección? Se perderá lo que cambiaste en este equipo mientras no tenías señal.')) return;
    await descartarCorreccion(b.dataset.eid);
  }
};

/* Listas desplegables con muchas opciones -> campo donde se puede escribir y filtrar */
function comboboxes(){
  let n = 0;
  document.querySelectorAll('select').forEach(sl => {
    if (sl.dataset.cb || sl.options.length <= 7 || sl.id==='yo') return;
    sl.dataset.cb = '1'; const uid_ = 'dl'+(++n)+'_'+Math.random().toString(36).slice(2,6);
    const ph = (sl.options[0] && sl.options[0].value==='') ? sl.options[0].text.replace(/^[—\s-]+|[—\s-]+$/g,'') : '';
    const inp = document.createElement('input'); inp.type='text'; inp.setAttribute('list',uid_); inp.autocomplete='off';
    inp.placeholder = (ph || 'Escribe o elige')+' · escribe para filtrar'; inp.className = 'cbx '+(sl.className||'').replace(/\bgrow\b/,'').trim(); if (sl.style.cssText) inp.style.cssText = sl.style.cssText;
    const dl = document.createElement('datalist'); dl.id = uid_;
    const opts = [...sl.options].filter(o=>o.value!=='');
    dl.innerHTML = opts.map(o=>'<option value="'+esc(o.text)+'"></option>').join('');
    const cur = sl.options[sl.selectedIndex]; inp.value = cur && cur.value!=='' ? cur.text : '';
    const req = sl.required; if (req){ sl.required = false; inp.required = true; }
    // Si exigeSenal ya deshabilitó el <select> (p.ej. "Depende de" en el organigrama, sin señal), el
    // campo visible que lo reemplaza tiene que nacer igual de deshabilitado: si no, el <select> real
    // queda oculto e inerte pero este input de texto sigue editable, y la señal deja de ser la única
    // fuente de verdad. aplicarExigeSenal() alcanza este input en vivo (ver más abajo), esto solo cubre
    // el caso en que la conversión ocurre DESPUÉS de deshabilitar el <select> en el mismo render.
    if (sl.disabled) { inp.disabled = true; inp.title = sl.title; }
    const apply = () => {
      const v = inp.value.trim().toLowerCase();
      let m = opts.find(o=>o.text.toLowerCase()===v);
      if (!m && v) m = opts.find(o=>o.text.toLowerCase().split(' · ')[0]===v);
      if (!m && v){ const c = opts.filter(o=>o.text.toLowerCase().includes(v)); if (c.length===1) m = c[0]; }
      const nuevo = m ? m.value : '';
      inp.setCustomValidity(v && !m ? 'Elige una opción de la lista' : '');
      if (sl.value !== nuevo){ sl.value = nuevo; sl.dispatchEvent(new Event('change',{bubbles:true})); }
      return m;
    };
    inp.addEventListener('input', apply);
    inp.addEventListener('change', () => { const m = apply(); if (m) inp.value = m.text; });
    inp.addEventListener('focus', () => { if (inp.value && inp.select) inp.select(); });
    sl.style.display = 'none'; sl.after(inp, dl);
  });
}

async function fotoDataURL(file){
  if(!file || !file.size) return null;
  const url = URL.createObjectURL(file);
  const img = await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url;});
  const k = Math.min(1, 640/Math.max(img.width,img.height));
  const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg',0.6);
}
// Decisión del Step 1 de la Tarea 5 (Review Focus punto 5): el código viejo intentaba subir la foto
// al bucket AL TOMARLA y, si fallaba, caía sola a guardarla como base64 dentro de `data`. Sin señal
// esa subida fallaría SIEMPRE, así que cada checklist offline habría dejado fotos pesadas en base64
// incrustadas para siempre en `mtto_docs.data` (nunca se reintenta subirlas de verdad después) — el
// mismo riesgo que la revisión de la Tarea 4 marcó para el tope de 8 s por página de `cargarTodo()`.
// Se decide subir recién al sincronizar, como Terreno: acá solo se comprime la foto y se devuelve su
// blob (para viajar como archivo de la entrada de la fila) más un placeholder liviano para `data`
// mientras no se ha enviado; el manejador único ('mantencion.doc', más abajo) sube la foto de verdad,
// una por una, con ruta determinista (rutaFoto) justo antes de llamar a mtto_guardar_doc, y reemplaza
// el placeholder por la ruta real tanto en lo que guarda como en el documento vivo de `db`.
async function fotoGuardar(file){
  const dataURL = await fotoDataURL(file);
  if(!dataURL) return null;
  const blob = await (await fetch(dataURL)).blob();
  return { blob, placeholder:{ pendiente:true } };
}
// Blobs de fotos de checklists ya guardados en `db` pero todavía no encolados (subirCambios los
// recoge y los adjunta a la entrada de la fila cuando por fin encola ese checklist): viven en memoria,
// no en IndexedDB, nada más mientras pasa el debounce de syncGuardar (250 ms) — el mismo riesgo breve
// que ya tenía cualquier otro cambio de `db` antes de este guardado (no es un riesgo nuevo de esta
// tarea). Clave: el id propio del checklist (no el de la entrada de la fila).
const FOTOS_PENDIENTES = new Map();
function fotosPendientes(chkId){
  const m = FOTOS_PENDIENTES.get(chkId);
  if(!m) return {};
  FOTOS_PENDIENTES.delete(chkId);
  const out = {};
  Object.entries(m).forEach(([ix,blob]) => { out[ix+'.jpg'] = blob; });
  return out;
}
// Ruta determinista de la foto de un ítem de checklist en el bucket 'mantencion': `docId` es el id
// propio del checklist (el que se guarda en mtto_docs), no el id de la entrada de la fila que la
// envía — mismo patrón que TC.rutaFoto de Terreno (registro-terreno.html), para que un reintento
// suba a la MISMA ruta y el bucket responda "ya existe" (TXOfflineCore.subidaYaExiste), nunca una
// foto duplicada.
function rutaFoto(docId, ix){ return docId+'/'+(ix+1)+'.jpg'; }
async function guardarChk(f){
  const fd = new FormData(f);
  const t = tplDe(sel); const items = [];
  const id = uid('k');
  const fotosBlob = {};
  for (let ix=0; ix<t.i.length; ix++){
    const v = fd.get('i'+ix);
    const file = fd.get('f'+ix);
    if (v==='falla' && !(file && file.size)){
      const el = f.querySelector('.item[data-ix="'+ix+'"]'); if(el){ el.classList.add('falta'); el.scrollIntoView({block:'center',behavior:'smooth'}); }
      toast('Falta la foto obligatoria del ítem marcado «Revisar».'); return;
    }
    let foto = null;
    if (file && file.size){
      const r = await fotoGuardar(file);
      if (r){ foto = r.placeholder; fotosBlob[ix] = r.blob; }
    }
    items.push({item:t.i[ix], r:v, foto, com:(fd.get('c'+ix)||'').trim()});
  }
  const fallas = items.filter(x=>x.r==='falla');
  db.mm = db.mm||{}; db.mm[sel] = {f:(fd.get('fab')||'').trim(), m:(fd.get('mod')||'').trim()};
  const chk = {id,eq:sel,tpl:t.t,fecha:hoy(),usuario:yo(),items,fallas:fallas.length,resuelta:fallas.length===0,obs:items.filter(x=>x.com).map(x=>x.item.split(' | ')[0]+': '+x.com).join(' · '),permiso:(t.r&&t.r.length)?{riesgos:t.r,corr:fd.get('corr'),fecha:hoy()}:null};
  db.chk.push(chk);
  if (fallas.length){
    // La OT correctiva se encola DESPUÉS del checklist, con dependeDe hacia su entrada (Tarea 5, Step
    // 3): eso lo decide subirCambios() más abajo (procesa 'chk' antes que el resto de lo cambiado en
    // el mismo lote), no aquí — acá solo se deja la relación (chkId) para que subirCambios la vea.
    const oid='OT-'+String(sigNum(db.ots,'OT-')).padStart(4,'0');
    db.ots.push({id:oid,eq:sel,tipo:'Correctiva',pri:'Alta',desc:'Revisar en checklist: '+fallas.map(x=>x.item+(x.com?' ('+x.com+')':'')).join('; '),asig:db.usuarios[0],compromiso:sumarDias(2),estado:'abierta',creada:hoy(),usuario:yo(),chkId:id});
    toast('Checklist guardado con ítems a revisar. Se creó '+oid);
  } else toast('Checklist guardado. Todo OK');
  if (Object.keys(fotosBlob).length) FOTOS_PENDIENTES.set(id, fotosBlob);
  save(); render();
}

// Resumen corto de un documento de OT (propio o el que trae el servidor) para la tarjeta de
// pendientes: mismos campos que pinta la tabla de la pestaña OT, sin repetir su HTML completo.
function resumenOt(data){
  if (!data) return '';
  const pasos = data.pasos && data.pasos.length ? `${data.pasos.filter(p=>p.ok).length}/${data.pasos.length} pasos` : null;
  return `<p style="margin:4px 0"><b>Estado:</b> ${esc(data.estado||'—')}</p>`
    + (pasos ? `<p style="margin:4px 0"><b>Pasos:</b> ${esc(pasos)}</p>` : '')
    + (data.cierre ? `<p style="margin:4px 0"><b>Cierre:</b> ${esc(data.cierre)}</p>` : '')
    + (data.permiso ? `<p style="margin:4px 0"><b>Permiso:</b> corroborado por ${esc(data.permiso.corr||'—')}</p>` : '');
}
// Reintenta la corrección de una OT con una base recién pedida al servidor (o la última que se
// conocía, sin señal): descarta primero toda la cadena de la entrada con problema (MC.cadenaCompleta —
// incluye lo que de verdad dependa de ella, p. ej. una corrección posterior del mismo documento que
// quedó "Depende de un registro con problema"; nunca al revés) y deja que subirCambios() vuelva a
// encolar desde `db.ots` — que ya tiene todo lo que el técnico marcó, confirmado o no — con la base
// fresca. No se reconstruye el documento a mano: subirCambios() vuelve a leer `db.ots[x]` tal cual
// está en este momento, y lo que viaje en la entrada nueva (el manejador 'mantencion.doc' recibe los
// datos ya CLONADOS al pasar por la fila/IndexedDB, nunca la misma referencia de objeto JS que
// `db.ots[x]`) va a coincidir con "mi versión" igual, porque nada más muta `db.ots[x]` en la ventana
// entre descartar la entrada vieja y que subirCambios() vuelva a encolar.
async function reintentarOtConBaseFresca(entradaId, otId, baseFresca){
  let ents = [];
  try { ents = window.TXOffline ? await TXOffline.entradas() : []; } catch(_) {}
  for (const x of MC.cadenaCompleta(ents, entradaId)) { try { await TXOffline.descartar(x, { aunPendiente:true }); } catch(_) {} }
  baseConocida.set(MC.claveDoc('ots', otId), baseFresca || null);
  save();
  toast('Reintentando con la versión actual del servidor…');
}
// Construye y muestra la tarjeta de comparación. `dataServ` es `null` si no se pudo consultar (sin
// señal) o si el documento ya no existe en el servidor.
function mostrarVerMiVersionOt(o, entradaId, dataServ, consultado, yaNoExiste, baseFresca){
  const box = document.createElement('div'); box.className = 'sheet-bg';
  let bannerHtml;
  if (yaNoExiste) bannerHtml = '<div class="alert alta">Esta orden de trabajo ya no está en el servidor: al reintentar se vuelve a guardar igual que la primera vez.</div>';
  else if (!consultado) bannerHtml = '<div class="alert">Sin señal no se puede comparar con el servidor todavía: se reintentará con la última versión que se conoce de este equipo, y puede volver a marcar conflicto si alguien más la corrigió mientras tanto.</div>';
  else bannerHtml = `<div class="alert alta">Otra persona corrigió esta OT en el servidor mientras no tenías señal:${resumenOt(dataServ)}</div>`;
  box.innerHTML = `<div class="sheet" style="max-width:560px;max-height:90vh;overflow:auto">
    <h3>${esc(o.id)} · tu versión sin enviar</h3>
    <p class="muted" style="margin-top:-4px">${esc(EQ[o.eq]?.n||o.eq)} · ${esc(o.desc||'')}</p>
    ${bannerHtml}
    <p style="margin:10px 0 0"><b>Tu versión (lo que ves ahora en esta pantalla):</b></p>
    ${resumenOt(o)}
    <div class="row" style="justify-content:flex-end;margin-top:6px">
      <button class="btn gh" type="button" id="otVerCerrar">Cerrar</button>
      <button class="btn" type="button" id="otVerReintentar">Mantener mi versión y reintentar</button>
    </div></div>`;
  box.addEventListener('click', ev => { if (ev.target===box || ev.target.id==='otVerCerrar') box.remove(); });
  box.querySelector('#otVerReintentar').addEventListener('click', () => { box.remove(); reintentarOtConBaseFresca(entradaId, o.id, baseFresca); });
  document.body.appendChild(box);
}
// "Ver mi versión": la corrección de esta OT quedó con problema (CONFLICTO — o NO_EXISTE, defensivo:
// mtto_guardar_doc nunca borra una OT, así que hoy no debería pasar) y el técnico necesita decidir sin
// perder lo que marcó. A diferencia de Terreno/Silos, acá no hay un formulario separado que reabrir:
// `db.ots` YA ES la versión editable (pasos/cierre/permiso se escriben ahí mismo), así que esto solo
// compara con lo que haya ahora en el servidor y, si el técnico decide mantener la suya, pide una base
// fresca antes de reenviar — nunca la vieja que causó el conflicto.
// El permiso para corregir (puedeCorregir()) se vuelve a chequear AQUÍ, contra el estado ACTUAL de la
// sesión — no contra la copia vieja en conflicto, que no sabe nada de permisos — igual que tuvo que
// corregir la Tarea 6 de Silos (puedeEditarSolicitud evaluada contra el documento actual, nunca contra
// `d.datos`): si la sesión pasó a ser de solo lectura mientras no había señal, no se ofrece reintentar.
async function verMiVersionOt(entradaId){
  let ents = [];
  try { ents = window.TXOffline ? await TXOffline.entradas() : []; } catch(_) {}
  const e = ents.find(x => x.id === entradaId);
  if (!e) { toast('Esa corrección ya no está pendiente.'); return; }
  const d = e.datos || {};
  if (d.coleccion !== 'ots') { toast('Esta corrección no se puede revisar desde aquí.'); return; }
  const docId = d.docId || d.id;
  const o = db.ots.find(x => x.id === docId);
  if (!o) { toast('Esa orden de trabajo ya no está en este equipo.'); return; }
  if (!puedeCorregir()) { toast('Tu acceso es de solo lectura: no puedes corregir esta orden de trabajo.'); return; }
  let dataServ = null, consultado = false, updatedAt = null;
  if (navigator.onLine !== false) {
    try {
      const r = await sb.from('mtto_docs').select('data,updated_at').eq('coleccion','ots').eq('id',docId).maybeSingle();
      if (!r.error) { consultado = true; if (r.data) { dataServ = r.data.data; updatedAt = r.data.updated_at; } }
    } catch(_) {}
  }
  const yaNoExiste = MC.noExiste(e.error) || (consultado && !dataServ);
  const baseFresca = yaNoExiste ? null : consultado ? updatedAt : (d.base || null);
  mostrarVerMiVersionOt(o, entradaId, dataServ, consultado, yaNoExiste, baseFresca);
}
// "Descartar": abandona la corrección sin enviar (y todo lo que dependa de verdad de ella — la cadena
// completa, MC.cadenaCompleta) y, si era de una OT, vuelve a traer el documento real del servidor para
// que el técnico no se quede viendo en pantalla lo que acaba de descartar (ver refrescarDocDesdeServidor).
async function descartarCorreccion(entradaId){
  let ents = [];
  try { ents = window.TXOffline ? await TXOffline.entradas() : []; } catch(_) {}
  const e = ents.find(x => x.id === entradaId);
  const d = (e && e.datos) || {};
  const esOt = d.coleccion === 'ots';
  const docId = esOt ? (d.docId || d.id) : null;
  for (const x of MC.cadenaCompleta(ents, entradaId)) { try { await TXOffline.descartar(x, { aunPendiente:true }); } catch(_) {} }
  if (esOt && docId) await refrescarDocDesdeServidor('ots', docId);
  render();
  toast('Corrección descartada.' + (esOt ? ' Se muestra la versión del servidor.' : ''));
}
