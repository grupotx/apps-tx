<style>
:root{
  --brand:#ff2a4d;--brand-ink:#fff;--brand-soft:#3a0f18;
  --bg:#050505;--card:#0e0f11;--sunk:#17181b;--ink:#f4f4f4;--mute:#a4a7ae;
  --line:rgba(255,255,255,.22);--line-soft:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.55);
  --ok:#4fd18a;--bad:#ff6670;--warn:#f2b04a;--info:#79a8f0;--viol:#b98be6;--teal:#4cc9cb;--gris:#9aa3b4;
  --f-ui:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark}
:root[data-theme="light"]{
  --brand:#e4032e;--brand-soft:#fde7eb;--bg:#f2f2f0;--card:#ffffff;--sunk:#eaeae7;--ink:#121212;--mute:#5e6066;
  --line:rgba(0,0,0,.18);--line-soft:rgba(0,0,0,.08);--line-strong:rgba(0,0,0,.5);
  --ok:#18864a;--bad:#c4121f;--warn:#b86e00;--info:#2459a8;--viol:#8a4fbf;--teal:#0f8b8d;--gris:#6b7280;
  color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:var(--f-ui);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
.topin{display:flex;align-items:center;gap:14px;padding:12px max(20px,env(safe-area-inset-left,0px));max-width:1200px;margin:0 auto;flex-wrap:wrap}
.txmark{width:58px;flex:none;color:var(--ink);display:block}
.ttl{display:flex;flex-direction:column;margin-right:auto;min-width:0;line-height:1.15}
.ttl small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:700}
.ttl h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#estado-conexion{font-size:12px;color:var(--mute)}
.uchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line-soft);border-radius:99px;padding:4px 12px 4px 4px;color:var(--ink);text-decoration:none;font-size:13px}
.uchip .av{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:11.5px;font-weight:700}
.uchip .un{display:grid;line-height:1.15}.uchip .un b{font-size:12.5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.uchip .un small{font-size:10.5px;color:var(--mute);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs{display:flex;gap:6px;padding:0 max(20px,env(safe-area-inset-left,0px)) 10px;overflow-x:auto;max-width:1200px;margin:0 auto;scrollbar-width:none}
nav.tabs button{flex:none;border:1px solid transparent;background:transparent;color:var(--mute);padding:8px 14px;border-radius:10px;font-weight:600;font-size:13.5px;cursor:pointer}
nav.tabs button:hover{color:var(--ink);background:var(--sunk)}
nav.tabs button.on{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
main{padding:20px max(20px,env(safe-area-inset-left,0px)) 56px;max-width:1200px;margin:0 auto}
@media (max-width:560px){.topin{padding:10px 14px;gap:10px}.txmark{width:44px}.ttl h1{font-size:17px}.uchip{padding:3px}.uchip .un{display:none}nav.tabs{padding:0 14px 10px}main{padding:14px 14px 48px}}
h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:10px;background:var(--sunk);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
input[type=checkbox]{width:auto;accent-color:var(--brand)}
textarea{min-height:90px;resize:vertical}
.btn{background:var(--brand);color:var(--brand-ink);border:1px solid var(--brand);border-radius:10px;padding:9px 15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.6;cursor:wait}
.btn.ghost,button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line-strong);border-radius:10px;padding:9px 15px;font-weight:600;cursor:pointer}
.btn.sm{padding:6px 11px;font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:16px;margin-bottom:14px}
.aviso{color:var(--mute);font-size:12.5px;margin:0 0 12px}
.small{color:var(--mute);font-size:11.5px;white-space:normal}
.sin{color:var(--mute);text-align:center;padding:28px 8px}
.acciones{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.gate{max-width:420px;margin:48px auto;padding:24px}
.gate .txmark{width:110px;margin-bottom:18px}
.gate label,.f label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--mute);margin:14px 0 6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;transition:transform .25s,opacity .25s;opacity:0;pointer-events:none;font-size:13.5px;z-index:60;max-width:calc(100vw - 32px)}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
/* ---- bandeja ---- */
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{border:1px solid var(--line-strong);background:transparent;color:var(--mute);padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer}
.subtabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.subtabs .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--brand);color:var(--brand-ink);font-size:11px;font-weight:700;text-align:center}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:12px;margin-bottom:14px}
.filtros input[type=search]{flex:1 1 200px;width:auto}
.filtros select{flex:0 1 auto;width:auto;max-width:100%}
.filtros label{font-size:12.5px;color:var(--mute);display:flex;gap:6px;align-items:center}
.lista{display:grid;gap:10px}
a.rec{display:grid;gap:4px;background:var(--card);border:1px solid var(--line-soft);border-left:4px solid var(--gris);border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit}
a.rec:hover{border-color:var(--line-strong)}
a.rec:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a.rec.est-ingresado{border-left-color:var(--info)}a.rec.est-derivado{border-left-color:var(--warn)}a.rec.est-en_verificacion{border-left-color:var(--viol)}
a.rec.est-aprobado{border-left-color:var(--ok)}a.rec.est-rechazado{border-left-color:var(--bad)}a.rec.est-solucion_definida{border-left-color:var(--teal)}
a.rec.est-comunicado{border-left-color:var(--info)}a.rec.est-cerrado,a.rec.est-anulado{border-left-color:var(--gris)}
a.rec.est-anulado{opacity:.65}
.rec-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.folio{font-family:var(--f-mono);font-size:12.5px;font-weight:700}
.est{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid var(--line-strong);color:var(--ink);white-space:nowrap}
.est.est-ingresado{color:var(--info);border-color:var(--info)}.est.est-derivado{color:var(--warn);border-color:var(--warn)}.est.est-en_verificacion{color:var(--viol);border-color:var(--viol)}
.est.est-aprobado{color:var(--ok);border-color:var(--ok)}.est.est-rechazado{color:var(--bad);border-color:var(--bad)}.est.est-solucion_definida{color:var(--teal);border-color:var(--teal)}
.est.est-comunicado{color:var(--info);border-color:var(--info)}.est.est-cerrado,.est.est-anulado{color:var(--gris);border-color:var(--gris)}
.edad{margin-left:auto;font-size:12px;color:var(--mute);font-family:var(--f-mono)}
.edad.alta{color:var(--bad);font-weight:700}
.pend{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--brand)}
.pend::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand)}
.rec-cli{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis}
.rec-mot,.rec-resp{color:var(--mute);font-size:12.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.plt{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--mute)}
/* ---- formularios, diálogos y detalle ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line-soft);border-top:3px solid var(--brand);border-radius:14px;padding:12px 14px}
.kpi small{display:block;color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.kpi b{display:block;font-size:22px;font-weight:800;margin-top:2px}
.kpi span{color:var(--mute);font-size:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;color:var(--mute);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--line)}
table.tbl td{padding:7px 6px;border-bottom:1px solid var(--line-soft);overflow-wrap:anywhere}
.num{text-align:right!important;font-family:var(--f-mono);white-space:nowrap}
.persona{display:grid;gap:8px}
.persona .top{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.persona .top b{font-size:15px}
.chips2{display:flex;gap:6px;flex-wrap:wrap}
.chip2{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:999px;padding:3px 4px 3px 11px;font-size:12.5px}
.chip2 button{border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:15px;line-height:1;padding:2px 6px;border-radius:99px}
.chip2 button:hover{color:var(--bad);background:var(--sunk)}
.inact{color:var(--warn);font-size:12px;font-weight:700}
.f{max-width:640px;margin:0 auto}
.f h2{font-size:18px;margin-bottom:4px}
.f small,.dlg small{color:var(--mute);font-weight:400}
.f details{margin-top:14px;border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.f details summary{cursor:pointer;font-weight:700;font-size:13px}
.f .fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.f .fila2{grid-template-columns:1fr}}
.opts{display:grid;gap:6px;margin-top:6px}
button.opt{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer}
button.opt:hover,button.opt:focus-visible{border-color:var(--brand);outline:none}
button.opt small{color:var(--mute);display:block}
.chosen{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--brand-soft);border:1px solid var(--brand);border-radius:10px;padding:8px 11px}
.chosen b{overflow:hidden;text-overflow:ellipsis}
.btn.peligro{background:var(--bad);border-color:var(--bad);color:#fff}
.dlg-err{background:color-mix(in srgb,var(--bad) 14%,transparent);border:1px solid var(--bad);color:var(--ink);border-radius:10px;padding:9px 12px;margin-top:12px;font-size:13px}
.hint{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:10px;font-size:12.5px;color:var(--mute)}
.ov{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:600px){.ov{align-items:center;padding:12px}}
.dlg{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:18px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:0 24px 60px -20px rgba(0,0,0,.6)}
@media (min-width:600px){.dlg{border-radius:16px}}
.dlg h2{font-size:17px;margin-bottom:6px}
.dlg label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--mute);margin:14px 0 6px}
.dlg .radios{display:flex;gap:10px;flex-wrap:wrap}
.dlg .radios label{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);border:1px solid var(--line-strong);border-radius:10px;padding:9px 14px;margin:0;cursor:pointer}
.dlg .radios input{width:auto}
.f .radios{display:flex;gap:10px;flex-wrap:wrap}
.f .radios label{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);border:1px solid var(--line-strong);border-radius:10px;padding:9px 14px;margin:0;cursor:pointer}
.f .radios input{width:auto}
.chips2 + input,.chips2 + .hint{margin-top:8px}
.chip2 small{display:block}
.plist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.plist small{color:var(--mute);display:block}
input[readonly]{opacity:.8;cursor:default}
.det .volver{display:inline-block;margin-bottom:10px;color:var(--mute);text-decoration:none;font-size:13px}
.det-h h2{font-size:19px;margin:6px 0 4px}
.det-h .meta{color:var(--mute);font-size:12.5px;display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.folio.big{font-size:15px}
.accbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.accbar .btn,.accbar .ghost{padding:8px 13px;font-size:13px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.card h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.card p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
dl.kv dt{color:var(--mute)}dl.kv dd{margin:0;overflow-wrap:anywhere}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.fotos a,.fotos .tile{display:grid;place-items:center;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk);font-size:12px;color:var(--mute);text-align:center;padding:4px;text-decoration:none}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
ol.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
ol.tl li{position:relative;padding:0 0 14px 20px;border-left:2px solid var(--line);margin-left:6px}
ol.tl li:last-child{padding-bottom:0;border-left-color:transparent}
ol.tl li::before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--brand)}
ol.tl .t{font-weight:600;font-size:13.5px}
ol.tl .w{color:var(--mute);font-size:12px}
ol.tl .n{font-size:13px;margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>

// Llama a una función de la base. Muestra el mensaje de la base como aviso y devuelve { data } o { error }.
async function rpc(nombre, args){
  try{
    const { data, error } = await sb.rpc(nombre, args || {});
    if(error){ toast(error.message || 'No se pudo completar la acción.'); return { error }; }
    return { data };
  }catch(e){ toast('Sin conexión. Intenta de nuevo.'); return { error: e }; }
}

/* ===================== Estado ===================== */
let me = null;          // {id, email, nombre, admin}
let ALC = [];           // alcances propios [{rol, area, planta}] (el rol "vendedor" lo tiene todo usuario del módulo)
let MOTIVOS = [];       // catálogo de motivos
let RECS = [];          // reclamos que puedo ver
let NOMBRES = {};       // id de persona -> nombre (null si no se pudo resolver)
let ultimaCarga = 0;
const F = { tab: 'pend', estado: '', area: '', planta: '', q: '', anulados: false };
const labelMotivo = id => (MOTIVOS.find(m => m.id === id) || {}).nombre || id || '';
const nombreDe = id => (id && NOMBRES[id]) || '';
const COLS = 'id,folio,cliente_id,cliente_nombre,producto,producto_nombre,planta,productos,reclamante_tipo,reclamante_id,reclamante_nombre,reclamante_correo,reclamante_telefono,motivo,descripcion,fecha_recepcion,estado,area_destino,planta_destino,asesor_id,decision,compensacion,comunicado_en,cerrado_en,creado_por,creado_en,actualizado_en';

/* ===================== Sesión y acceso ===================== */
function pantallaLogin(msg){
  $('#nav').hidden = true;
  setConexion(EN_PORTAL ? '' : '<a href="./">Portal</a>');
  $('#app').innerHTML = `<form class="card gate" id="login">
    <span class="txmark">${$('.topbar .txmark').innerHTML}</span>
    <h2>Ingresar</h2>
    ${msg ? `<div class="aviso" style="margin-top:8px">${esc(msg)}</div>` : ''}
    <label>Correo</label><input id="lg-email" type="email" autocomplete="username" required>
    <label>Contraseña</label><input id="lg-pass" type="password" autocomplete="current-password" required>
    <div class="acciones"><button class="btn" id="lg-btn" type="submit">Ingresar</button></div>
    <p class="small" style="margin-top:12px">Usa el mismo correo y contraseña de las apps Grupo TX.</p>
  </form>`;
  $('#login').onsubmit = async e => {
    e.preventDefault();
    const b = $('#lg-btn'); b.disabled = true; b.textContent = 'Ingresando…';
    const { error } = await sb.auth.signInWithPassword({ email: $('#lg-email').value.trim(), password: $('#lg-pass').value });
    if(error) return pantallaLogin(/invalid/i.test(error.message) ? 'Correo o contraseña incorrectos.' : error.message);
    iniciar();
  };
}
function tarjeta(titulo, html){
  $('#nav').hidden = true;
  $('#app').innerHTML = `<div class="card gate"><h2>${titulo}</h2>${html}</div>`;
}
const botonesSalida = () => `<div class="acciones">${EN_PORTAL ? '' : '<a class="btn" href="./">Volver al portal</a>'}<button class="ghost" id="b-salir">Cerrar sesión</button></div>`;
function ligarSalida(){ const b = $('#b-salir'); if(b) b.onclick = () => sb.auth.signOut().then(() => location.reload()); }

async function iniciar(){
  setConexion('Conectando…');
  const { data: { session } } = await sb.auth.getSession();
  if(!session) return pantallaLogin();
  let prof = null, acceso = null;
  try{
    const [a, p] = await Promise.all([
      sb.rpc('rec_tengo_acceso'),
      sb.from('profiles').select('nombre,email,rol,activo').eq('id', session.user.id).maybeSingle()]);
    acceso = a; prof = p.data;
  }catch(e){ acceso = { error: e }; }
  const p = prof || {};
  me = { id: session.user.id, email: session.user.email,
         nombre: p.nombre || session.user.user_metadata?.nombre || session.user.email.split('@')[0],
         admin: !!(p.activo && p.rol === 'admin') };
  setConexion(esc(me.nombre));
  if(!acceso || acceso.error){
    tarjeta('No se pudo verificar tu acceso', `<p class="small">Revisa tu conexión e inténtalo de nuevo.</p><div class="acciones"><button class="btn" id="b-reint">Reintentar</button></div>`);
    $('#b-reint').onclick = iniciar;
    return;
  }
  if(!acceso.data){
    tarjeta('Sin acceso a Reclamos', `<p>Tu cuenta (${esc(me.email)}) todavía no tiene acceso a este módulo. Pídele al administrador que te habilite en <b>Usuarios y accesos</b>.</p>${botonesSalida()}`);
    ligarSalida();
    return;
  }
  // 2FA: si falla por red u otra razón, TMfa.gate no bloquea (ver mfa-gate.js).
  if(!(await TMfa.gate(sb, { requireEnrollment: me.admin }))) return;
  try{ await cargarBase(); await cargarReclamos(); }
  catch(e){
    tarjeta('No se pudieron cargar los datos', `<p class="small">${esc(e.message || e)}</p><div class="acciones"><button class="btn" id="b-reint">Reintentar</button></div>`);
    $('#b-reint').onclick = iniciar;
    return;
  }
  setConexion(`<a class="uchip" ${EN_PORTAL ? '' : 'href="./" title="Volver al portal"'}><span class="av">${esc(iniciales(me.nombre))}</span><span class="un"><b>${esc(me.nombre)}</b><small>${esc(rolesTxt())}</small></span></a>`);
  $('#nav').hidden = false;
  $('#nav-panel').hidden = !puedePanel(); $('#nav-accesos').hidden = !me.admin; $('#nav-motivos').hidden = !me.admin;
  $('#app').innerHTML = shell();
  ligarEventos();
  mostrar();
}
const rolesTxt = () => {
  const r = [...new Set(ALC.map(a => RC.labelDe(RC.ROLES, a.rol)))];
  return (me.admin ? ['Administrador'] : []).concat(r.length ? r : ['Vendedor']).join(' · ');
};
async function cargarBase(){
  const [al, mo] = await Promise.all([
    sb.from('rec_alcances').select('rol,area,planta').eq('usuario_id', me.id),
    sb.from('rec_motivos').select('id,nombre,requiere_producto,area_sugerida,orden,activo').order('orden')]);
  if(al.error || mo.error) throw new Error((al.error || mo.error).message);
  ALC = al.data || []; MOTIVOS = mo.data || [];
}
async function resolverNombres(ids){
  const falta = [...new Set(ids.filter(x => x && !(x in NOMBRES)))];
  for(let i = 0; i < falta.length; i += 200){
    const lote = falta.slice(i, i + 200);
    const { data } = await sb.rpc('rec_nombres', { p_ids: lote });
    (data || []).forEach(p => { NOMBRES[p.id] = p.nombre; });
    lote.forEach(id => { if(!(id in NOMBRES)) NOMBRES[id] = null; });
  }
}
// PostgREST entrega 1000 filas por página: se pide por páginas (hasta 20) con un orden estable.
async function traerTodo(tabla, cols, orden, asc){
  const out = [];
  for(let p = 0; p < 20; p++){
    const { data, error } = await sb.from(tabla).select(cols).order(orden, { ascending: asc }).order('id', { ascending: true }).range(p * 1000, p * 1000 + 999);
    if(error) throw new Error(error.message);
    out.push(...(data || []));
    if(!data || data.length < 1000) break;
  }
  return out;
}
async function cargarReclamos(){
  RECS = await traerTodo('rec_reclamos', COLS, 'creado_en', false);
  PAN.ev = null;   // los eventos del panel (tiempos por etapa) se vuelven a pedir cuando cambian los reclamos
  try{ await resolverNombres(RECS.flatMap(r => [r.asesor_id, r.creado_por])); }catch(e){ /* los nombres son accesorios */ }
  ultimaCarga = Date.now();
}

/* ===================== Estructura y rutas ===================== */
function shell(){
  return `<section data-v="bandeja" id="v-bandeja" hidden></section>
  <section data-v="nuevo" id="v-nuevo" hidden></section>
  <section data-v="detalle" id="v-detalle" hidden></section>
  <section data-v="panel" id="v-panel" hidden></section>
  <section data-v="accesos" id="v-accesos" hidden></section>
  <section data-v="motivos" id="v-motivos" hidden></section>`;
}
const puedePanel = () => me.admin || ALC.some(a => a.rol === 'gerencia');
function ligarEventos(){
  $('#nav').onclick = e => { const b = e.target.closest('button[data-v]'); if(b) location.hash = b.dataset.v; };
  addEventListener('hashchange', mostrar);
}
function ruta(){
  const h = location.hash.replace(/^#/, '');
  if(h.startsWith('r/')) return { v: 'detalle', id: h.slice(2) };
  if(h === 'nuevo') return { v: h };
  if(h === 'panel' && puedePanel()) return { v: h };
  if((h === 'accesos' || h === 'motivos') && me.admin) return { v: h };
  return { v: 'bandeja' };
}
function mostrar(){
  if(!me || !$('#v-bandeja')) return;
  const r = ruta();
  document.querySelectorAll('[data-v]').forEach(el => {
    if(el.tagName === 'SECTION') el.hidden = el.dataset.v !== r.v;
    else el.classList.toggle('on', el.dataset.v === (r.v === 'detalle' ? 'bandeja' : r.v));
  });
  window.scrollTo(0, 0);
  if(r.v === 'bandeja') renderBandeja();
  else if(r.v === 'nuevo') renderNuevo($('#v-nuevo'));
  else if(r.v === 'panel') renderPanel($('#v-panel'));
  else if(r.v === 'accesos') renderAccesos($('#v-accesos'));
  else if(r.v === 'motivos') renderMotivos($('#v-motivos'));
  else renderDetalle($('#v-detalle'), r.id);
}

/* ===================== Bandeja ===================== */
function visibles(){
  const q = F.q.trim().toLowerCase();
  let rs = RECS.filter(r => {
    if(F.tab === 'pend' && !RC.pendienteDeMi(r, ALC, me.admin, me.id)) return false;
    if(F.tab === 'info' && !RC.esInformado(r, ALC)) return false;
    if(r.estado === 'anulado' && !F.anulados && F.estado !== 'anulado') return false;
    if(F.estado && r.estado !== F.estado) return false;
    if(F.area && r.area_destino !== F.area) return false;
    if(F.planta && (r.planta_destino || r.planta) !== F.planta) return false;
    if(q){
      const hay = [r.folio, r.cliente_nombre, r.producto_nombre, r.producto, r.descripcion, labelMotivo(r.motivo)].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  // Los pendientes van del más antiguo al más nuevo (lo que lleva más tiempo esperando, primero).
  if(F.tab === 'pend') rs = rs.slice().sort((a, b) => String(a.fecha_recepcion).localeCompare(String(b.fecha_recepcion)));
  return rs;
}
function antiguedad(r){
  const fin = r.comunicado_en ? RC.diaCL(r.comunicado_en) : hoyCL();
  const ini = String(r.fecha_recepcion).slice(0, 10);
  return Math.max(0, RC.fechaValida(ini) && fin ? RC.diasEntre(ini, fin) : 0);
}
function responsable(r){
  switch(r.estado){
    case 'ingresado': return 'Servicio al cliente · por derivar';
    case 'derivado': return RC.labelDe(RC.AREAS, r.area_destino) + (r.planta_destino ? ' · ' + RC.labelDe(RC.PLANTAS, r.planta_destino) : '');
    case 'en_verificacion': return 'Asesor técnico · ' + (nombreDe(r.asesor_id) || 'sin nombre');
    case 'aprobado': case 'rechazado': case 'solucion_definida': case 'comunicado': return 'Servicio al cliente';
    default: return '';
  }
}
function filaRec(r){
  const d = antiguedad(r), abierto = !['comunicado', 'cerrado', 'anulado'].includes(r.estado);
  const plt = r.planta_destino || r.planta;
  const pendiente = F.tab !== 'pend' && RC.pendienteDeMi(r, ALC, me.admin, me.id);
  return `<a class="rec est-${esc(r.estado)}" href="#r/${esc(r.id)}">
    <div class="rec-top"><b class="folio">${esc(r.folio)}</b><span class="est est-${esc(r.estado)}">${esc(RC.labelDe(RC.ESTADOS, r.estado))}</span>${pendiente ? '<span class="pend">Pendiente de ti</span>' : ''}<span class="edad${abierto && d >= 7 ? ' alta' : ''}" title="Días desde la recepción">${d} d</span></div>
    <div class="rec-cli">${esc(r.cliente_nombre || 'Cliente sin nombre')}</div>
    <div class="rec-mot"><span>${esc(labelMotivo(r.motivo))}</span>${r.producto_nombre ? `<span>· ${esc(r.producto_nombre)}</span>` : ''}${plt ? `<span class="plt">${esc(RC.labelDe(RC.PLANTAS, plt))}</span>` : ''}</div>
    <div class="rec-resp"><span>${esc(responsable(r))}</span><span>· Recibido ${esc(fechaCorta(r.fecha_recepcion))}</span></div>
  </a>`;
}
function listaHtml(){
  const rs = visibles();
  if(rs.length) return `<div class="lista">${rs.map(filaRec).join('')}</div>`;
  if(!RECS.length) return `<div class="card sin"><b>Aún no hay reclamos.</b><br><span class="small">Cuando se ingrese uno aparecerá aquí.</span><div class="acciones" style="justify-content:center"><button class="btn" data-ir="nuevo">Nuevo reclamo</button></div></div>`;
  const hayFiltro = F.estado || F.area || F.planta || F.q.trim() || F.anulados;
  if(F.tab === 'pend' && !hayFiltro) return `<div class="card sin"><b>No tienes reclamos pendientes.</b><br><span class="small">Lo que dependa de ti aparecerá aquí.</span></div>`;
  if(F.tab === 'info' && !hayFiltro) return `<div class="card sin"><b>No hay reclamos de calidad en tu planta.</b></div>`;
  return `<div class="card sin"><b>Ningún reclamo coincide con los filtros.</b><div class="acciones" style="justify-content:center"><button class="ghost" data-limpiar>Quitar filtros</button></div></div>`;
}
function renderBandeja(){
  const el = $('#v-bandeja');
  const nPend = RECS.filter(r => RC.pendienteDeMi(r, ALC, me.admin, me.id)).length;
  const nInfo = RECS.filter(r => RC.esInformado(r, ALC)).length;
  const conInfo = ALC.some(a => a.rol === 'encargado_calidad');
  if(!conInfo && F.tab === 'info') F.tab = 'pend';
  const opt = (lista, v) => lista.map(x => `<option value="${esc(x.id)}"${x.id === v ? ' selected' : ''}>${esc(x.label)}</option>`).join('');
  el.innerHTML = `
    <div class="subtabs" id="subtabs">
      <button data-tab="pend" class="${F.tab === 'pend' ? 'on' : ''}">Pendientes de mí${nPend ? `<span class="n">${nPend}</span>` : ''}</button>
      <button data-tab="todos" class="${F.tab === 'todos' ? 'on' : ''}">Todos los que puedo ver<span class="n" style="background:var(--sunk);color:var(--mute)">${RECS.filter(r => r.estado !== 'anulado').length}</span></button>
      ${conInfo ? `<button data-tab="info" class="${F.tab === 'info' ? 'on' : ''}">Informados${nInfo ? `<span class="n" style="background:var(--sunk);color:var(--mute)">${nInfo}</span>` : ''}</button>` : ''}
    </div>
    <div class="filtros">
      <input type="search" id="f-q" placeholder="Buscar por folio, cliente, producto o texto" value="${esc(F.q)}" aria-label="Buscar">
      <select id="f-estado" aria-label="Estado"><option value="">Todos los estados</option>${opt(RC.ESTADOS, F.estado)}</select>
      <select id="f-area" aria-label="Área"><option value="">Todas las áreas</option>${opt(RC.AREAS, F.area)}</select>
      <select id="f-planta" aria-label="Planta"><option value="">Todas las plantas</option>${opt(RC.PLANTAS, F.planta)}</select>
      <label><input type="checkbox" id="f-anul"${F.anulados ? ' checked' : ''}> Ver anulados</label>
      <button class="ghost btn sm" id="f-act" title="Volver a cargar los reclamos">Actualizar</button>
    </div>
    <div id="lista">${listaHtml()}</div>`;
  $('#subtabs').onclick = e => { const b = e.target.closest('button[data-tab]'); if(b){ F.tab = b.dataset.tab; renderBandeja(); } };
  $('#f-q').oninput = e => { F.q = e.target.value; refrescarLista(); };
  $('#f-estado').onchange = e => { F.estado = e.target.value; refrescarLista(); };
  $('#f-area').onchange = e => { F.area = e.target.value; refrescarLista(); };
  $('#f-planta').onchange = e => { F.planta = e.target.value; refrescarLista(); };
  $('#f-anul').onchange = e => { F.anulados = e.target.checked; refrescarLista(); };
  $('#f-act').onclick = async () => { const b = $('#f-act'); b.disabled = true; try{ await cargarReclamos(); }catch(e){ toast('No se pudo actualizar: ' + (e.message || e)); } renderBandeja(); };
  if(Date.now() - ultimaCarga > 30000) recargarSilencioso();
}
function refrescarLista(){
  $('#lista').innerHTML = listaHtml();
  ligarListaAcciones();
}
function ligarListaAcciones(){
  const lim = $('#lista [data-limpiar]');
  if(lim) lim.onclick = () => { Object.assign(F, { estado: '', area: '', planta: '', q: '', anulados: false }); renderBandeja(); };
  const ir = $('#lista [data-ir]');
  if(ir) ir.onclick = () => { location.hash = ir.dataset.ir; };
}
// Al volver a la bandeja con datos viejos, se recarga sin molestar y se redibuja si no se está escribiendo.
async function recargarSilencioso(){
  ultimaCarga = Date.now();
  try{ await cargarReclamos(); }catch(e){ return; }
  const el = $('#v-bandeja');
  if(el && !el.hidden && document.activeElement?.id !== 'f-q') renderBandeja();
}

/* ===================== Utilidades de formularios, buscadores y archivos ===================== */
const fechaHora = s => {
  if(!s) return ''; const d = new Date(s); if(isNaN(d.getTime())) return '';
  return d.toLocaleString('es-CL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'America/Santiago' }).replace(/\./g, '');
};
const optList = (lista, sel, vacio) => (vacio ? `<option value="">${esc(vacio)}</option>` : '') + lista.map(x => `<option value="${esc(x.id)}"${x.id === sel ? ' selected' : ''}>${esc(x.label || x.nombre)}</option>`).join('');
const CAMPOS_DATOS = [['obra', 'Obra'], ['direccion', 'Dirección'], ['contacto', 'Contacto (nombre y teléfono)'], ['lote', 'Lote'], ['factura_guia', 'Factura o guía'], ['cantidad', 'Cantidad afectada']];
const CANALES = ['Correo', 'WhatsApp', 'Teléfono', 'Presencial', 'Otro'];
const sinTildes = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const noEnter = e => { if(e.key === 'Enter') e.preventDefault(); };

let PRODS = null;
async function cargarProductos(){
  if(PRODS) return PRODS;
  const { data, error } = await sb.rpc('rec_productos');
  if(error) throw new Error(error.message);
  return (PRODS = data || []);
}
// Enlaces mailto:/tel: solo con caracteres permitidos (teléfono: dígitos y +; correo: el correo recortado y con formato válido).
const RE_CORREO = RC.RE_CORREO;
const hrefTel = s => { const v = String(s == null ? '' : s).replace(/[^\d+]/g, ''); return v ? 'tel:' + v : ''; };
const hrefMail = s => { const v = String(s == null ? '' : s).trim(); return RE_CORREO.test(v) ? 'mailto:' + encodeURIComponent(v).replace(/%40/g, '@') : ''; };
const contactoReclamante = r => [r.reclamante_nombre, r.reclamante_correo, r.reclamante_telefono].filter(Boolean).join(' · ');
// Reclamante tal como lo recibe la base (el id solo existe para el vendedor).
const armarReclamante = x => ({ tipo: x.tipo, id: x.tipo === 'vendedor' ? (x.id || null) : null, nombre: String(x.nombre || '').trim(), correo: String(x.correo || '').trim(), telefono: String(x.telefono || '').trim() });

// Lista de productos del reclamo (máx. 10, sin repetidos): chips con ✕ y un buscador sobre el catálogo para agregar. alCambiar(lista).
function montarListaProductos(el, inicial, alCambiar){
  let lista = (inicial || []).filter(Boolean).map(p => ({ code: p.code, nombre: p.nombre, planta: p.planta }));
  const pintar = (enfocar) => {
    const lleno = lista.length >= RC.MAX_PRODUCTOS;
    el.innerHTML = (lista.length ? `<div class="chips2">${lista.map((p, i) => `<span class="chip2"><span>${esc(p.nombre)}<small>${esc(p.code)}${p.planta ? ' · Planta ' + esc(RC.labelDe(RC.PLANTAS, p.planta)) : ''}</small></span><button type="button" data-q="${i}" aria-label="Quitar ${esc(p.nombre)}">✕</button></span>`).join('')}</div>` : '')
      + (lleno ? `<div class="hint">Máximo ${RC.MAX_PRODUCTOS} productos por reclamo.</div>`
        : `<input type="search" placeholder="${lista.length ? 'Agregar otro producto' : 'Buscar producto por nombre o código'}" autocomplete="off" aria-label="Buscar producto"><div class="opts"></div>`);
    el.querySelectorAll('[data-q]').forEach(b => { b.onclick = () => { lista.splice(Number(b.dataset.q), 1); alCambiar(lista.slice()); pintar(); }; });
    const inp = el.querySelector('input'); if(!inp) return;
    const ops = el.querySelector('.opts');
    if(enfocar) inp.focus();
    inp.onkeydown = noEnter;
    inp.oninput = async () => {
      const q = sinTildes(inp.value).trim();
      if(q.length < 2){ ops.innerHTML = ''; return; }
      let cat;
      try{ cat = await cargarProductos(); }catch(e){ ops.innerHTML = '<div class="hint">No se pudo cargar el catálogo de productos.</div>'; return; }
      const rs = cat.filter(p => !lista.some(x => x.code === p.code) && sinTildes(p.nombre + ' ' + p.code).includes(q)).slice(0, 8);
      ops.innerHTML = rs.length ? rs.map((p, i) => `<button type="button" class="opt" data-i="${i}"><span>${esc(p.nombre)}<small>${esc(p.code)}</small></span><span class="plt">${esc(RC.labelDe(RC.PLANTAS, p.planta))}</span></button>`).join('') : '<div class="hint">Ningún producto coincide.</div>';
      ops.querySelectorAll('button.opt').forEach(b => { b.onclick = () => { const p = rs[Number(b.dataset.i)]; lista.push({ code: p.code, nombre: p.nombre, planta: p.planta }); alCambiar(lista.slice()); pintar(true); }; });
    };
  };
  pintar();
}
// Vendedores activos (se piden una vez). nombre vacío -> se muestra el correo.
let VENDEDORES = null;
async function cargarVendedores(){
  if(VENDEDORES) return VENDEDORES;
  const { data, error } = await sb.rpc('rec_vendedores');
  if(error) throw new Error(error.message);
  return (VENDEDORES = (data || []).map(v => ({ id: v.id, nombre: v.nombre || v.email || '', correo: v.email || '', telefono: v.telefono || '' })));

// Quién reclama: Vendedor (se elige de la lista; nombre y correo de solo lectura, teléfono editable) o Cliente (tres campos libres).
// propio: preselecciona al usuario si está en la lista. alCambiar({tipo,id,nombre,correo,telefono}).
function montarReclamante(el, inicial, alCambiar, propio){
  const ini = inicial || {};
  const S = { tipo: ini.tipo || 'vendedor', id: ini.id || '', nombre: ini.nombre || '', correo: ini.correo || '', telefono: ini.telefono || '' };
  let lista = null, fallo = false;
  const avisar = () => alCambiar(Object.assign({}, S));
  const campos = () => {
    const c = el.querySelector('#rc-campos');
    const tel = `<label for="rc-tel">Teléfono <small>(opcional)</small></label><input id="rc-tel" maxlength="30" inputmode="tel" autocomplete="off" value="${esc(S.telefono)}">`;
    if(S.tipo === 'vendedor'){
      if(lista === null && !fallo){ c.innerHTML = '<div class="hint">Cargando vendedores…</div>'; return; }
      if(fallo){ c.innerHTML = '<div class="hint">No se pudo cargar la lista de vendedores. Puedes ingresar los datos con «Cliente».</div>'; return; }
      const fuera = S.id && !lista.some(v => v.id === S.id);
      c.innerHTML = `<label for="rc-vend">Vendedor</label><select id="rc-vend"><option value="">Elige el vendedor</option>${fuera ? `<option value="${esc(S.id)}" selected>${esc(S.nombre || S.correo)}</option>` : ''}${lista.map(v => `<option value="${esc(v.id)}"${v.id === S.id ? ' selected' : ''}>${esc(v.nombre)}</option>`).join('')}</select>
        <div class="fila2"><div><label for="rc-nom">Nombre</label><input id="rc-nom" readonly tabindex="-1" maxlength="200" value="${esc(S.nombre)}"></div><div><label for="rc-cor">Correo</label><input id="rc-cor" readonly tabindex="-1" maxlength="200" value="${esc(S.correo)}"></div></div>${tel}`;
      c.querySelector('#rc-vend').onchange = e => {
        const v = lista.find(x => x.id === e.target.value);
        Object.assign(S, v ? { id: v.id, nombre: v.nombre, correo: v.correo, telefono: v.telefono } : { id: '', nombre: '', correo: '', telefono: '' });
        campos(); avisar();
      };
    }else{
      c.innerHTML = `<label for="rc-nom">Nombre de quien reclama</label><input id="rc-nom" maxlength="200" autocomplete="off" value="${esc(S.nombre)}">
        <div class="fila2"><div><label for="rc-cor">Correo</label><input id="rc-cor" type="email" maxlength="200" autocomplete="off" value="${esc(S.correo)}"></div><div>${tel}</div></div>`;
      c.querySelector('#rc-nom').oninput = e => { S.nombre = e.target.value; avisar(); };
      c.querySelector('#rc-cor').oninput = e => { S.correo = e.target.value; avisar(); };
    }
    c.querySelector('#rc-tel').oninput = e => { S.telefono = e.target.value; avisar(); };
    c.querySelectorAll('input').forEach(i => { i.onkeydown = noEnter; });
  };
  el.innerHTML = `<div class="radios">${RC.RECLAMANTES.map(t => `<label><input type="radio" name="rc-tipo" value="${esc(t.id)}"${S.tipo === t.id ? ' checked' : ''}> ${esc(t.label)}</label>`).join('')}</div><div id="rc-campos"></div>`;
  el.querySelectorAll('input[name=rc-tipo]').forEach(r => { r.onchange = () => {
    if(!r.checked || S.tipo === r.value) return;
    Object.assign(S, { tipo: r.value, id: '', nombre: '', correo: '', telefono: '' }); campos(); avisar();
  }; });
  campos();
  cargarVendedores().then(l => {
    lista = l;
    if(propio && S.tipo === 'vendedor' && !S.id){
      const yo = l.find(v => v.id === me.id);
      if(yo){ Object.assign(S, { id: yo.id, nombre: yo.nombre, correo: yo.correo, telefono: yo.telefono }); avisar(); }
    }
    campos();
  }).catch(() => { fallo = true; toast('No se pudo cargar la lista de vendedores. Puedes ingresar al reclamante como Cliente.'); campos(); });
}
// Buscador de cliente (la base devuelve hasta 20 coincidencias por nombre, razón social o RUT).
function montarBuscadorCliente(el, alElegir){
  let elegido = null, t = null, seq = 0;
  const pintar = () => {
    if(elegido){
      el.innerHTML = `<div class="chosen"><span><b>${esc(elegido.nombre)}</b><br><small>${esc([elegido.rut, elegido.comuna].filter(Boolean).join(' · '))}</small></span><button type="button" class="ghost btn sm" data-cambiar>Cambiar</button></div>`;
      el.querySelector('[data-cambiar]').onclick = () => { elegido = null; alElegir(null); pintar(); };
      return;
    }
    el.innerHTML = `<input type="search" placeholder="Buscar cliente por nombre o RUT" autocomplete="off" aria-label="Buscar cliente"><div class="opts"></div>`;
    const inp = el.querySelector('input'), ops = el.querySelector('.opts');
    inp.onkeydown = noEnter;
    inp.oninput = () => {
      clearTimeout(t);
      const q = inp.value.trim();
      if(q.length < 2){ ops.innerHTML = ''; return; }
      t = setTimeout(async () => {
        const mi = ++seq; ops.innerHTML = '<div class="hint">Buscando…</div>';
        const { data, error } = await rpc('rec_buscar_clientes', { p_q: q });
        if(mi !== seq) return;
        if(error){ ops.innerHTML = ''; return; }
        const rs = data || [];
        ops.innerHTML = rs.length
          ? rs.map((c, i) => `<button type="button" class="opt" data-i="${i}"><span>${esc(c.nombre)}<small>${esc([c.rut, c.comuna].filter(Boolean).join(' · '))}</small></span></button>`).join('') + (rs.length >= 20 ? '<div class="small">Se muestran 20: escribe más para afinar.</div>' : '')
          : '<div class="hint">Ningún cliente coincide. Revisa el nombre o el RUT.</div>';
        ops.querySelectorAll('button.opt').forEach(b => { b.onclick = () => { elegido = rs[Number(b.dataset.i)]; alElegir(elegido); pintar(); }; });
      }, 250);
    };
  };
  pintar();
}
// Las fotos se reducen en el celular (máx. 1600 px, JPEG) antes de subir: ahorran datos y caben en el límite de 10 MB.
async function comprimirImagen(file){
  try{
    if(!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.82));
    return blob || file;
  }catch(e){ return file; }
}
// Sube a reclamos/<id>/<uuid>.<ext> y lo registra con rec_adjuntar. Devuelve cuántos fallaron.
async function subirArchivos(id, files){
  let fallos = 0;
  for(const f of files){
    try{
      const esPdf = f.type === 'application/pdf';
      const blob = esPdf ? f : await comprimirImagen(f);
      if(blob.size > 10 * 1024 * 1024) throw new Error('Archivo de más de 10 MB');
      const ct = blob.type || f.type;
      const ext = esPdf ? 'pdf' : (ct === 'image/png' ? 'png' : ct === 'image/webp' ? 'webp' : 'jpg');
      const ruta = `${id}/${crypto.randomUUID()}.${ext}`;
      const up = await sb.storage.from('reclamos').upload(ruta, blob, { contentType: ct, upsert: false });
      if(up.error) throw up.error;
      const r = await sb.rpc('rec_adjuntar', { p_id: id, p_tipo: esPdf ? 'informe' : 'foto', p_ruta: ruta });
      if(r.error) throw r.error;
    }catch(e){ fallos++; }
  }
  return fallos;
}

/* ===================== Diálogos ===================== */
function cerrarDialogo(){ const o = $('#dlg'); if(o){ document.removeEventListener('keydown', o._esc); o.remove(); } }
// alEnviar(form) devuelve un texto de error (el diálogo sigue abierto) o nada (se cierra).
function abrirDialogo({ titulo, html, confirmar = 'Guardar', peligro = false, alAbrir, alEnviar }){
  cerrarDialogo();
  const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'dlg';
  ov.innerHTML = `<form class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t" novalidate><h2 id="dlg-t">${esc(titulo)}</h2><div>${html}</div><div class="dlg-err" id="dlg-err" hidden></div><div class="acciones"><button type="button" class="ghost" id="dlg-x">Cancelar</button><button type="submit" class="btn${peligro ? ' peligro' : ''}" id="dlg-ok">${esc(confirmar)}</button></div></form>`;
  document.body.appendChild(ov);
  const f = ov.querySelector('form'), ok = ov.querySelector('#dlg-ok'), err = ov.querySelector('#dlg-err');
  ov.querySelector('#dlg-x').onclick = cerrarDialogo;
  ov.addEventListener('mousedown', e => { if(e.target === ov) cerrarDialogo(); });
  ov._esc = e => { if(e.key === 'Escape') cerrarDialogo(); };
  document.addEventListener('keydown', ov._esc);
  let enviando = false;
  f.onsubmit = async e => {
    e.preventDefault(); if(enviando) return;
    enviando = true; err.hidden = true; ok.disabled = true; const txt = ok.textContent; ok.textContent = 'Enviando…';
    try{
      const msg = await alEnviar(f);
      if(msg){ err.textContent = msg; err.hidden = false; } else { cerrarDialogo(); return; }
    }catch(x){ err.textContent = (x && x.message) || 'No se pudo completar la acción.'; err.hidden = false; }
    enviando = false; ok.disabled = false; ok.textContent = txt;
  };
  if(alAbrir) alAbrir(f);
  const p = f.querySelector('input:not([type=hidden]):not([type=radio]),select,textarea,input[type=radio]'); if(p) p.focus();
}

async function enviarNuevo(e){

  enviandoNuevo = true;
  const ok = $('#n-ok'); ok.disabled = true; ok.textContent = 'Ingresando…';
  try{

      p_descripcion: form.descripcion.trim(), p_fecha_recepcion: form.fecha_recepcion, p_datos: datos, p_reclamante: form.reclamante });

    const rr = RECS.find(r => r.id === id);

    location.hash = '#r/' + id;
  }catch(x){ err.textContent = 'Sin conexión. Revisa e intenta de nuevo; lo que escribiste sigue aquí.'; err.hidden = false; }
  finally{ enviandoNuevo = false; ok.disabled = false; ok.textContent = 'Ingresar reclamo'; }
}

async function cargarMiniaturas(){
  const mi = DET; if(!mi || !mi.ad.length) return;
  for(let i = 0; i < mi.ad.length; i++){
    const a = mi.ad[i];
    try{
      const { data, error } = await sb.storage.from('reclamos').download(a.ruta);
      if(error || !data || DET !== mi) continue;
      const url = URL.createObjectURL(data); mi.urls.push(url);
      const tile = document.querySelector(`#d-fotos [data-i="${i}"]`); if(!tile) continue;
      const esPdf = /\.pdf$/i.test(a.ruta);
      tile.outerHTML = esPdf ? `<a href="${url}" target="_blank" rel="noopener">Informe PDF</a>` : `<a href="${url}" target="_blank" rel="noopener" title="Abrir"><img src="${url}" alt="Foto del reclamo"></a>`;
    }catch(e){ /* queda el recuadro */ }
  }
}

// Llama a la función de la base con el token de versión de la pantalla (si el reclamo cambió, la base lo rechaza).
async function llamar(r, nombre, args){
  try{
    const { error } = await sb.rpc(nombre, Object.assign({ p_id: r.id }, args, { p_version: r.actualizado_en }));
    if(error){
      // Sea cual sea el error, la pantalla de fondo se refresca para mostrar el estado real. Si el reclamo cambió mientras
      // se miraba, el diálogo sigue abierto (el texto escrito no se pierde) y toma la versión nueva: quien lo envía otra vez
      // ya vio el aviso y el estado actualizado, y la base vuelve a validar estado y permisos.
      const conflicto = /modificad|ya cambió/i.test(error.message);
      await recargarDetalle();
      if(conflicto && DET && DET.r && DET.r.id === r.id){
        r.actualizado_en = DET.r.actualizado_en;
        return error.message + ' Se actualizó la pantalla de fondo: revísala y, si todavía corresponde, vuelve a enviar.';
      }
      return error.message;
    }
    return null;
  }catch(e){ return 'Sin conexión. Intenta de nuevo.'; }
}
async function tras(msg){ toast(msg); try{ await cargarReclamos(); }catch(e){ /* se recarga al volver a la bandeja */ } await recargarDetalle(); }

// ¿Cambió el reclamante respecto del guardado? (el vendedor se compara por id y teléfono: nombre y correo salen del perfil)
function reclamanteCambio(x, r){
  const t = v => String(v || '').trim();
  if(!r.reclamante_tipo) return x.tipo === 'vendedor' ? !!(t(x.id) || t(x.telefono)) : !!(t(x.nombre) || t(x.correo) || t(x.telefono));
  if(x.tipo !== r.reclamante_tipo || t(x.telefono) !== t(r.reclamante_telefono)) return true;
  return x.tipo === 'vendedor' ? t(x.id) !== t(r.reclamante_id) : t(x.nombre) !== t(r.reclamante_nombre) || t(x.correo) !== t(r.reclamante_correo);
}
// ¿La lista de productos cambió? (antes: productos guardados; despues: códigos; el orden cuenta)
const productosCambiaron = (antes, despues) => despues.length !== antes.length || despues.some((c, i) => c !== antes[i].code);
function dlgDatos(r){
  const sc = esServicio();
  const ini = RC.productosDe(r);
  const rec0 = { tipo: r.reclamante_tipo || 'vendedor', id: r.reclamante_id || '', nombre: r.reclamante_nombre || '', correo: r.reclamante_correo || '', telefono: r.reclamante_telefono || '' };
  let prods = ini.slice(), rec = Object.assign({}, rec0);
  abrirDialogo({ titulo: 'Completar datos', confirmar: 'Guardar',
    html: (sc ? '<label>Productos</label><div id="dd-prod"></div><label>Reclamante</label><div id="dd-rec"></div>' : '') +
      `<div class="fila2">${CAMPOS_DATOS.map(([k, l]) => `<div><label>${esc(l)}</label><input name="d_${k}" maxlength="200" value="${esc((r.datos || {})[k] || '')}"></div>`).join('')}</div>`,
    alAbrir: () => { if(sc){ montarListaProductos($('#dd-prod'), ini, l => { prods = l; }); montarReclamante($('#dd-rec'), rec0, x => { rec = x; }); } },
    alEnviar: async f => {
      const datos = {}; let cambios = 0;
      for(const [k] of CAMPOS_DATOS){ const v = f.elements['d_' + k].value.trim(), antes = String((r.datos || {})[k] || ''); if(v !== antes){ datos[k] = v; cambios++; } }
      const codigos = prods.map(p => p.code).filter(Boolean);
      const prodCambio = sc && productosCambiaron(ini, codigos);
      const recCambio = sc && reclamanteCambio(rec, r);
      if(!prodCambio && !recCambio && !cambios) return 'No hay cambios que guardar.';
      if(prodCambio && !codigos.length) return 'Indica al menos un producto.';
      if(recCambio){ const e = RC.validarReclamante(armarReclamante(rec)); if(e.length) return e.join(' '); }
      const msg = await llamar(r, 'rec_actualizar', { p_productos: prodCambio ? codigos : null, p_datos: cambios ? datos : null, p_reclamante: recCambio ? armarReclamante(rec) : null });
      if(msg) return msg; await tras('Datos guardados.');
    } });
}

let PAN = { ev: null, f: { preset: '90', desde: '', hasta: '', area: '', planta: '', motivo: '', producto: '' } };
function rangoPreset(p){
  const hoy = hoyCL();
  if(p === 'todo') return { desde: '', hasta: '' };
  if(p === 'mes') return { desde: hoy.slice(0, 8) + '01', hasta: hoy };
  if(p === 'anio') return { desde: hoy.slice(0, 5) + '01-01', hasta: hoy };
  const d = new Date(Date.parse(hoy + 'T12:00:00Z') - Number(p) * 86400000).toISOString().slice(0, 10);
  return { desde: d, hasta: hoy };
}
async function renderPanel(el){
  el.innerHTML = '<div class="card sin">Cargando…</div>';
  try{
    if(Date.now() - ultimaCarga > 60000) await cargarReclamos();
    if(!PAN.ev) PAN.ev = await traerTodo('rec_eventos', 'id,reclamo_id,tipo,a_estado,creado_en', 'id', true);
  }catch(e){
    el.innerHTML = `<div class="card sin">No se pudo cargar el panel.<br><span class="small">${esc(e.message || e)}</span><div class="acciones" style="justify-content:center"><button class="btn" id="p-reint">Reintentar</button></div></div>`;
    $('#p-reint').onclick = () => { PAN.ev = null; renderPanel(el); };
    return;
  }
  if(!PAN.f.desde && !PAN.f.hasta && PAN.f.preset !== 'todo' && PAN.f.preset !== 'custom') Object.assign(PAN.f, rangoPreset(PAN.f.preset));
  pintarPanel(el);
}
function filtrarPanel(){
  const f = PAN.f;
  return RECS.filter(r => (!f.area || r.area_destino === f.area) && (!f.planta || (r.planta_destino || r.planta) === f.planta) && (!f.motivo || r.motivo === f.motivo) && (!f.producto || r.producto === f.producto));
}
function pintarPanel(el){
  const f = PAN.f, per = { desde: f.desde, hasta: f.hasta };
  const base = filtrarPanel();
  const m = RC.metricas(base, PAN.ev, per);
  const productos = [...new Map(RECS.filter(r => r.producto).map(r => [r.producto, r.producto_nombre || r.producto])).entries()].sort((a, b) => a[1].localeCompare(b[1]));
  const nomProd = c => (productos.find(p => p[0] === c) || [c, c])[1];
  const dias = x => (x == null ? '—' : String(x).replace('.', ',') + ' d');
  const filas = (conteo, costo, etiqueta) => Object.keys(conteo).map(k => ({ k, n: conteo[k], c: costo[k] == null ? null : costo[k] }))
    .sort((a, b) => (b.c || 0) - (a.c || 0) || b.n - a.n).slice(0, 25)
    .map(o => `<tr><td>${esc(etiqueta(o.k))}</td><td class="num">${o.n}</td><td class="num">${o.c == null ? '—' : esc(clp(o.c))}</td></tr>`).join('');
  const tabla = (titulo, conteo, costo, etiqueta) => `<div class="card"><h3>${esc(titulo)}</h3>${Object.keys(conteo).length ? `<table class="tbl"><thead><tr><th></th><th class="num">Reclamos</th><th class="num">Costo</th></tr></thead><tbody>${filas(conteo, costo, etiqueta)}</tbody></table>` : '<p class="small">Sin datos en el período.</p>'}</div>`;
  const opt = (lista, v, vacio) => `<option value="">${esc(vacio)}</option>` + lista.map(x => `<option value="${esc(x.id)}"${x.id === v ? ' selected' : ''}>${esc(x.label || x.nombre)}</option>`).join('');
  const et = m.etapasDias;
  el.innerHTML = `
    <div class="filtros">
      <select id="p-preset" aria-label="Período">${[['30', 'Últimos 30 días'], ['90', 'Últimos 90 días'], ['mes', 'Este mes'], ['anio', 'Este año'], ['todo', 'Todo'], ['custom', 'Personalizado']].map(([v, l]) => `<option value="${v}"${f.preset === v ? ' selected' : ''}>${l}</option>`).join('')}</select>
      <label>Desde <input type="date" id="p-desde" value="${esc(f.desde)}"${f.preset !== 'custom' ? ' disabled' : ''}></label>
      <label>Hasta <input type="date" id="p-hasta" value="${esc(f.hasta)}"${f.preset !== 'custom' ? ' disabled' : ''}></label>
      <select id="p-area" aria-label="Área">${opt(RC.AREAS, f.area, 'Todas las áreas')}</select>
      <select id="p-planta" aria-label="Planta">${opt(RC.PLANTAS, f.planta, 'Todas las plantas')}</select>
      <select id="p-motivo" aria-label="Motivo">${opt(MOTIVOS, f.motivo, 'Todos los motivos')}</select>
      <select id="p-prod" aria-label="Producto"><option value="">Todos los productos</option>${productos.map(([c, n]) => `<option value="${esc(c)}"${c === f.producto ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <button class="ghost btn sm" id="p-act">Actualizar</button>
      <button class="ghost btn sm" id="p-csv">Exportar CSV</button>
    </div>
    <div class="kpis">
      <div class="kpi"><small>Reclamos</small><b>${m.total}</b><span>sin contar anulados</span></div>
      <div class="kpi"><small>Abiertos</small><b>${m.abiertos}</b><span>aún sin cerrar</span></div>
      <div class="kpi"><small>Costo de compensaciones</small><b>${esc(clp(m.costoTotal))}</b><span>solo con solución definida</span></div>
      <div class="kpi"><small>Tiempo de respuesta</small><b>${dias(m.respuestaDias.promedio)}</b><span>mediana ${dias(m.respuestaDias.mediana)} · ${m.respuestaDias.n} comunicados</span></div>
    </div>
    <div class="cols">
      <div>
        ${tabla('Por motivo', m.porMotivo, m.costoPorMotivo, k => labelMotivo(k))}
        ${tabla('Por área', m.porArea, m.costoPorArea, k => (k === 'sin_area' ? 'Sin derivar' : RC.labelDe(RC.AREAS, k)))}
        ${tabla('Por planta', m.porPlanta, m.costoPorPlanta, k => RC.labelDe(RC.PLANTAS, k))}
      </div>
      <div>
        <div class="card"><h3>Tiempo por etapa</h3>
          <table class="tbl"><tbody>
            <tr><td>Ingresado → derivado</td><td class="num">${dias(et.ingresado_derivado)}</td></tr>
            <tr><td>Derivado → decisión</td><td class="num">${dias(et.derivado_decision)}</td></tr>
            <tr><td>Decisión → solución definida</td><td class="num">${dias(et.decision_solucion)}</td></tr>
            <tr><td>Solución → comunicado</td><td class="num">${dias(et.solucion_comunicado)}</td></tr>
          </tbody></table>
          <p class="small" style="margin-top:8px">Promedio en días corridos. En un reclamo reabierto las etapas cuentan solo el último ciclo; el tiempo de respuesta total llega hasta la nueva comunicación.</p>
        </div>
        ${tabla('Por producto', m.porProducto, m.costoPorProducto, nomProd)}
        <p class="small">Los reclamos sin producto o sin planta solo entran en las vistas por área y por motivo.</p>
      </div>
    </div>`;
  const re = () => pintarPanel(el);
  $('#p-preset').onchange = e => { f.preset = e.target.value; if(f.preset !== 'custom') Object.assign(f, rangoPreset(f.preset)); re(); };
  $('#p-desde').onchange = e => { f.desde = e.target.value; re(); };
  $('#p-hasta').onchange = e => { f.hasta = e.target.value; re(); };
  $('#p-area').onchange = e => { f.area = e.target.value; re(); };
  $('#p-planta').onchange = e => { f.planta = e.target.value; re(); };
  $('#p-motivo').onchange = e => { f.motivo = e.target.value; re(); };
  $('#p-prod').onchange = e => { f.producto = e.target.value; re(); };
  $('#p-act').onclick = async () => { const b = $('#p-act'); b.disabled = true; PAN.ev = null; try{ await cargarReclamos(); }catch(x){ toast('No se pudo actualizar: ' + (x.message || x)); } renderPanel(el); };
  $('#p-csv').onclick = () => exportarCsv(base.filter(r => RC.enPeriodo(r, per)));
}
// CSV con ";" y BOM (Excel en español). Los textos que empiezan con = + - @ se neutralizan (inyección de fórmulas).
function exportarCsv(rs){
  const cab = ['Folio', 'Cliente', 'Producto', 'Planta', 'Motivo', 'Área', 'Estado', 'Recepción', 'Comunicado', 'Días de respuesta', 'Compensación'];
  const filas = rs.map(r => {
    const ini = String(r.fecha_recepcion).slice(0, 10), com = r.comunicado_en ? RC.diaCL(r.comunicado_en) : '';
    return [r.folio, r.cliente_nombre || '', r.producto_nombre || '', RC.labelDe(RC.PLANTAS, r.planta_destino || r.planta), labelMotivo(r.motivo), RC.labelDe(RC.AREAS, r.area_destino),
      RC.labelDe(RC.ESTADOS, r.estado), ini, com, com ? Math.max(0, RC.diasEntre(ini, com)) : '', r.compensacion == null ? '' : r.compensacion];
  });
  const q = v => { let s = String(v ?? ''); if(/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const txt = '﻿' + [cab, ...filas].map(f => f.map(q).join(';')).join('\r\n');
  const url = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = `reclamos-${hoyCL()}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ===================== Accesos (administración) ===================== */
let ACCD = null;
const AYUDA_ROL = {
  servicio_cliente: 'Registra por cualquier cliente, ve todos los reclamos, deriva, pide visita, define la solución, comunica y cierra.',
  asesor_tecnico: 'Ve los reclamos de calidad sin asesor y los que se le asignan; informa y decide.',
  encargado_area: 'Ve y decide los reclamos de su área (y de su planta en Producción).',
  encargado_calidad: 'Solo recibe copia («Informados») de los reclamos de calidad de su planta; no decide.',
  gerencia: 'Ve todos los reclamos y el panel de gestión.',
};
const etiquetaAlcance = a => RC.labelDe(RC.ROLES, a.rol) + (a.area ? ' · ' + RC.labelDe(RC.AREAS, a.area) : '') + (a.planta ? ' · ' + RC.labelDe(RC.PLANTAS, a.planta) : '');
async function renderAccesos(el){
  el.innerHTML = '<div class="card sin">Cargando…</div>';
  try{
    const [us, al, lg, pf] = await Promise.all([
      sb.from('rec_usuarios').select('id,activo').order('creado_en'),
      sb.from('rec_alcances').select('id,usuario_id,rol,area,planta').order('creado_en'),
      sb.from('rec_accesos_log').select('id,tipo,accion,usuario,objetivo,creado_en').order('id', { ascending: false }).limit(30),
      sb.from('profiles').select('id,nombre,email,activo').order('nombre')]);
    const e = us.error || al.error || lg.error || pf.error; if(e) throw new Error(e.message);
    ACCD = { us: us.data || [], al: al.data || [], log: lg.data || [], perfiles: pf.data || [] };
  }catch(e){
    el.innerHTML = `<div class="card sin">No se pudo cargar los accesos.<br><span class="small">${esc(e.message || e)}</span><div class="acciones" style="justify-content:center"><button class="btn" id="a-reint">Reintentar</button></div></div>`;
    $('#a-reint').onclick = () => renderAccesos(el); return;
  }
  pintarAccesos(el);
}
function pintarAccesos(el){
  const { us, al, log, perfiles } = ACCD;
  const nom = id => { const p = perfiles.find(x => x.id === id); return p ? (p.nombre || p.email) : 'Persona'; };
  const conAcceso = new Set(us.map(u => u.id));
  const candidatos = perfiles.filter(p => p.activo && !conAcceso.has(p.id));
  const personas = us.slice().sort((a, b) => nom(a.id).localeCompare(nom(b.id)));
  const textoLog = l => {
    const o = l.objetivo || {};
    if(l.tipo === 'alcance') return `${l.accion === 'alta' ? 'Agregó' : 'Quitó'} a ${nom(o.usuario)} el alcance «${etiquetaAlcance(o)}»`;
    return `${l.accion === 'alta' ? 'Creó' : 'Cambió'} el motivo «${o.nombre || o.id}»${o.activo === false ? ' (desactivado)' : ''}`;
  };
  el.innerHTML = `
    <div class="card">
      <h3>Quién usa el módulo</h3>
      <p class="aviso">Todo usuario con acceso puede ingresar reclamos y ver los suyos. Aquí se define qué más hace cada persona: <b>un rol</b> (y área y planta cuando corresponda). El administrador central ve y hace todo salvo decidir, para lo cual necesita el rol de asesor o de encargado.</p>
      ${candidatos.length ? `<div class="filtros" style="margin:0"><select id="a-nueva" aria-label="Persona"><option value="">Dar acceso al módulo a…</option>${candidatos.map(p => `<option value="${esc(p.id)}">${esc(p.nombre || p.email)}</option>`).join('')}</select><button class="btn sm" id="a-dar">Dar acceso</button></div>` : '<p class="small">Todas las personas activas ya tienen acceso.</p>'}
    </div>
    ${personas.length ? personas.map(u => {
      const mis = al.filter(a => a.usuario_id === u.id);
      return `<div class="card persona"><div class="top"><div><b>${esc(nom(u.id))}</b><br><span class="small">${esc((perfiles.find(p => p.id === u.id) || {}).email || '')}</span></div>${u.activo ? '' : '<span class="inact">Acceso desactivado en Usuarios</span>'}<button class="ghost btn sm" data-add="${esc(u.id)}">+ Agregar alcance</button></div>
        <div class="chips2"><span class="chip2" style="padding-right:11px;color:var(--mute)">Vendedor (todos)</span>${mis.map(a => `<span class="chip2">${esc(etiquetaAlcance(a))}<button type="button" data-del="${esc(a.id)}" aria-label="Quitar este alcance" title="Quitar">×</button></span>`).join('')}</div></div>`;
    }).join('') : '<div class="card sin">Nadie tiene acceso al módulo todavía.</div>'}
    <div class="card"><h3>Cambios recientes</h3>${log.length ? `<ol class="tl">${log.map(l => `<li><div class="t">${esc(textoLog(l))}</div><div class="w">${esc(nom(l.usuario))} · ${esc(fechaHora(l.creado_en))}</div></li>`).join('')}</ol>` : '<p class="small">Aún no hay cambios.</p>'}</div>`;
  const dar = $('#a-dar');
  if(dar) dar.onclick = async () => {
    const id = $('#a-nueva').value; if(!id) return toast('Elige a quién darle acceso.');
    dar.disabled = true; const { error } = await rpc('admin_set_modulo', { p_id: id, p_modulo: 'rec', p_activo: true, p_rol: null });
    if(!error) toast('Acceso al módulo dado.');
    renderAccesos(el);
  };
  el.querySelectorAll('[data-add]').forEach(b => { b.onclick = () => dlgAlcance(b.dataset.add, nom(b.dataset.add), el); });
  el.querySelectorAll('[data-del]').forEach(b => { b.onclick = () => dlgQuitarAlcance(al.find(a => a.id === b.dataset.del), nom, el); });
}
async function guardarAlcance(usuario, a, activo){
  try{
    const { error } = await sb.rpc('rec_set_alcance', { p_usuario: usuario, p_rol: a.rol, p_area: a.area || null, p_planta: a.planta || null, p_activo: activo });
    if(error) return error.message;
    try{ await cargarBase(); }catch(e){ /* mis propios alcances se refrescan al recargar */ }
    return null;
  }catch(e){ return 'Sin conexión. Intenta de nuevo.'; }
}
function dlgAlcance(uid, nombre, el){
  abrirDialogo({ titulo: 'Agregar alcance a ' + nombre, confirmar: 'Agregar',
    html: `<label>Rol</label><select name="rol">${optList(RC.ROLES, '', 'Elige el rol')}</select>
      <div id="al-area" hidden><label>Área</label><select name="area">${optList(RC.AREAS.filter(a => a.id !== 'calidad'), '', 'Elige el área')}</select></div>
      <div id="al-planta" hidden><label>Planta</label><select name="planta">${optList(RC.PLANTAS, '', 'Elige la planta')}</select></div>
      <div class="hint" id="al-ayuda">Elige el rol para ver qué puede hacer.</div>`,
    alAbrir: f => {
      const upd = () => {
        const rol = f.elements.rol.value, area = f.elements.area.value;
        $('#al-area').hidden = rol !== 'encargado_area';
        $('#al-planta').hidden = !(rol === 'encargado_calidad' || (rol === 'encargado_area' && area === 'produccion'));
        $('#al-ayuda').textContent = AYUDA_ROL[rol] || 'Elige el rol para ver qué puede hacer.';
      };
      f.elements.rol.onchange = upd; f.elements.area.onchange = upd; upd();
    },
    alEnviar: async f => {
      const rol = f.elements.rol.value, area = rol === 'encargado_area' ? f.elements.area.value : '', planta = f.elements.planta.value;
      if(!rol) return 'Elige el rol.';
      if(rol === 'encargado_area' && !area) return 'Elige el área.';
      const pl = rol === 'encargado_calidad' || (rol === 'encargado_area' && area === 'produccion');
      if(pl && !planta) return 'Elige la planta.';
      const msg = await guardarAlcance(uid, { rol, area, planta: pl ? planta : '' }, true);
      if(msg) return msg; toast('Alcance agregado.'); renderAccesos(el);
    } });
}
function dlgQuitarAlcance(a, nom, el){
  if(!a) return;
  abrirDialogo({ titulo: 'Quitar alcance', confirmar: 'Quitar', peligro: true,
    html: `<p>¿Quitar a <b>${esc(nom(a.usuario_id))}</b> el alcance «${esc(etiquetaAlcance(a))}»?</p><p class="small">Deja de ver y hacer lo que ese rol permitía. Lo que ya hizo queda en la historia.</p>`,
    alEnviar: async () => { const msg = await guardarAlcance(a.usuario_id, a, false); if(msg) return msg; toast('Alcance quitado.'); renderAccesos(el); } });
}

/* ===================== Motivos (administración) ===================== */
async function renderMotivos(el){
  try{ await cargarBase(); }catch(e){ toast('No se pudo actualizar el catálogo: ' + (e.message || e)); }
  const ms = MOTIVOS.slice().sort((a, b) => a.orden - b.orden);
  el.innerHTML = `<div class="card"><div class="top" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h3 style="margin:0">Catálogo de motivos</h3><button class="btn sm" id="m-nuevo">+ Nuevo motivo</button></div>
    <p class="aviso" style="margin-top:8px">Los motivos desactivados dejan de ofrecerse al ingresar, pero los reclamos que ya los usan no cambian. «Exige producto» pide el producto en el ingreso.</p>
    <table class="tbl"><thead><tr><th>Orden</th><th>Motivo</th><th>Producto</th><th>Área sugerida</th><th></th></tr></thead><tbody>
    ${ms.map(m => `<tr${m.activo ? '' : ' style="opacity:.55"'}><td class="num">${m.orden}</td><td>${esc(m.nombre)}${m.activo ? '' : ' <span class="small">(desactivado)</span>'}<br><span class="small">${esc(m.id)}</span></td><td>${m.requiere_producto ? 'Exige' : '—'}</td><td>${esc(m.area_sugerida ? RC.labelDe(RC.AREAS, m.area_sugerida) : '—')}</td><td><button class="ghost btn sm" data-edit="${esc(m.id)}">Editar</button></td></tr>`).join('')}
    </tbody></table></div>`;
  $('#m-nuevo').onclick = () => dlgMotivo(null, el);
  el.querySelectorAll('[data-edit]').forEach(b => { b.onclick = () => dlgMotivo(MOTIVOS.find(m => m.id === b.dataset.edit), el); });
}
const slugMotivo = s => {
  let t = sinTildes(s).replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40);
  if(!/^[a-z]/.test(t)) t = 'm_' + t;
  return t;
};
function dlgMotivo(m, el){
  const nuevo = !m;
  abrirDialogo({ titulo: nuevo ? 'Nuevo motivo' : 'Editar motivo', confirmar: 'Guardar',
    html: `<label>Nombre</label><input name="nombre" maxlength="80" value="${esc(m ? m.nombre : '')}">
      <label>Orden en la lista</label><input name="orden" type="number" min="0" max="999" value="${esc(m ? m.orden : (MOTIVOS.reduce((x, y) => Math.max(x, y.orden), 0) + 1))}">
      <label>Área sugerida <small>(se preselecciona al derivar)</small></label><select name="area">${optList(RC.AREAS, m ? (m.area_sugerida || '') : '', 'Sin sugerencia')}</select>
      <label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)"><input type="checkbox" name="req" style="width:auto"${m && m.requiere_producto ? ' checked' : ''}> Exige indicar el producto al ingresar</label>
      <label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)"><input type="checkbox" name="activo" style="width:auto"${!m || m.activo ? ' checked' : ''}> Activo (se ofrece al ingresar)</label>`,
    alEnviar: async f => {
      const nombre = f.elements.nombre.value.trim(); if(!nombre) return 'Escribe el nombre del motivo.';
      const orden = Number(f.elements.orden.value); if(!Number.isInteger(orden) || orden < 0) return 'El orden debe ser un número entero.';
      const id = nuevo ? slugMotivo(nombre) : m.id;
      if(nuevo && MOTIVOS.some(x => x.id === id)) return 'Ya existe un motivo con un nombre parecido. Usa otro nombre.';
      const { error } = await sb.rpc('rec_set_motivo', { p_id: id, p_nombre: nombre, p_requiere_producto: f.elements.req.checked, p_orden: orden, p_activo: f.elements.activo.checked, p_area_sugerida: f.elements.area.value || null });
      if(error) return error.message;
      toast('Motivo guardado.'); renderMotivos(el);
    } });
}

sb.auth.onAuthStateChange(ev => { if(ev === 'SIGNED_OUT') location.reload(); });
document.addEventListener('click', e => { const ir = e.target.closest('[data-ir]'); if(ir && !ir.closest('#lista')) location.hash = ir.dataset.ir; });
iniciar();
