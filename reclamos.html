<style>
:root{
  --brand:#ff2a4d;--brand-ink:#fff;--brand-soft:#3a0f18;
  --bg:#050505;--card:#0e0f11;--sunk:#17181b;--ink:#f4f4f4;--mute:#a4a7ae;
  --line:rgba(255,255,255,.22);--line-soft:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.55);
  --ok:#4fd18a;--bad:#ff6670;--warn:#f2b04a;--info:#79a8f0;--viol:#b98be6;--teal:#4cc9cb;--gris:#9aa3b4;
  --f-ui:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark}
:root[data-theme="light"]{
  --brand:#e4032e;--brand-soft:#fde7eb;--bg:#f2f2f0;--card:#ffffff;--sunk:#eaeae7;--ink:#121212;--mute:#5e6066;
  --line:rgba(0,0,0,.18);--line-soft:rgba(0,0,0,.08);--line-strong:rgba(0,0,0,.5);
  --ok:#18864a;--bad:#c4121f;--warn:#b86e00;--info:#2459a8;--viol:#8a4fbf;--teal:#0f8b8d;--gris:#6b7280;
  color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:var(--f-ui);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
.topin{display:flex;align-items:center;gap:14px;padding:12px max(20px,env(safe-area-inset-left,0px));max-width:1200px;margin:0 auto;flex-wrap:wrap}
.txmark{width:58px;flex:none;color:var(--ink);display:block}
.ttl{display:flex;flex-direction:column;margin-right:auto;min-width:0;line-height:1.15}
.ttl small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:700}
.ttl h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#estado-conexion{font-size:12px;color:var(--mute)}
.uchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line-soft);border-radius:99px;padding:4px 12px 4px 4px;color:var(--ink);text-decoration:none;font-size:13px}
.uchip .av{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:11.5px;font-weight:700}
.uchip .un{display:grid;line-height:1.15}.uchip .un b{font-size:12.5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.uchip .un small{font-size:10.5px;color:var(--mute);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs{display:flex;gap:6px;padding:0 max(20px,env(safe-area-inset-left,0px)) 10px;overflow-x:auto;max-width:1200px;margin:0 auto;scrollbar-width:none}
nav.tabs button{flex:none;border:1px solid transparent;background:transparent;color:var(--mute);padding:8px 14px;border-radius:10px;font-weight:600;font-size:13.5px;cursor:pointer}
nav.tabs button:hover{color:var(--ink);background:var(--sunk)}
nav.tabs button.on{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
main{padding:20px max(20px,env(safe-area-inset-left,0px)) 56px;max-width:1200px;margin:0 auto}
@media (max-width:560px){.topin{padding:10px 14px;gap:10px}.txmark{width:44px}.ttl h1{font-size:17px}.uchip{padding:3px}.uchip .un{display:none}nav.tabs{padding:0 14px 10px}main{padding:14px 14px 48px}}
h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:10px;background:var(--sunk);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
input[type=checkbox]{width:auto;accent-color:var(--brand)}
textarea{min-height:90px;resize:vertical}
.btn{background:var(--brand);color:var(--brand-ink);border:1px solid var(--brand);border-radius:10px;padding:9px 15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.6;cursor:wait}
.btn.ghost,button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line-strong);border-radius:10px;padding:9px 15px;font-weight:600;cursor:pointer}
.btn.sm{padding:6px 11px;font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:16px;margin-bottom:14px}
.aviso{color:var(--mute);font-size:12.5px;margin:0 0 12px}
.small{color:var(--mute);font-size:11.5px;white-space:normal}
.sin{color:var(--mute);text-align:center;padding:28px 8px}
.acciones{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.gate{max-width:420px;margin:48px auto;padding:24px}
.gate .txmark{width:110px;margin-bottom:18px}
.gate label,.f label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--mute);margin:14px 0 6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;transition:transform .25s,opacity .25s;opacity:0;pointer-events:none;font-size:13.5px;z-index:60;max-width:calc(100vw - 32px)}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
/* ---- bandeja ---- */
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{border:1px solid var(--line-strong);background:transparent;color:var(--mute);padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer}
.subtabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.subtabs .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--brand);color:var(--brand-ink);font-size:11px;font-weight:700;text-align:center}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:12px;margin-bottom:14px}
.filtros input[type=search]{flex:1 1 200px;width:auto}
.filtros select{flex:0 1 auto;width:auto;max-width:100%}
.filtros label{font-size:12.5px;color:var(--mute);display:flex;gap:6px;align-items:center}
.lista{display:grid;gap:10px}
a.rec{display:grid;gap:4px;background:var(--card);border:1px solid var(--line-soft);border-left:4px solid var(--gris);border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit}
a.rec:hover{border-color:var(--line-strong)}
a.rec:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a.rec.est-ingresado{border-left-color:var(--info)}a.rec.est-derivado{border-left-color:var(--warn)}a.rec.est-en_verificacion{border-left-color:var(--viol)}
a.rec.est-aprobado{border-left-color:var(--ok)}a.rec.est-rechazado{border-left-color:var(--bad)}a.rec.est-solucion_definida{border-left-color:var(--teal)}
a.rec.est-comunicado{border-left-color:var(--info)}a.rec.est-cerrado,a.rec.est-anulado{border-left-color:var(--gris)}
a.rec.est-anulado{opacity:.65}
.rec-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.folio{font-family:var(--f-mono);font-size:12.5px;font-weight:700}
.est{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid var(--line-strong);color:var(--ink);white-space:nowrap}
.est.est-ingresado{color:var(--info);border-color:var(--info)}.est.est-derivado{color:var(--warn);border-color:var(--warn)}.est.est-en_verificacion{color:var(--viol);border-color:var(--viol)}
.est.est-aprobado{color:var(--ok);border-color:var(--ok)}.est.est-rechazado{color:var(--bad);border-color:var(--bad)}.est.est-solucion_definida{color:var(--teal);border-color:var(--teal)}
.est.est-comunicado{color:var(--info);border-color:var(--info)}.est.est-cerrado,.est.est-anulado{color:var(--gris);border-color:var(--gris)}
.edad{margin-left:auto;font-size:12px;color:var(--mute);font-family:var(--f-mono)}
.edad.alta{color:var(--bad);font-weight:700}
.pend{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--brand)}
.pend::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand)}
.rec-cli{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis}
.rec-mot,.rec-resp{color:var(--mute);font-size:12.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.plt{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--mute)}
</style>
</head>

<script>
/* ===================== Configuración ===================== */
const SB_URL = 'https://xinnonzltoaoptnvkhhy.supabase.co';
const SB_KEY = 'sb_publishable_DoSRSj0wmAR_UIX8tENXXQ_X5BS5a1q';
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
const EN_PORTAL = window.top !== window;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iniciales = s => String(s || '?').split(/[\s@.]+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const clp = RC.clp;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 3600); }
function setConexion(html){ $('#estado-conexion').innerHTML = html; }
const hoyCL = () => RC.diaCL(new Date().toISOString());
// Fecha corta en español de Chile: "27 nov" (con el año si no es el actual). Acepta "YYYY-MM-DD" o un instante ISO.
function fechaCorta(s){
  if(!s) return '';
  const d = new Date(String(s).length === 10 ? s + 'T12:00:00' : s);
  if(isNaN(d.getTime())) return '';
  const o = { day: 'numeric', month: 'short', timeZone: 'America/Santiago' };
  if(d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('es-CL', o).replace(/\./g, '');
}
// Llama a una función de la base. Muestra el mensaje de la base como aviso y devuelve { data } o { error }.
async function rpc(nombre, args){
  try{
    const { data, error } = await sb.rpc(nombre, args || {});
    if(error){ toast(error.message || 'No se pudo completar la acción.'); return { error }; }
    return { data };
  }catch(e){ toast('Sin conexión. Intenta de nuevo.'); return { error: e }; }
}

/* ===================== Estado ===================== */
let me = null;          // {id, email, nombre, admin}
let ALC = [];           // alcances propios [{rol, area, planta}] (el rol "vendedor" lo tiene todo usuario del módulo)
let MOTIVOS = [];       // catálogo de motivos
let RECS = [];          // reclamos que puedo ver
let NOMBRES = {};       // id de persona -> nombre (null si no se pudo resolver)
let ultimaCarga = 0;
const F = { tab: 'pend', estado: '', area: '', planta: '', q: '', anulados: false };
const labelMotivo = id => (MOTIVOS.find(m => m.id === id) || {}).nombre || id || '';
const nombreDe = id => (id && NOMBRES[id]) || '';
const COLS = 'id,folio,cliente_id,cliente_nombre,producto,producto_nombre,planta,motivo,descripcion,fecha_recepcion,estado,area_destino,planta_destino,asesor_id,decision,compensacion,comunicado_en,cerrado_en,creado_por,creado_en,actualizado_en';

/* ===================== Sesión y acceso ===================== */
function pantallaLogin(msg){
  $('#nav').hidden = true;
  setConexion(EN_PORTAL ? '' : '<a href="./">Portal</a>');
  $('#app').innerHTML = `<form class="card gate" id="login">
    <span class="txmark">${$('.topbar .txmark').innerHTML}</span>
    <h2>Ingresar</h2>
    ${msg ? `<div class="aviso" style="margin-top:8px">${esc(msg)}</div>` : ''}
    <label>Correo</label><input id="lg-email" type="email" autocomplete="username" required>
    <label>Contraseña</label><input id="lg-pass" type="password" autocomplete="current-password" required>
    <div class="acciones"><button class="btn" id="lg-btn" type="submit">Ingresar</button></div>
    <p class="small" style="margin-top:12px">Usa el mismo correo y contraseña de las apps Grupo TX.</p>
  </form>`;
  $('#login').onsubmit = async e => {
    e.preventDefault();
    const b = $('#lg-btn'); b.disabled = true; b.textContent = 'Ingresando…';
    const { error } = await sb.auth.signInWithPassword({ email: $('#lg-email').value.trim(), password: $('#lg-pass').value });
    if(error) return pantallaLogin(/invalid/i.test(error.message) ? 'Correo o contraseña incorrectos.' : error.message);
    iniciar();
  };
}
function tarjeta(titulo, html){
  $('#nav').hidden = true;
  $('#app').innerHTML = `<div class="card gate"><h2>${titulo}</h2>${html}</div>`;
}
const botonesSalida = () => `<div class="acciones">${EN_PORTAL ? '' : '<a class="btn" href="./">Volver al portal</a>'}<button class="ghost" id="b-salir">Cerrar sesión</button></div>`;
function ligarSalida(){ const b = $('#b-salir'); if(b) b.onclick = () => sb.auth.signOut().then(() => location.reload()); }

async function iniciar(){
  setConexion('Conectando…');
  const { data: { session } } = await sb.auth.getSession();
  if(!session) return pantallaLogin();
  let prof = null, acceso = null;
  try{
    const [a, p] = await Promise.all([
      sb.rpc('rec_tengo_acceso'),
      sb.from('profiles').select('nombre,email,rol,activo').eq('id', session.user.id).maybeSingle()]);
    acceso = a; prof = p.data;
  }catch(e){ acceso = { error: e }; }
  const p = prof || {};
  me = { id: session.user.id, email: session.user.email,
         nombre: p.nombre || session.user.user_metadata?.nombre || session.user.email.split('@')[0],
         admin: !!(p.activo && p.rol === 'admin') };
  setConexion(esc(me.nombre));
  if(!acceso || acceso.error){
    tarjeta('No se pudo verificar tu acceso', `<p class="small">Revisa tu conexión e inténtalo de nuevo.</p><div class="acciones"><button class="btn" id="b-reint">Reintentar</button></div>`);
    $('#b-reint').onclick = iniciar;
    return;
  }
  if(!acceso.data){
    tarjeta('Sin acceso a Reclamos', `<p>Tu cuenta (${esc(me.email)}) todavía no tiene acceso a este módulo. Pídele al administrador que te habilite en <b>Usuarios y accesos</b>.</p>${botonesSalida()}`);
    ligarSalida();
    return;
  }
  // 2FA: si falla por red u otra razón, TMfa.gate no bloquea (ver mfa-gate.js).
  if(!(await TMfa.gate(sb, { requireEnrollment: me.admin }))) return;
  try{ await cargarBase(); await cargarReclamos(); }
  catch(e){
    tarjeta('No se pudieron cargar los datos', `<p class="small">${esc(e.message || e)}</p><div class="acciones"><button class="btn" id="b-reint">Reintentar</button></div>`);
    $('#b-reint').onclick = iniciar;
    return;
  }
  setConexion(`<a class="uchip" ${EN_PORTAL ? '' : 'href="./" title="Volver al portal"'}><span class="av">${esc(iniciales(me.nombre))}</span><span class="un"><b>${esc(me.nombre)}</b><small>${esc(rolesTxt())}</small></span></a>`);
  $('#nav').hidden = false;
  $('#app').innerHTML = shell();
  ligarEventos();
  mostrar();
}
const rolesTxt = () => {
  const r = [...new Set(ALC.map(a => RC.labelDe(RC.ROLES, a.rol)))];
  return (me.admin ? ['Administrador'] : []).concat(r.length ? r : ['Vendedor']).join(' · ');
};
async function cargarBase(){
  const [al, mo] = await Promise.all([
    sb.from('rec_alcances').select('rol,area,planta').eq('usuario_id', me.id),
    sb.from('rec_motivos').select('id,nombre,requiere_producto,area_sugerida,orden,activo').order('orden')]);
  if(al.error || mo.error) throw new Error((al.error || mo.error).message);
  ALC = al.data || []; MOTIVOS = mo.data || [];
}
async function resolverNombres(ids){
  const falta = [...new Set(ids.filter(x => x && !(x in NOMBRES)))];
  for(let i = 0; i < falta.length; i += 200){
    const lote = falta.slice(i, i + 200);
    const { data } = await sb.rpc('rec_nombres', { p_ids: lote });
    (data || []).forEach(p => { NOMBRES[p.id] = p.nombre; });
    lote.forEach(id => { if(!(id in NOMBRES)) NOMBRES[id] = null; });
  }
}
async function cargarReclamos(){
  const { data, error } = await sb.from('rec_reclamos').select(COLS).order('creado_en', { ascending: false }).limit(1000);
  if(error) throw new Error(error.message);
  RECS = data || [];
  try{ await resolverNombres(RECS.flatMap(r => [r.asesor_id, r.creado_por])); }catch(e){ /* los nombres son accesorios */ }
  ultimaCarga = Date.now();
}

/* ===================== Estructura y rutas ===================== */
function shell(){
  return `<section data-v="bandeja" id="v-bandeja" hidden></section>
  <section data-v="nuevo" id="v-nuevo" hidden></section>
  <section data-v="detalle" id="v-detalle" hidden></section>`;
}
function ligarEventos(){
  $('#nav').onclick = e => { const b = e.target.closest('button[data-v]'); if(b) location.hash = b.dataset.v; };
  addEventListener('hashchange', mostrar);
}
function ruta(){
  const h = location.hash.replace(/^#/, '');
  if(h.startsWith('r/')) return { v: 'detalle', id: h.slice(2) };
  if(['nuevo'].includes(h)) return { v: h };
  return { v: 'bandeja' };
}
function mostrar(){
  if(!me || !$('#v-bandeja')) return;
  const r = ruta();
  document.querySelectorAll('[data-v]').forEach(el => {
    if(el.tagName === 'SECTION') el.hidden = el.dataset.v !== r.v;
    else el.classList.toggle('on', el.dataset.v === (r.v === 'detalle' ? 'bandeja' : r.v));
  });
  window.scrollTo(0, 0);
  if(r.v === 'bandeja') renderBandeja();
  else if(r.v === 'nuevo') renderNuevo($('#v-nuevo'));
  else renderDetalle($('#v-detalle'), r.id);
}

/* ===================== Bandeja ===================== */
function visibles(){
  const q = F.q.trim().toLowerCase();
  let rs = RECS.filter(r => {
    if(F.tab === 'pend' && !RC.pendienteDeMi(r, ALC, me.admin, me.id)) return false;
    if(F.tab === 'info' && !RC.esInformado(r, ALC)) return false;
    if(r.estado === 'anulado' && !F.anulados && F.estado !== 'anulado') return false;
    if(F.estado && r.estado !== F.estado) return false;
    if(F.area && r.area_destino !== F.area) return false;
    if(F.planta && (r.planta_destino || r.planta) !== F.planta) return false;
    if(q){
      const hay = [r.folio, r.cliente_nombre, r.producto_nombre, r.producto, r.descripcion, labelMotivo(r.motivo)].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  // Los pendientes van del más antiguo al más nuevo (lo que lleva más tiempo esperando, primero).
  if(F.tab === 'pend') rs = rs.slice().sort((a, b) => String(a.fecha_recepcion).localeCompare(String(b.fecha_recepcion)));
  return rs;
}
function antiguedad(r){
  const fin = r.comunicado_en ? RC.diaCL(r.comunicado_en) : hoyCL();
  const ini = String(r.fecha_recepcion).slice(0, 10);
  return Math.max(0, RC.fechaValida(ini) && fin ? RC.diasEntre(ini, fin) : 0);
}
function responsable(r){
  switch(r.estado){
    case 'ingresado': return 'Servicio al cliente · por derivar';
    case 'derivado': return RC.labelDe(RC.AREAS, r.area_destino) + (r.planta_destino ? ' · ' + RC.labelDe(RC.PLANTAS, r.planta_destino) : '');
    case 'en_verificacion': return 'Asesor técnico · ' + (nombreDe(r.asesor_id) || 'sin nombre');
    case 'aprobado': case 'rechazado': case 'solucion_definida': case 'comunicado': return 'Servicio al cliente';
    default: return '';
  }
}
function filaRec(r){
  const d = antiguedad(r), abierto = !['comunicado', 'cerrado', 'anulado'].includes(r.estado);
  const plt = r.planta_destino || r.planta;
  const pendiente = F.tab !== 'pend' && RC.pendienteDeMi(r, ALC, me.admin, me.id);
  return `<a class="rec est-${esc(r.estado)}" href="#r/${esc(r.id)}">
    <div class="rec-top"><b class="folio">${esc(r.folio)}</b><span class="est est-${esc(r.estado)}">${esc(RC.labelDe(RC.ESTADOS, r.estado))}</span>${pendiente ? '<span class="pend">Pendiente de ti</span>' : ''}<span class="edad${abierto && d >= 7 ? ' alta' : ''}" title="Días desde la recepción">${d} d</span></div>
    <div class="rec-cli">${esc(r.cliente_nombre || 'Cliente sin nombre')}</div>
    <div class="rec-mot"><span>${esc(labelMotivo(r.motivo))}</span>${r.producto_nombre ? `<span>· ${esc(r.producto_nombre)}</span>` : ''}${plt ? `<span class="plt">${esc(RC.labelDe(RC.PLANTAS, plt))}</span>` : ''}</div>
    <div class="rec-resp"><span>${esc(responsable(r))}</span><span>· Recibido ${esc(fechaCorta(r.fecha_recepcion))}</span></div>
  </a>`;
}
function listaHtml(){
  const rs = visibles();
  if(rs.length) return `<div class="lista">${rs.map(filaRec).join('')}</div>`;
  if(!RECS.length) return `<div class="card sin"><b>Aún no hay reclamos.</b><br><span class="small">Cuando se ingrese uno aparecerá aquí.</span><div class="acciones" style="justify-content:center"><button class="btn" data-ir="nuevo">Nuevo reclamo</button></div></div>`;
  const hayFiltro = F.estado || F.area || F.planta || F.q.trim() || F.anulados;
  if(F.tab === 'pend' && !hayFiltro) return `<div class="card sin"><b>No tienes reclamos pendientes.</b><br><span class="small">Lo que dependa de ti aparecerá aquí.</span></div>`;
  if(F.tab === 'info' && !hayFiltro) return `<div class="card sin"><b>No hay reclamos de calidad en tu planta.</b></div>`;
  return `<div class="card sin"><b>Ningún reclamo coincide con los filtros.</b><div class="acciones" style="justify-content:center"><button class="ghost" data-limpiar>Quitar filtros</button></div></div>`;
}
function renderBandeja(){
  const el = $('#v-bandeja');
  const nPend = RECS.filter(r => RC.pendienteDeMi(r, ALC, me.admin, me.id)).length;
  const nInfo = RECS.filter(r => RC.esInformado(r, ALC)).length;
  const conInfo = ALC.some(a => a.rol === 'encargado_calidad');
  if(!conInfo && F.tab === 'info') F.tab = 'pend';
  const opt = (lista, v) => lista.map(x => `<option value="${esc(x.id)}"${x.id === v ? ' selected' : ''}>${esc(x.label)}</option>`).join('');
  el.innerHTML = `
    <div class="subtabs" id="subtabs">
      <button data-tab="pend" class="${F.tab === 'pend' ? 'on' : ''}">Pendientes de mí${nPend ? `<span class="n">${nPend}</span>` : ''}</button>
      <button data-tab="todos" class="${F.tab === 'todos' ? 'on' : ''}">Todos los que puedo ver<span class="n" style="background:var(--sunk);color:var(--mute)">${RECS.filter(r => r.estado !== 'anulado').length}</span></button>
      ${conInfo ? `<button data-tab="info" class="${F.tab === 'info' ? 'on' : ''}">Informados${nInfo ? `<span class="n" style="background:var(--sunk);color:var(--mute)">${nInfo}</span>` : ''}</button>` : ''}
    </div>
    <div class="filtros">
      <input type="search" id="f-q" placeholder="Buscar por folio, cliente, producto o texto" value="${esc(F.q)}" aria-label="Buscar">
      <select id="f-estado" aria-label="Estado"><option value="">Todos los estados</option>${opt(RC.ESTADOS, F.estado)}</select>
      <select id="f-area" aria-label="Área"><option value="">Todas las áreas</option>${opt(RC.AREAS, F.area)}</select>
      <select id="f-planta" aria-label="Planta"><option value="">Todas las plantas</option>${opt(RC.PLANTAS, F.planta)}</select>
      <label><input type="checkbox" id="f-anul"${F.anulados ? ' checked' : ''}> Ver anulados</label>
      <button class="ghost btn sm" id="f-act" title="Volver a cargar los reclamos">Actualizar</button>
    </div>
    <div id="lista">${listaHtml()}</div>`;
  $('#subtabs').onclick = e => { const b = e.target.closest('button[data-tab]'); if(b){ F.tab = b.dataset.tab; renderBandeja(); } };
  $('#f-q').oninput = e => { F.q = e.target.value; refrescarLista(); };
  $('#f-estado').onchange = e => { F.estado = e.target.value; refrescarLista(); };
  $('#f-area').onchange = e => { F.area = e.target.value; refrescarLista(); };
  $('#f-planta').onchange = e => { F.planta = e.target.value; refrescarLista(); };
  $('#f-anul').onchange = e => { F.anulados = e.target.checked; refrescarLista(); };
  $('#f-act').onclick = async () => { const b = $('#f-act'); b.disabled = true; try{ await cargarReclamos(); }catch(e){ toast('No se pudo actualizar: ' + (e.message || e)); } renderBandeja(); };
  if(Date.now() - ultimaCarga > 30000) recargarSilencioso();
}
function refrescarLista(){
  $('#lista').innerHTML = listaHtml();
  ligarListaAcciones();
}
function ligarListaAcciones(){
  const lim = $('#lista [data-limpiar]');
  if(lim) lim.onclick = () => { Object.assign(F, { estado: '', area: '', planta: '', q: '', anulados: false }); renderBandeja(); };
  const ir = $('#lista [data-ir]');
  if(ir) ir.onclick = () => { location.hash = ir.dataset.ir; };
}
// Al volver a la bandeja con datos viejos, se recarga sin molestar y se redibuja si no se está escribiendo.
async function recargarSilencioso(){
  ultimaCarga = Date.now();
  try{ await cargarReclamos(); }catch(e){ return; }
  const el = $('#v-bandeja');
  if(el && !el.hidden && document.activeElement?.id !== 'f-q') renderBandeja();
}

/* ===================== Ingreso y detalle: se completan en las Tareas 8 y 9 ===================== */
function renderNuevo(el){ el.innerHTML = `<div class="card sin">El ingreso de reclamos se habilita en el siguiente paso.</div>`; }
function renderDetalle(el, id){ el.innerHTML = `<div class="card sin">Detalle del reclamo <b>${esc(id)}</b> (siguiente paso).<div class="acciones" style="justify-content:center"><a class="btn ghost" href="#bandeja">Volver a la bandeja</a></div></div>`; }

sb.auth.onAuthStateChange(ev => { if(ev === 'SIGNED_OUT') location.reload(); });
document.addEventListener('click', e => { const ir = e.target.closest('[data-ir]'); if(ir && !ir.closest('#lista')) location.hash = ir.dataset.ir; });
iniciar();
</script>
</body>
</html>
